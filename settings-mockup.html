<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mallard-logo.svg" />
    <title>Settings page — proposal</title>
    <style>
      /* Proposed additions for the Settings page. Everything else on the page
         is the shipped skin (App.css + RetroTheme.css, loaded by the TSX).

         Destination when this ships:
           - layout/control rules → App.css under a "Settings page" section
           - the pixel-face declaration on .sync-settings-group > h2 moves into
             RetroTheme.css's shared pixel-face selector list instead (a test
             counts --font-pixel declarations there; only the list may carry it)

         All values are existing tokens; no new colors, sizes, or radii. */

      /* The trail of storage pages caps this at `none`; settings is a form and
         reads at a column. Extra class qualifies over RetroTheme's rule. */
      .sync-main.sync-settings-page .profile-links-section { max-width: 760px; }

      .sync-settings-group { margin: 0 0 30px; }

      .sync-settings-group > h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 10px;
        color: var(--text-0);
        font-family: var(--font-pixel); /* production: RetroTheme list, see above */
        font-size: var(--type-xl);
        font-weight: var(--weight-regular);
        letter-spacing: 0;
      }

      .sync-settings-group > h2 > svg { color: var(--text-1); }

      /* Same card recipe as .project-storage-group. */
      .sync-settings-card {
        border: 1px solid var(--border-mid);
        border-radius: 6px;
        background: var(--surface-card);
      }

      .sync-settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 13px 16px;
      }

      .sync-settings-row + .sync-settings-row { border-top: 1px solid var(--border); }

      .sync-settings-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }

      .sync-settings-copy strong {
        color: var(--text-0);
        font-size: var(--type-sm);
        font-weight: var(--weight-semibold);
      }

      /* Sentences the app wrote: clean face, prose leading. */
      .sync-settings-copy p {
        margin: 0;
        max-width: 54ch;
        color: var(--text-2);
        font-family: var(--font-sans);
        font-size: var(--type-xs);
        line-height: var(--leading-snug);
      }

      .sync-settings-copy p code {
        font-family: var(--font-mono);
        font-size: var(--type-2xs);
      }

      .sync-settings-control { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

      /* The switch the palette always carried tokens for (--switch-off,
         --switch-thumb). Same construction as the app's drawn checkboxes:
         appearance none, state on the input, thumb on ::before. Checked rides
         --accent with the thumb in --accent-contrast, so both palettes keep
         the thumb visible; motion is the skin's stepped transition. */
      .sync-settings-switch {
        appearance: none;
        position: relative;
        width: 36px;
        height: 20px;
        margin: 0;
        flex: 0 0 auto;
        border: 1px solid var(--control-border);
        border-radius: 4px;
        background: var(--switch-off);
        cursor: pointer;
        transition: background 90ms steps(2, end), border-color 90ms steps(2, end);
      }

      .sync-settings-switch::before {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: var(--switch-thumb);
        transition: transform 90ms steps(2, end);
      }

      .sync-settings-switch:checked {
        border-color: var(--accent);
        background: var(--accent);
      }

      .sync-settings-switch:checked::before {
        transform: translateX(16px);
        background: var(--accent-contrast);
      }

      /* Closed-vocabulary choices (System/Light/Dark): a segmented control on
         the button tokens, active segment on the same surface as an active
         nav row. */
      .sync-settings-segment {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--button-border);
        border-radius: var(--button-radius);
        background: var(--button-bg);
      }

      .sync-settings-segment > button {
        height: 28px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--text-1);
        font-family: var(--font-pixel); /* production: RetroTheme list */
        font-size: var(--type-sm);
        cursor: pointer;
      }

      .sync-settings-segment > button + button { border-left: 1px solid var(--button-border); }

      .sync-settings-segment > button:hover:not(.active) { background: var(--button-bg-hover); }

      .sync-settings-segment > button.active {
        background: var(--surface-row-active);
        color: var(--text-0);
      }

      /* A stated fact, not a control: the redaction status chip, on the badge
         recipe (.sync-history-branch-state). */
      .sync-settings-flag {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border: 1px solid var(--border-mid);
        border-radius: 3px;
        background: var(--chip-bg);
        color: var(--accent);
        font-family: var(--font-pixel); /* production: RetroTheme list */
        font-size: var(--type-3xs);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* A measurement: mono, tabular, holds its width. */
      .sync-settings-readout {
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: var(--type-xs);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .sync-settings-control .sync-select-shell { flex: 0 0 auto; width: 150px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/settings-mockup.tsx"></script>
  </body>
</html>
