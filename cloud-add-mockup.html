<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add from Mallard Cloud — the style pass</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .harness { max-width: 1360px; margin: 0 auto; padding: 14px 20px 60px; display: grid; gap: 12px; font: 13px/1.45 system-ui, sans-serif; }
      .harness-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .harness-controls > strong { font-size: 13px; }
      .harness-scenes { display: flex; flex-wrap: wrap; gap: 4px; }
      .harness-scenes button { padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: inherit; font-size: 12px; cursor: pointer; }
      .harness-scenes button b { color: var(--text-3); font-weight: 600; margin-right: 2px; }
      .harness-scenes button.pick { border-color: var(--border-strong); }
      .harness-scenes button.active { border-color: var(--text-1); background: var(--text-0); color: var(--bg-0); }
      .harness-scenes button.active b { color: inherit; opacity: 0.7; }
      .harness-toggles { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
      .harness-toggles > span { display: inline-flex; gap: 3px; align-items: center; }
      .harness-toggles > span > b { margin-right: 3px; color: var(--text-2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .harness-toggles button { padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: inherit; font-size: 12px; cursor: pointer; }
      .harness-toggles button[aria-pressed="true"] { border-color: var(--text-1); background: var(--text-0); color: var(--bg-0); }
      .harness-toggles label { display: inline-flex; gap: 6px; align-items: center; }
      .harness-notes { display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .harness-notes p { margin: 0; color: var(--text-1); }
      .harness-notes p > span { display: inline-block; min-width: 74px; margin-right: 6px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

      /* The stage: one dialog, in place, at the width it has in the app. */
      .stage { display: flex; justify-content: center; align-items: flex-start; padding: 26px 0 10px; }
      .stage > .mock-frozen-dialog { width: 680px; max-width: 100%; max-height: 720px; }
      .stage.page > .sync-inline-new-project { width: 760px; max-width: 100%; margin: 0; }
      .mock-frozen-dialog { position: static; inset: auto; max-width: none; max-height: none; margin: 0; }
      /* A frozen dialog has no top layer and no backdrop: the frame's border
         stands for the app's blur. */
      .mock-frozen-dialog, .stage.page > .sync-inline-new-project { box-shadow: var(--shadow-card); }

      /* Boards: several frozen dialogs, captioned. */
      .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 22px 24px; align-items: start; }
      .board.pair { grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); }
      .board > figure { margin: 0; display: grid; gap: 8px; align-content: start; }
      .board > figure > figcaption { font: 600 12.5px/1.35 system-ui; color: var(--text-1); }
      .board > figure > figcaption > small { display: block; margin-top: 2px; font-weight: 400; color: var(--text-3); }
      .board > figure > figcaption > i { font-style: normal; color: var(--text-3); margin-right: 6px; }
      .board .mock-frozen-dialog { width: 100%; }
      .board .sync-inline-new-project { margin: 0; }

      /* The standards board: who says what, and what it means here. */
      .standards { display: grid; gap: 10px; }
      .standards table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      .standards th, .standards td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; text-align: left; }
      .standards th { color: var(--text-2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .standards td:first-child { width: 21%; font-weight: 600; }
      .standards td:first-child a { color: var(--text-0); }
      .standards td:first-child small { display: block; margin-top: 2px; color: var(--text-3); font-weight: 400; }
      .standards td:nth-child(3) { width: 36%; }
      .standards td:nth-child(3) b { color: var(--text-0); }
      .standards p { margin: 0; color: var(--text-1); }

      /* ——— proposed app CSS (would land in App.css) ———————————————— */
      /* Fewer words: the field's label repeats its placeholder. */
      .cloud-add .sync-folder-field > span:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .cloud-add .sync-folder-field > div > .btn.repo-verb { min-width: 104px; }

      /* S1 · the review strip's tabs at the dialog's measure; the sort rides
         at the strip's end on the Public tab. */
      .cloud-add-tabs { min-height: 36px; margin: 0; padding: 0; gap: 18px; }
      .cloud-add-tabs > button { min-height: 35px; font-size: var(--type-xs); }
      .cloud-add-tabs > button > svg { flex: none; }
      .cloud-add-tabs > .cloud-add-sort { margin-left: auto; margin-bottom: 5px; }
      .cloud-add-sort button { height: 22px; padding: 0 8px; }

      /* S2 · setup's pill row as the scope switch; the sort at its end. */
      .cloud-add-pills { align-items: center; }
      .cloud-add-pills > .cloud-add-sort { margin-left: auto; }
      /* The Catalog card in the dialog: the list's own variables, as the row
         page sets them. */
      .cloud-add-cards { --sync-history-row-actions-column: auto; --sync-history-row-column-gap: 12px; --sync-history-row-icon-size: 18px; --sync-history-row-title-gap: 8px; --sync-history-row-text-offset: 26px; }
      .cloud-add-cards > .sync-history-thread-card { border: var(--box-border); border-radius: var(--retro-panel-radius); box-shadow: var(--shadow-card); }

      /* S3 · the row page's section headings inside the dialog: the first
         one sits right under the field. */
      .cloud-add-section > .sync-history-section-heading { margin: 14px 0 6px; }
      .cloud-add-section:first-child > .sync-history-section-heading { margin-top: 2px; }
      .cloud-add-section > .repo-list-empty { margin: 0 0 2px; }
      .cloud-add .sync-history-rail-foot { --sync-history-card-offset: 0px; }
      .cloud-add .sync-history-rail-foot.no-rail { margin-top: 8px; }
      .cloud-add .sync-history-rail-step > span { color: var(--text-3); font-size: var(--type-2xs); }

      /* The rows: the connect dialog's choice rows with the Catalog card's
         preview tile, a blurb line, and a meta column that says role, stars
         and age. */
      .cloud-add-row { align-items: flex-start; }
      .cloud-add-row > .sync-bundle-radio { margin-top: 5px; }
      .cloud-add .catalog-pet-preview.small { width: 36px; height: 40px; border-radius: 8px; }
      .cloud-add-row > .sync-storage-repository-icon { margin-top: 1px; }
      .cloud-add-row .sync-bundle-choice-copy strong,
      .cloud-add-row .sync-bundle-match-copy strong { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .cloud-add-row .sync-bundle-choice-copy strong > span,
      .cloud-add-row .sync-bundle-match-copy strong > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: inherit; font-size: inherit; color: inherit; }
      .cloud-add-row .sync-bundle-choice-copy strong > svg,
      .cloud-add-row .sync-bundle-match-copy strong > svg { flex: none; color: var(--text-3); }
      .cloud-add-row .sync-bundle-choice-copy strong > code,
      .cloud-add-row .sync-bundle-match-copy strong > code { flex: none; color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-3xs); font-weight: var(--weight-regular); }
      .cloud-add-row .sync-bundle-choice-copy > span.cloud-add-blurb { font-family: var(--font); font-size: var(--type-2xs); color: var(--text-2); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .cloud-add-row .sync-bundle-choice-meta { gap: 2px; }
      .cloud-add-row .sync-bundle-choice-meta small { display: inline-flex; align-items: center; gap: 4px; }
      .cloud-add-row .sync-bundle-choice-meta small > svg { color: var(--text-3); }
      .cloud-add-row.starred .sync-bundle-choice-meta small > svg { color: var(--warning-text); }
      /* The page's rows: setup's square radios and a 24px mark. */
      .sync-bundle-match-option.cloud-add-row .sync-bundle-match-copy span.cloud-add-blurb { font-family: var(--font); white-space: normal; }
      /* The empty tab says what it would hold and offers the other way in. */
      .cloud-add-empty { border-bottom: 0; }
      .cloud-add-empty .btn-link { font-size: var(--type-xs); }

      /* The second-field layout: a search over the lists, the address way at
         the end under its own head. */
      .cloud-add-search { margin-bottom: 0; }
      .cloud-add-search .sync-name-search-input { height: 34px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cloud-add-mockup.tsx"></script>
  </body>
</html>
