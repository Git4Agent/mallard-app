<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mallard mark, 20x20 pixel grid.

  Quantized from the earlier Bezier silhouette at 50% coverage, so the pose and
  proportions are unchanged and only the resolution differs. 20 is the largest
  grid the source survives cleanly: at 24 and above the collar stroke clips the
  neck and leaves stray single cells floating in the body. The collar itself is
  thinner than one cell at this size, so it does not survive; bringing it back
  means drawing it as a deliberate one cell notch rather than inheriting it.

  The fill is literal rather than currentColor because this file is loaded
  through an img element, which gives it no CSS context. The dark theme inverts
  it with a filter; see .sync-brand-logo in RetroTheme.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20"
     shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Mallard</title>
  <path
    fill="#050913"
    d="M13 3h3v1h-3ZM12 4h5v2h-5ZM12 6h7v1h-7ZM12 7h3v3h-3ZM7 10h9v1h-9ZM2 11h15v1h-15ZM1 12h16v2h-16ZM2 14h15v1h-15ZM3 15h13v1h-13ZM5 16h10v1h-10Z"
  />
</svg>
