[workspace]
members = [
  "src-tauri",
  "crates/mallard-application",
  "crates/mallard-cli",
  "crates/mallard-domain",
  "crates/mallard-infrastructure",
]
default-members = ["src-tauri"]
# A virtual workspace without an explicit resolver falls back to resolver 1;
# "2" matches what the pre-workspace edition-2021 package used.
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
# Keep source locations in development backtraces without retaining full type
# and variable information for every workspace object.
debug = "line-tables-only"

# Optimize dependencies only: the wildcard excludes workspace members, so app
# edits keep opt-level 0 incremental builds while serde_json/sha2/aws-* run
# optimized (~3.9× on transcript analysis). Dependencies do not need debugger
# information during ordinary application development.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.test]
# Unit-test failures retain source locations, while completed test builds do
# not leave a separate incremental cache for every workspace test crate.
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
opt-level = 1
debug = false

[profile.debugging]
# Full debugger information remains an explicit, disposable build mode.
inherits = "dev"
debug = "full"
incremental = false
