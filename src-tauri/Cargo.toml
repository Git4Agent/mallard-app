[package]
name = "mallard"
version = "0.1.2"
description = "Mallard — sync Codex and Claude project resources"
authors = ["you"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "5"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
# Base64 for x-amz-checksum-sha256 values; already in the tree via aws-sdk-s3.
aws-smithy-types = "1"
bytes = "1"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
tempfile = "3"
getrandom = "0.3"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
notify = "8.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# `test` enables tauri::test::{mock_builder, MockRuntime} for the headless
# integration tests in src/sync_tests/.
tauri = { version = "2", features = ["test"] }
# Stub S3 server (already in the dependency tree via aws-smithy-http-client).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Optimize dependencies only: the wildcard excludes this crate, so app edits
# keep opt-level 0 incremental builds while serde_json/sha2/aws-* run
# optimized (~3.9× on transcript analysis). Deps compile once; the cost is a
# single full rebuild when this setting first lands.
[profile.dev.package."*"]
opt-level = 1
