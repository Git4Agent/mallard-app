[package]
name = "mallard"
version.workspace = true
description = "Mallard — sync Codex and Claude project resources"
authors = ["you"]
license.workspace = true
edition.workspace = true

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mallard-application = { path = "../crates/mallard-application" }
mallard-domain = { path = "../crates/mallard-domain" }
mallard-infrastructure = { path = "../crates/mallard-infrastructure" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# The `mallard://` scheme the website's Open in Mallard hands over. Held to
# the 2.4 line: 2.5 and later need Tauri 2.12, and the app and
# `@tauri-apps/api` are on 2.11. Raise it when Tauri is.
tauri-plugin-deep-link = "~2.4.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already used transitively; parse provider config without executing its CLI.
toml = "0.9"
dirs = "5"
walkdir = "2"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
# Base64 for x-amz-checksum-sha256 values in S3 tests.
aws-smithy-types = "1"
bytes = "1"
# Pet preview derivation: decode PNG/WebP atlases, encode the cached PNG
# thumbnail. Pure-Rust codecs only; no default features.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
tempfile = "3"
chrono = "0.4"
notify = "8.2"

# Windows and Linux start another process for a link; this hands its
# arguments to the running app and ends it. macOS delivers a link to the
# running app itself. Same 2.4 line as the deep-link plugin.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.4.5", features = ["deep-link"] }

[dev-dependencies]
# Test-only domain and infrastructure helpers (compiled out of production
# builds).
mallard-domain = { path = "../crates/mallard-domain", features = ["test-support"] }
mallard-infrastructure = { path = "../crates/mallard-infrastructure", features = ["test-support"] }
# `test` enables tauri::test::{mock_builder, MockRuntime} for the headless
# integration tests in src/sync_tests/.
tauri = { version = "2", features = ["test"] }
# Stub S3 server.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
