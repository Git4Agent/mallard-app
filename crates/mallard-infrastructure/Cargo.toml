[package]
name = "mallard-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mallard persistence, object stores, provider adapters, and platform mechanics"

[dependencies]
mallard-domain = { path = "../mallard-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
dirs = "5"
# Safe Windows drive spelling for persisted paths; already used by Tauri.
dunce = "1"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
# Base64 for x-amz-checksum-sha256 values; already in the tree via aws-sdk-s3.
aws-smithy-types = "1"
bytes = "1"
sha2 = "0.10"
# Leftmost-longest in-cwd path matcher (already in the tree transitively).
aho-corasick = "1"
# Credential redaction detector layers (already in the tree transitively).
regex = "1"
libc = "0.2"
tempfile = "3"
getrandom = "0.3"
petname = { version = "3.2", default-features = false, features = ["default-words"] }
chrono = "0.4"
zeroize = "1"
url = "2"
# Decodes a session id in a page address (already in the tree via url).
percent-encoding = "2"
# Codex CLI version order for session resume (already in the tree transitively).
semver = "1"
socket2 = "0.6"
httparse = "1.10"
# The same Range parser used by Tauri's asset protocol.
http-range = "0.1.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart"] }

# Inspect typed HTTP error causes; reqwest already uses this dependency.
hyper = { version = "1", default-features = false }
# Reusable loopback server is compiled only with test support.
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
which = "8"
unicode-normalization = "0.1"
# Decodes rollouts Codex compressed in place (`.jsonl.zst`); the crate Codex writes with.
zstd = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_Shell"] }

[features]
# Exposes test-only helpers (apply/recover conversation fixtures, capture
# helpers, BundleEngine::publish) to other crates' test suites. Enabled from
# dev-dependencies only.
test-support = ["hyper/server", "hyper/http1", "dep:hyper-util", "dep:http-body-util"]

[dev-dependencies]
# Test-only domain helpers (compiled out of production builds).
mallard-domain = { path = "../mallard-domain", features = ["test-support"] }
# Stub S3 server (already in the dependency tree via aws-smithy-http-client).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
