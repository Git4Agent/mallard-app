[package]
name = "mallard-application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mallard use cases shared by desktop and command-line adapters"

[dependencies]
mallard-domain = { path = "../mallard-domain" }
mallard-infrastructure = { path = "../mallard-infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2"
zeroize = "1"
chrono = "0.4"
sha2 = "0.10"
hmac = "0.12"
bytes = "1"
# Base64 for cached pet previews (already in the tree via aws-sdk-s3).
aws-smithy-types = "1"
# Pet preview derivation: decode PNG/WebP atlases, encode the cached PNG
# thumbnail. Pure-Rust codecs only; no default features.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
regex = "1"
# Parse Codex provider config without executing its CLI.
toml = "0.9"
libc = "0.2"
# Atomic replacement of machine-local catalog state files.
tempfile = "3"
unicode-normalization = "0.1"

# Removal marks the verified open handle for deletion instead of resolving its
# path again; same filesystem API version as infrastructure.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Test-only domain and infrastructure helpers (compiled out of production builds).
mallard-domain = { path = "../mallard-domain", features = ["test-support"] }
mallard-infrastructure = { path = "../mallard-infrastructure", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2"
# Stub S3 and Cloud servers.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
