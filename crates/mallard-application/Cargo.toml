[package]
name = "mallard-application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mallard use cases shared by desktop and command-line adapters"

[dependencies]
mallard-domain = { path = "../mallard-domain" }
mallard-infrastructure = { path = "../mallard-infrastructure" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
