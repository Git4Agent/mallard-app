[package]
name = "mallard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mallard storage command-line interface"

[[bin]]
name = "mallard-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
httparse = "1.10"
mallard-application = { path = "../mallard-application" }
mallard-domain = { path = "../mallard-domain" }
mallard-infrastructure = { path = "../mallard-infrastructure" }
open = "5.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
mallard-infrastructure = { path = "../mallard-infrastructure", features = ["test-support"] }
