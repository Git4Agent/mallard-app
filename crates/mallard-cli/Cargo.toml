[package]
name = "mallard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mallard storage command-line interface"

[[bin]]
name = "mallard-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mallard-application = { path = "../mallard-application" }
mallard-domain = { path = "../mallard-domain" }
mallard-infrastructure = { path = "../mallard-infrastructure" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
