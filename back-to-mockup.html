<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty-review exit — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1640px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-seg:disabled { opacity: 0.35; cursor: default; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); max-width: 1180px; }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-main { height: auto !important; min-height: 200px; overflow: visible !important; }
      .spec-frame.narrow .sync-project-links-page { padding-right: 18px; padding-left: 18px; }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* A · the exit takes the commit's slot. A box button — the grammar of
         "Back to Storages" in the empty storage picker and of Settings' Done —
         never the gold (nothing is being committed) and never the ghost (the
         footer's ghost is the step navigator). It holds the apply button's
         footprint so the footer keeps its shape. The label ellipsizes; the
         title carries the whole sentence. */
      .sync-sync-review-footer > .btn.mk-exit.mk-exit {
        min-width: 180px;
        max-width: 100%;
        justify-content: center;
        padding: 0 15px;
        font-size: var(--type-sm);
      }
      .mk-exit > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* B · the exit sits in the row that says why. The row keeps its own
         shape; the button is its trailing action, the way "Try again" ends
         the history's error row. */
      .sync-pull-empty.mk-with-exit { align-items: center; }
      .sync-pull-empty.mk-with-exit > span { flex: 1 1 auto; min-width: 0; }
      .sync-pull-empty.mk-with-exit > .btn { flex: 0 1 auto; min-width: 0; min-height: 30px; }
      .sync-pull-empty.mk-with-exit > .btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/back-to-mockup.tsx"></script>
  </body>
</html>
