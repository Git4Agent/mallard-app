<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex CLI version check — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1640px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1100px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-seg:disabled { opacity: 0.35; cursor: default; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; min-height: 54px; }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }

      /* One app window's right-hand pane: path bar, shell zone, scrolling main. */
      .spec-frame { position: relative; display: flex; flex-direction: column; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame > .sync-main { flex: none; height: 520px; min-height: 0; overflow-y: auto !important; }

      /* The measured outcome under each frame. */
      .spec-verdict { margin-top: 8px; padding: 7px 10px; border-radius: 8px; font: 600 12px/1.4 system-ui; border: 1px solid var(--border); }
      .spec-verdict.seen { background: color-mix(in srgb, #2f9e44 12%, transparent); border-color: color-mix(in srgb, #2f9e44 45%, transparent); }
      .spec-verdict.missed { background: color-mix(in srgb, #e03131 12%, transparent); border-color: color-mix(in srgb, #e03131 45%, transparent); }
      .spec-verdict.quiet { color: var(--text-2); }

      /* The row the fake click landed on — specimen only. */
      .mk-clicked { outline: 2px dashed #e8590c; outline-offset: 3px; border-radius: 10px; }

      /* Stand-in transcript under the session header — specimen only. */
      .mk-transcript { display: grid; gap: 12px; margin-top: 18px; }
      .mk-transcript > div { height: 64px; border-radius: 12px; background: color-mix(in srgb, var(--text-2) 10%, transparent); }
      .mk-transcript > div:nth-child(2n) { height: 38px; margin-left: 20%; }

      .spec-copy { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      .spec-copy th, .spec-copy td { padding: 6px 8px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-copy th { color: var(--text-2); font-weight: 600; white-space: nowrap; }
      .spec-copy tr.on td { background: color-mix(in srgb, var(--text-0) 6%, transparent); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/codex-version-mockup.tsx"></script>
  </body>
</html>
