<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recommended selection — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1640px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); max-width: 1180px; }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title small { margin-right: 6px; color: var(--text-3); font-weight: 600; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; max-width: 820px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-main { height: auto !important; min-height: 200px; overflow: visible !important; }
      .spec-pair { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }
      .spec-matrix { display: grid; gap: 22px; }
      .spec-matrix-row { display: grid; gap: 8px; }
      .spec-matrix-cells { display: flex; flex-wrap: wrap; gap: 14px; align-items: start; }
      .spec-cell > span { display: block; margin: 0 0 4px 2px; color: var(--text-2); font: 600 11.5px/1.3 system-ui; }
      .spec-cell .spec-frame { border-radius: 10px; }
      /* A narrow pane: the window at its 800px minimum with the sidebar at its
         default 318px. The viewport media query that trims the page gutter at
         860px cannot fire inside a wide specimen page, so it is restated. */
      .spec-frame.narrow .sync-project-links-page { padding-right: 18px; padding-left: 18px; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* A · the recommend control as a labelled pill. It keeps its slot
         between the count and Clear, and drops the icon-action class that
         pins the cluster's buttons to 32px square. It is the path bar's own
         hollow pill (2px ink, cast shadow), one step smaller, never the gold
         primary: the path bar and the footer already wear that. The count
         chip is the path bar's `.sync-path-count`, so "Select 3" reads like
         "Pull 3". The class is doubled to beat App.css at equal weight. */
      .sync-push-resource-actions .btn.mk-select.mk-select {
        width: auto;
        min-width: 0;
        height: 28px;
        min-height: 28px;
        margin: 0 6px 0 4px;
        padding: 0 7px 0 8px;
        gap: 6px;
        border: var(--box-border);
        background: var(--button-bg);
        box-shadow: var(--shadow-control);
        color: var(--text-0);
        font-size: var(--type-sm);
        font-weight: var(--weight-bold);
      }
      .sync-push-resource-actions .btn.mk-select.mk-select:hover:not(:disabled) { background: var(--button-bg-hover); }
      .sync-push-resource-actions .btn.mk-select.mk-select:disabled { box-shadow: none; }
      .mk-select .sync-path-count { margin: 0 -1px 0 0; height: 17px; min-width: 17px; font-family: var(--font-mono); font-size: var(--type-2xs); }

      /* B · the same pill, inked while nothing is ticked: the state a Pull
         review opens in, and the one where its primary reads "Mark as
         reviewed". Ink, not gold, so it never looks like a second primary. */
      .sync-push-resource-actions .btn.mk-select.mk-prompt.mk-prompt:not(:disabled) {
        border-color: var(--text-0);
        background: var(--text-0);
        color: var(--bg-0);
      }
      .sync-push-resource-actions .btn.mk-select.mk-prompt.mk-prompt:hover:not(:disabled) { background: var(--text-1); border-color: var(--text-1); }
      .mk-prompt:not(:disabled) .sync-path-count { background: var(--bg-0); color: var(--text-0); }

      /* C · a select-all box at the head of the checkbox column. One row
         between the search field and the list, its box on the rows' own
         checkbox axis (measured), its count at the far edge. */
      .mk-master {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        margin: 0 0 6px;
        padding: 0 12px 0 var(--mk-master-inset, 14px);
        border-bottom: 1px solid var(--border);
      }
      .mk-master > .sync-sync-row-choice { flex: 0 0 auto; }
      .mk-master-label { min-width: 0; display: flex; align-items: baseline; gap: 6px; color: var(--text-1); font-size: var(--type-sm); white-space: nowrap; }
      .mk-master-label > b { color: var(--text-0); font-weight: var(--weight-semibold); }
      .mk-master-label > small { overflow: hidden; color: var(--text-2); font-size: var(--type-xs); text-overflow: ellipsis; }
      .mk-master > .sync-sync-review-selected { margin-left: auto; }

      /* The pill costs the header ~78px, and the header has none to spare:
         at the default 1100px window the shipped Push header already fits
         its title with 3px left over. Two steps, both keyed on the review's
         own width, both A/B only (C adds nothing to the header):
         ≤720px (the default window is 684), when the title carries Push's
         redaction flag, the glance drops its track and keeps its figure — the footer gauge, pinned beside the primary,
         still draws the track — and the title clips instead of running
         under the meter. Separately, found building this: at the 800px
         window the SHIPPED header paints the meter across the title and
         pushes × 12px out of the card, so ≤560px the glance steps aside
         entirely in every direction; Before is left as it ships. */
      @container sync-review-layout (max-width: 720px) {
        /* Only a title carrying the redaction flag (Push) needs the room;
           Pull's short title keeps the track at the default window. */
        .mk-pill:has(.sync-sync-review-title .sync-settings-flag) .sync-review-budget-glance .sync-review-budget-track { display: none; }
        .mk-pill .sync-sync-review-title { overflow: hidden; }
        .mk-pill .sync-pull-review-meta,
        .mk-pill .sync-sync-review-title .sync-settings-flag { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      }
      /* ≤560px applies to every direction, C included: it fixes what ships. */
      @container sync-review-layout (max-width: 560px) {
        .mk-proposed .sync-review-budget-glance { display: none; }
        .mk-proposed .sync-sync-review-title { overflow: hidden; }
        .mk-proposed .sync-pull-review-meta,
        .mk-proposed .sync-sync-review-title .sync-settings-flag { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/review-select-mockup.tsx"></script>
  </body>
</html>
