<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open in Mallard — live</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— harness chrome (not app CSS) ——————————————————————— */
      .harness { max-width: 1180px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 10px; font: 13px/1.45 system-ui, sans-serif; }
      .harness-controls { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .harness-controls > strong { margin-right: 6px; }
      .harness-controls > span { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      .harness-controls button { padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.3 system-ui; cursor: pointer; }
      .harness-frame { height: 720px; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; }
      .harness-frame > .sync-app { height: 100%; }
      .harness-log { margin: 0; padding: 8px 12px; min-height: 60px; max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); font: 11.5px/1.5 ui-monospace, monospace; white-space: pre-wrap; color: var(--text-1); }
      .harness-busy { padding: 16px 18px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface-card); color: var(--text-0); font: 13px/1.5 system-ui; }
      .harness-busy button { margin-top: 10px; }
      .harness-busy:not([open]) { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/deep-link-live.tsx"></script>
  </body>
</html>
