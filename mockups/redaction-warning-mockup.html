<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redaction warning — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 2040px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); max-width: 1180px; }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code, .spec-col-note code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-panel[hidden] { display: none; }
      .spec-table { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 12px; }
      .spec-table th, .spec-table td { padding: 5px 8px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-table thead th { color: var(--text-2); font-weight: 600; border-top: 0; }
      .spec-table .pick { font-weight: 700; background: color-mix(in srgb, var(--text-0) 5%, transparent); }
      .spec-mark { text-align: center !important; font-weight: 700; }
      .spec-mark.yes { color: var(--success-text); }
      .spec-mark.no { color: var(--danger-text); }
      .spec-mark.part { color: var(--text-2); }
      .spec-sources { color: var(--text-2); }
      .spec-sources a, .spec-panel li a { color: var(--text-1); }
      .spec-against { margin-top: -4px; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 6px; color: var(--text-2); font-size: 12px; max-width: 980px; }
      .spec-seen { margin: 0 0 8px; color: var(--text-2); font-size: 11.5px; }
      .spec-seen a { color: var(--text-1); }
      .spec-inframe { margin: 0 0 8px; }
      .spec-measure { margin: 6px 0 0; color: var(--text-2); font: 600 11.5px/1.3 var(--font-mono); }
      .spec-measure b { color: var(--text-0); }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-sync-review-scroll { max-height: 330px; overflow-y: auto; }
      .spec-stack { display: grid; gap: 30px 24px; align-items: start; }
      .spec-shot .spec-controls, .spec-shot .spec-panel, .spec-shot .spec-title, .spec-shot .spec-sub { display: none; }

      .mk-session-list { display: grid; gap: 6px; }
      .mk-settings-caption { margin-top: 14px; }
      .mk-settings-frame { padding: 12px; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* A · B: the warning pill holds its two words; the selection bar and
         the glance give way before it does. */
      .sync-sync-review-title > .mk-pill-wrap { flex: 0 0 auto; display: inline-flex; align-self: center; }
      .sync-sync-review-title:has(> .mk-pill-wrap) { align-items: center; }

      /* B: the notes chip's shape, pill-round like the header pill it
         replaces. */
      .sync-sync-review-title .mk-redaction-button { border-radius: var(--r-pill); font-family: var(--font-sans); }
      /* Below 480px the title row has no room for two words beside the
         count, Unselect and close: the pill keeps its glyph (shipped, the
         neutral pill is cut to "CRED…" there and loses "Off"). */
      @container sync-review-layout (max-width: 480px) {
        .mk-pill-words { display: none; }
        .mk-redaction-chip, .mk-redaction-button { padding-inline: 6px; }
      }
      .mk-redaction-panel { max-width: 300px; }
      .mk-panel-foot { margin: 2px 0 0; padding-left: 18px; }
      .mk-panel-foot .btn-link { font-size: inherit; font-weight: var(--weight-semibold, 600); }

      /* C shipped: its line wears the app's own .sync-review-footer-note.redaction-off. */

      /* D: the strip sits under the tab bar, not inside the scroll. */
      .mk-redaction-strip { padding-block: 7px; }

      /* E: the consequence, in the row's own copy. */
      .mk-settings-consequence { color: var(--text-1); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/redaction-warning-mockup.tsx"></script>
  </body>
</html>
