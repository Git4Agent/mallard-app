<!doctype html>
<html lang="en" data-theme="light" data-dir="a" data-sample="claude">
<head>
<meta charset="utf-8">
<title>Mallard — subagents on the session detail page</title>
<link rel="stylesheet" href="/src/App.css">
<style>
/* ═══ specimen chrome — not part of the app ═══ */
html, body { height: auto; overflow: auto; }
body { background: var(--retro-frame-gutter); padding: 18px 20px 80px; }
.spec-bar { max-width: 1180px; margin: 0 auto 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spec-title { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-right: auto; }
.spec-btn { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-0); background: var(--button-bg); border: var(--box-border); border-radius: 999px; padding: 5px 13px; cursor: pointer; box-shadow: var(--shadow-card); }
.spec-btn:active { transform: translate(1px,1px); box-shadow: none; }
.spec-btn[aria-pressed="true"] { background: var(--button-primary-bg); color: var(--button-primary-text); }
.spec-gap { width: 10px; }
.spec-note { max-width: 1180px; margin: 0 auto 12px; color: var(--text-2); font-size: var(--type-sm); line-height: 1.5; }
.spec-note b { color: var(--text-0); font-family: var(--font-display); }
.spec-note i { color: var(--text-1); font-style: normal; }
.frame { max-width: 1180px; margin: 0 auto; background: var(--bg-0); border: var(--box-border); border-radius: var(--retro-panel-radius); box-shadow: var(--shadow-card); padding: 18px 22px 30px; }
.session-detail-page { max-width: none; }
svg.icon { width: 12px; height: 12px; flex: 0 0 auto; }
.icon-pixel-fill { shape-rendering: crispEdges; }
.session-detail-toolbar { margin-bottom: 14px; }
.session-detail-event-list { padding: 0; margin: 0; }
.session-detail-tool-call > summary { list-style: none; }
.session-detail-tool-call > summary::marker { content: ""; }
[hidden] { display: none !important; }
.btn.btn-ghost.session-detail-launch { width: 28px; height: 28px; display: inline-grid; place-items: center; }

/* ═══ proposal: agent tokens (would live on .session-detail-page) ═══ */
.session-detail-page {
  --session-detail-agent: color-mix(in srgb, var(--purple) 85%, var(--text-0));
  --session-detail-agent-edge: color-mix(in srgb, var(--purple) 60%, var(--accent));
  --session-detail-agent-wash: color-mix(in srgb, var(--purple) 7%, transparent);
}

/* ═══ shared: the delegation row (all directions) ═══ */
.session-detail-event-list > li.session-detail-row-agent + li,
.session-detail-event-list > li + li.session-detail-row-agent { margin-top: 8px; }
.event-agent .session-detail-event-node { color: var(--session-detail-agent); border-color: var(--session-detail-agent-edge); }
.event-agent .session-detail-tool-name { color: var(--session-detail-agent); }
.ag-label { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-0); font-size: var(--type-md); font-weight: var(--weight-semibold); }
.ag-sub { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); }
.ag-role { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 18px; padding: 1px 6px; border: 1px solid var(--border-mid); border-radius: var(--r-pill); color: var(--text-1); font-size: var(--type-3xs); white-space: nowrap; }
.ag-role.mode { border-style: dashed; color: var(--text-2); }
.ag-meta { flex: 0 0 auto; margin-left: auto; display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ag-status { flex: 0 0 auto; padding: 1px 5px; border: 1px solid var(--danger-text); border-radius: var(--r-pill); color: var(--danger-text); font-size: var(--type-3xs); white-space: nowrap; }
.ag-status.interrupted { border-color: var(--session-detail-amber); color: var(--session-detail-amber); }
.ag-status.running { border-color: var(--green); color: var(--green); }
.ag-status.unavailable { border-color: var(--border-strong); color: var(--text-2); }
.event-agent.agent-failed .session-detail-event-node { color: var(--danger-text); border-color: var(--danger-text); }
.event-agent.agent-interrupted .session-detail-event-node { color: var(--session-detail-amber); border-color: var(--session-detail-amber); }
.event-agent .session-detail-tool-call > summary { min-height: 34px; }
.event-agent .session-detail-tool-call[open] > summary { border-bottom-left-radius: 8px; }
.ag-facts { display: flex; flex-wrap: wrap; gap: 5px; }
.ag-facts > span { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--text-1); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }
.ag-facts > span svg { color: var(--text-3); }
.ag-verbs { display: flex; gap: 6px; justify-content: flex-end; }
.ag-verbs .btn { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--type-xs); }
.ag-unavail { color: var(--text-2); font-size: var(--type-xs); font-style: italic; }

/* activity rows (Codex send / interrupt / finished) share the tool row; the
   agent's nickname is the summary's first word */
.event-agent-activity .session-detail-tool-name { color: var(--session-detail-agent); }
.event-agent-activity.act-interrupted .session-detail-event-tick { border-color: var(--session-detail-amber); background: var(--session-detail-amber); }
.ag-arrow { color: var(--text-3); margin: 0 2px; }
.ag-who { color: var(--text-0); font-weight: var(--weight-semibold); }

/* ═══ B · nested rail ═══ */
.ag-nest { margin: 2px 0 2px 11px; padding: 6px 0 4px 16px; border-left: 2px solid var(--session-detail-agent-edge); }
.ag-nest .session-detail-event-list > li + li { margin-top: 8px; }
.ag-nest .session-detail-event { grid-template-columns: 18px minmax(0,1fr); gap: 0 10px; }
.ag-nest .session-detail-event-node { width: 18px; height: 18px; border-width: 1px; border-radius: 4px; }
.ag-nest .session-detail-event-node svg { width: 10px; height: 10px; }
.ag-nest .session-detail-card { box-shadow: none; border-width: 1px; border-color: var(--border-strong); }
.ag-nest .session-detail-card-head { padding: 4px 10px 3px; }
.ag-nest .session-detail-card > .session-detail-event-copy { padding: 8px 10px 9px; font-size: var(--type-md); }
.ag-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 26px; padding: 3px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-subtle); color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; }
.ag-strip b { color: var(--text-0); font-weight: var(--weight-semibold); }
.ag-strip .punches { display: inline-flex; gap: 3px; align-items: center; }
.ag-strip .punches i { width: 7px; height: 7px; border: 2px solid var(--border-mid); border-radius: 1px; background: var(--bg-0); }
.ag-strip .punches i.failed { border-color: var(--danger-text); background: var(--danger-text); }
.ag-strip .punches i.more { border: 0; width: auto; height: auto; background: none; font-style: normal; color: var(--text-3); }
.ag-nest-tick { width: 7px; height: 7px; margin: 10px auto 0; border: 2px solid var(--border-mid); border-radius: 1px; background: var(--bg-0); }
.ag-nest-more { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px dashed var(--border-strong); border-radius: var(--r-pill); background: transparent; color: var(--text-1); font: inherit; font-size: var(--type-xs); cursor: pointer; }

/* ═══ C · roster panel ═══ */
.ag-roster { margin-bottom: 14px; border: var(--box-border); border-radius: var(--retro-panel-radius); background: var(--surface-card); box-shadow: var(--shadow-card); overflow: hidden; }
.ag-roster > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 12px; color: var(--text-1); }
.ag-roster > summary::-webkit-details-marker { display: none; }
.ag-roster[open] > summary { border-bottom: 1px solid var(--border-mid); background: var(--surface-subtle); }
.ag-roster-title { color: var(--text-2); font-size: var(--type-3xs); text-transform: uppercase; letter-spacing: 1px; }
.ag-roster-count { color: var(--text-0); font-family: var(--font-mono); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
.ag-roster-readout { margin-left: auto; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); }
.ag-roster-list { list-style: none; margin: 0; padding: 4px 6px 6px; display: grid; gap: 4px; }
.ag-roster-row { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 3px 8px 3px 6px; border-radius: 8px; }
.ag-roster-row:hover { background: var(--bg-hover); }
.ag-roster-row .tile { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--session-detail-agent-edge); border-radius: 5px; background: var(--bg-0); color: var(--session-detail-agent); }
.ag-roster-row.failed .tile, .ag-roster-row.interrupted .tile { color: var(--session-detail-amber); border-color: var(--session-detail-amber); }
.ag-roster-row.failed .tile { color: var(--danger-text); border-color: var(--danger-text); }
.ag-roster-row .ag-label { flex: 1 1 200px; }
.ag-roster-row .span { flex: 0 0 auto; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ag-roster-row .calls { flex: 0 0 64px; text-align: right; color: var(--text-1); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; }
.ag-roster-row .verbs { flex: 0 0 auto; display: inline-flex; gap: 4px; }
.ag-roster-row .verbs button { width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--button-border); border-radius: 6px; background: var(--button-bg); color: var(--text-2); cursor: pointer; }
.ag-roster-row .verbs button:hover { color: var(--text-0); background: var(--button-bg-hover); }

/* ═══ D · lanes panel ═══ */
.ag-lanes { margin-bottom: 14px; border: var(--box-border); border-radius: var(--retro-panel-radius); background: var(--surface-card); box-shadow: var(--shadow-card); overflow: hidden; }
.ag-lanes > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 12px; color: var(--text-1); }
.ag-lanes > summary::-webkit-details-marker { display: none; }
.ag-lanes[open] > summary { border-bottom: 1px solid var(--border-mid); background: var(--surface-subtle); }
.ag-lanes-body { padding: 8px 12px 10px; display: grid; gap: 4px; }
.ag-lane { display: grid; grid-template-columns: 300px minmax(0,1fr); align-items: center; gap: 12px; min-height: 22px; }
.ag-lane .name { min-width: 0; display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-0); font-size: var(--type-sm); }
.ag-lane .name svg { color: var(--session-detail-agent); }
.ag-lane.parent .name { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); text-transform: uppercase; letter-spacing: 1px; }
.ag-lane .name .r { flex: 0 0 auto; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); }
.ag-track { position: relative; height: 16px; border-radius: 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), var(--border) calc(20% - 1px) 20%); }
.ag-lane.parent .ag-track { height: 6px; background: none; }
.ag-lane.parent .ag-bar { height: 6px; border: 0; background: var(--border-mid); border-radius: 3px; }
.ag-bar { position: absolute; top: 0; height: 16px; box-sizing: border-box; border: 2px solid var(--session-detail-agent-edge); border-radius: 3px; background: var(--session-detail-agent-wash); cursor: pointer; }
.ag-bar:hover { background: var(--bg-active); }
.ag-bar.interrupted { border-color: var(--session-detail-amber); border-right-style: dashed; }
.ag-bar.failed { border-color: var(--danger-text); background: var(--danger-text); width: 4px !important; }
.ag-bar.running { border-right: 0; background: linear-gradient(90deg, var(--session-detail-agent-wash), transparent); }
.ag-bar > span.before { left: auto; right: calc(100% + 6px); }
.ag-bar > span { position: absolute; left: calc(100% + 6px); top: -2px; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ag-axis { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 12px; }
.ag-axis > div { position: relative; height: 14px; color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-3xs); font-variant-numeric: tabular-nums; }
.ag-axis > div > span { position: absolute; top: 0; transform: translateX(-50%); }
.ag-axis > div > span:first-child { transform: none; }
.ag-axis > div > span:last-child { transform: translateX(-100%); }
</style>
</head>

/* ───────── helpers ───────── */
const toSec = (t) => { const [h, m, s = 0] = t.split(':').map(Number); return h * 3600 + m * 60 + s; };
const hm = (t) => t.slice(0, 5);
const statusChip = (s) => s === 'completed' ? '' : `<span class="ag-status ${s}">${s === 'incomplete' ? 'incomplete' : s}</span>`;
const catFor = (n) => /apply_patch|Edit|Write/.test(n) ? 'file_edit' : /read_file|Read|Grep|Glob/.test(n) ? 'read' : /exec|Bash/.test(n) ? 'shell' : 'other';

function toolRow(name, cat, cmd, status, extra = '') {
  return `<li class="session-detail-row-tool" data-kind="tool"><article class="session-detail-event event-tool-call tool-${status}"><span class="session-detail-event-tick" aria-hidden="true"></span><div class="session-detail-event-body"><details class="session-detail-tool-call status-${status}"><summary><span class="session-detail-tool-name cat-${cat}">${name}</span><span class="session-detail-tool-summary">${cmd}</span>${status !== 'completed' ? `<span class="session-detail-tool-status status-${status}">${status}</span>` : ''}${extra}<span class="session-detail-tool-chevron" aria-hidden="true">${I('i-chevr')}</span></summary></details></div></article></li>`;
}

function card(kind, sample, e) {
  const node = kind === 'prompt' ? I('i-user') : I(sample.mark);
  const head = kind === 'prompt'
    ? `<time>${hm(e.t)}</time>${e.dur ? `<span>${e.dur}</span>` : ''}${e.calls ? `<span>${e.calls} calls</span>` : ''}`
    : `<time>${hm(e.t)}</time>`;
  const gap = e.gap ? `<div class="session-detail-event-gap"><span>${e.gap}</span></div>` : '';
  return `<li data-kind="${kind}">${gap}<article class="session-detail-event event-${kind === 'prompt' ? 'prompt' : 'response'}"><span class="session-detail-event-node" role="img" aria-label="${kind === 'prompt' ? 'You' : sample.name} · ${hm(e.t)}">${node}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-${kind === 'prompt' ? 'prompt' : 'reply'}"><div class="session-detail-card-head">${head}</div><div class="session-detail-event-copy">${e.html}</div></div></div></article></li>`;
}

function stepRow(e) {
  return `<li data-kind="step"><article class="session-detail-event event-intermediate-step"><span class="session-detail-event-node">${I(cur().mark)}</span><div class="session-detail-event-body"><div class="session-detail-event-copy session-detail-intermediate-prose">${e.html}</div></div></article></li>`;
}

function actRow(e) {
  const map = { send: ['SEND', `<span class="ag-arrow">→</span><span class="ag-who">${e.who}</span> · message`, 'completed'], interrupt: ['STOP', `<span class="ag-arrow">→</span><span class="ag-who">${e.who}</span>`, 'completed'], done: ['DONE', `<span class="ag-arrow">←</span><span class="ag-who">${e.who}</span> · finished after ${e.dur}`, 'completed'] };
  const [name, cmd, status] = map[e.kind];
  return `<li class="session-detail-row-tool" data-kind="agent"><article class="session-detail-event event-tool-call event-agent-activity act-${e.kind === 'interrupt' ? 'interrupted' : e.kind} tool-${status}"><span class="session-detail-event-tick" aria-hidden="true"></span><div class="session-detail-event-body"><details class="session-detail-tool-call status-${status}"><summary><span class="session-detail-tool-name cat-other">${name}</span><span class="session-detail-tool-summary">${cmd}</span><span class="ag-meta"><time>${hm(e.t)}</time></span><span class="session-detail-tool-chevron">${I('i-chevr')}</span></summary></details></div></article></li>`;
}

function agentFacts(e, sample) {
  const f = [];
  f.push(`<span>${I('i-fork')}${e.role}</span>`);
  if (e.model) f.push(`<span>${e.model}</span>`);
  f.push(`<span>${e.mode}</span>`);
  f.push(`<span>${I('i-clock')}${e.t} → ${e.end ?? '…'} · ${e.dur}</span>`);
  if (e.calls) f.push(`<span>${e.calls} calls</span>`);
  if (e.events) f.push(`<span>${e.events} events</span>`);
  if (e.tokens && e.tokens !== '—') f.push(`<span>${e.tokens}</span>`);
  return `<div class="ag-facts">${f.join('')}</div>`;
}

function payload(label, text, unavailable) {
  return `<section class="session-detail-payload-section"><div class="session-detail-payload-head"><span class="session-detail-payload-label">${label}</span>${text ? `<span class="session-detail-payload-tools"><button type="button" class="session-detail-payload-action" title="Copy to clipboard">${I('i-copy')}</button></span>` : ''}</div>${text ? `<pre class="session-detail-payload-body"><code>${text}</code></pre>` : `<p class="ag-unavail">${unavailable}</p>`}</section>`;
}

function agentPaneA(e, sample) {
  const brief = e.brief ? payload('Brief', e.brief) : payload('Brief', null, sample.provider === 'codex' ? 'The spawn message is stored encrypted in the parent rollout; the child transcript opens with it.' : 'No brief recorded.');
  const report = e.report ? payload('Report', e.report) : payload('Report', null, e.status === 'running' ? 'Still running — no report yet.' : e.status === 'failed' ? e.failText : 'The transcript ends before a final message.');
  return `<div class="session-detail-tool-payload">${agentFacts(e, sample)}${brief}${report}<div class="ag-verbs"><button type="button" class="btn btn-ghost" ${e.status === 'failed' ? 'disabled' : ''}>${I('i-ext')} Open transcript</button></div></div>`;
}

function agentPaneB(e, sample) {
  if (e.status === 'failed') return `<div class="session-detail-tool-payload">${payload('Result', e.failText)}</div>`;
  const punches = e.tools.map(([n, c]) => `<span><b>${n}</b> ×${c}</span>`).join('');
  const ticks = Array.from({ length: Math.min(e.calls, 28) }, (_, i) => `<i${e.status === 'incomplete' && i === 27 ? ' class="failed"' : ''}></i>`).join('') + (e.calls > 28 ? `<i class="more">+${e.calls - 28}</i>` : '');
  const brief = e.brief ? `<p>${e.brief}</p>` : `<p class="session-detail-event-empty">Brief not readable from the parent rollout (stored encrypted); it is the first record of the child transcript.</p>`;
  const report = e.report ? `<p>${e.report.split('\n')[0]}</p>` : `<p class="session-detail-event-empty">${e.status === 'running' ? 'Still running.' : 'The transcript ends before a final message.'}</p>`;
  return `<div class="ag-nest"><ol class="session-detail-event-list">
    <li><article class="session-detail-event event-prompt"><span class="session-detail-event-node" style="color:var(--session-detail-agent)">${I('i-fork', 10)}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-prompt"><div class="session-detail-card-head"><time>${hm(e.t)}</time><span>brief</span></div><div class="session-detail-event-copy">${brief}</div></div></div></article></li>
    <li><article class="session-detail-event"><span class="ag-nest-tick" aria-hidden="true"></span><div class="session-detail-event-body"><div class="ag-strip"><span class="punches">${ticks}</span>${punches}<span style="margin-left:auto">${e.dur}</span></div></div></article></li>
    <li><article class="session-detail-event event-response"><span class="session-detail-event-node">${I(sample.mark, 10)}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-reply"><div class="session-detail-card-head"><time>${e.end ?? '…'}</time><span>report</span></div><div class="session-detail-event-copy">${report}</div></div></div></article></li>
    <li><article class="session-detail-event"><span></span><div class="session-detail-event-body" style="display:flex;gap:8px;align-items:center"><button type="button" class="ag-nest-more">${I('i-chevd')} Show all ${e.events} events</button><span class="ag-verbs" style="margin-left:auto"><button type="button" class="btn btn-ghost">${I('i-ext')} Open transcript</button></span></div></article></li>
  </ol></div>`;
}

function agentRow(e, sample, dir) {
  const st = e.status === 'completed' ? '' : ` agent-${e.status}`;
  const summary = sample.provider === 'codex'
    ? `<span class="ag-label">${e.label}</span>${e.sub ? `<span class="ag-sub">${e.sub}</span>` : ''}<span class="ag-role">${e.role}</span>`
    : `<span class="ag-label">${e.label}</span><span class="ag-role">${e.role}</span>${e.mode === 'async' ? `<span class="ag-role mode">async</span>` : ''}`;
  const meta = e.status === 'failed'
    ? `<span class="ag-meta"><span class="session-detail-tool-summary" style="color:var(--danger-text)">${e.failText}</span></span>`
    : `<span class="ag-meta">${e.calls ? `<span>${e.calls} calls</span>` : ''}<span>${e.dur}</span></span>`;
  const pane = dir === 'b' ? agentPaneB(e, sample) : agentPaneA(e, sample);
  return `<li class="session-detail-row-agent" data-kind="agent" id="row-${e.id}"><article class="session-detail-event event-agent${st}"><span class="session-detail-event-node" role="img" aria-label="Agent · ${e.label} · ${hm(e.t)}">${I('i-fork')}</span><div class="session-detail-event-body"><details class="session-detail-tool-call status-${e.status}" ${e.open ? 'open' : ''}><summary><span class="session-detail-tool-name">AGENT</span>${summary}${meta}${statusChip(e.status)}<span class="session-detail-tool-chevron" aria-hidden="true">${I(e.open ? 'i-chevd' : 'i-chevr')}</span></summary><div class="session-detail-tool-body">${pane}</div></details></div></article></li>`;
}

/* ───────── panels ───────── */
function roster(sample) {
  const ags = sample.events.filter(e => e.k === 'agent');
  const counts = {};
  ags.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);
  const readout = Object.entries(counts).map(([s, n]) => `${n} ${s}`).join(' · ');
  const rows = ags.map(a => `<li class="ag-roster-row ${a.status}"><span class="tile">${I('i-fork')}</span><span class="ag-label" title="${a.label}">${a.label}${a.sub ? ` <span class="ag-sub">${a.sub}</span>` : ''}</span><span class="ag-role">${a.role}</span><span class="span">${hm(a.t)} – ${a.end ? hm(a.end) : '…'} · ${a.dur}</span><span class="calls">${a.calls ? a.calls + ' calls' : ''}</span>${statusChip(a.status)}<span class="verbs"><button type="button" title="Jump to the row" onclick="jump('${a.id}')">${I('i-chevd')}</button><button type="button" title="Open transcript" ${a.status === 'failed' ? 'disabled' : ''}>${I('i-ext')}</button></span></li>`).join('');
  return `<details class="ag-roster" open><summary><span class="ag-roster-title">Agents</span><span class="ag-roster-count">${ags.length}</span><span class="ag-roster-readout">${readout}</span></summary><ol class="ag-roster-list">${rows}</ol></details>`;
}

function lanes(sample) {
  const ags = sample.events.filter(e => e.k === 'agent');
  const a0 = toSec(sample.t0), a1 = toSec(sample.t1), span = a1 - a0;
  const pct = (t) => ((toSec(t) - a0) / span * 100).toFixed(2);
  const ticks = []; for (let i = 0; i <= 5; i++) { const s = a0 + span * i / 5; const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); ticks.push(`<span style="left:${i * 20}%">${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}</span>`); }
  const rows = ags.map(a => {
    const l = pct(a.t), r = a.end ? pct(a.end) : '100';
    const w = Math.max(0.6, r - l);
    return `<div class="ag-lane"><span class="name" title="${a.label}">${I('i-fork')}<span style="overflow:hidden;text-overflow:ellipsis">${a.label}</span><span class="r">${a.role}</span></span><div class="ag-track"><i class="ag-bar ${a.status}" style="left:${l}%;width:${w}%" title="${a.label} · ${a.t} → ${a.end ?? 'running'} · ${a.dur}" onclick="jump('${a.id}')"><span class="${Number(r) > 86 ? 'before' : ''}">${a.status === 'failed' ? 'refused' : a.dur}</span></i></div></div>`;
  }).join('');
  return `<details class="ag-lanes" open><summary><span class="ag-roster-title">Agents</span><span class="ag-roster-count">${ags.length}</span><span class="ag-roster-readout">${sample.t0.slice(0, 5)} → ${sample.t1.slice(0, 5)} · ${sample.length}</span></summary><div class="ag-lanes-body"><div class="ag-axis"><div></div><div>${ticks.join('')}</div></div><div class="ag-lane parent"><span class="name">Session</span><div class="ag-track"><i class="ag-bar" style="left:0;width:100%"></i></div></div>${rows}</div></details>`;
}

/* ───────── header + toolbar (as shipped, plus the agents chip / toggle) ───────── */
function header(sample) {
  const n = sample.events.filter(e => e.k === 'agent').length;
  return `<header class="session-detail-header"><div class="session-detail-strip"><div class="session-detail-chips" aria-label="Session facts">
    <span class="session-detail-chip">${I('i-branch')}<code>${sample.branch}</code></span>
    <span class="session-detail-chip">${I('i-commit')}<code>${sample.sha}</code></span>
    <span class="session-detail-chip"><time>${sample.start}</time></span>
    <span class="session-detail-chip">${I('i-clock')}<b>${sample.length}</b></span>
    <span class="session-detail-chip"><code>${sample.tokens}</code> tokens</span>
    <span class="session-detail-chip" title="${n} agents spawned in this session">${I('i-fork')}<code>${n}</code> agents</span>
  </div><div class="session-detail-header-actions"><button type="button" class="btn btn-ghost session-detail-launch" title="Open in ${sample.name}">${I(sample.mark)}</button><button type="button" class="btn btn-ghost session-detail-launch" title="Open in terminal">${I('i-terminal')}</button></div></div></header>`;
}
const FILTERS = [['prompt', 'Prompts', true], ['reply', 'Replies', true], ['step', 'Steps', false], ['checkpoint', 'Checkpoints', true], ['tool', 'Tool calls', false], ['agent', 'Agents', true]];
let filterState = Object.fromEntries(FILTERS.map(([k, , on]) => [k, on]));
function toolbar(sample) {
  const counts = {}; sample.events.forEach(e => counts[e.k === 'act' ? 'agent' : e.k] = (counts[e.k === 'act' ? 'agent' : e.k] || 0) + 1);
  const t = FILTERS.map(([k, label]) => `<button type="button" class="session-detail-filter-toggle${filterState[k] ? ' is-on' : ''}" aria-pressed="${filterState[k]}" data-filter="${k}"><span class="session-detail-filter-box" aria-hidden="true"></span><span class="session-detail-filter-name">${label}</span><span class="session-detail-filter-count quality-exact">${counts[k] || 0}</span></button>`).join('');
  return `<div class="session-detail-toolbar"><span class="session-detail-toolbar-label">Show</span><div class="session-detail-toolbar-toggles" role="group">${t}</div><output class="session-detail-toolbar-readout" id="readout"></output></div>`;
}

/* ───────── page ───────── */
const cur = () => SAMPLES[document.documentElement.dataset.sample];
function render() {
  const sample = cur(); const dir = document.documentElement.dataset.dir;
  const list = sample.events.map(e => {
    if (e.k === 'prompt') return card('prompt', sample, e);
    if (e.k === 'reply') return card('reply', sample, e);
    if (e.k === 'step') return stepRow(e);
    if (e.k === 'tool') return toolRow(e.name, e.cat, e.cmd, e.status);
    if (e.k === 'act') return actRow(e);
    if (e.k === 'agent') return agentRow(e, sample, dir);
  }).join('');
  document.getElementById('page').innerHTML = header(sample) + toolbar(sample) + (dir === 'c' ? roster(sample) : dir === 'd' ? lanes(sample) : '') +
    `<div class="session-detail-layout"><div class="session-detail-timeline"><section class="session-detail-day"><h2 class="session-detail-day-divider"><span>${sample.day}</span></h2><ol class="session-detail-event-list">${list}</ol></section></div></div>`;
  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { filterState[b.dataset.filter] = !filterState[b.dataset.filter]; render(); }));
  applyFilters();
  document.getElementById('note').innerHTML = NOTES[dir];
  document.querySelectorAll('.spec-btn[data-dir]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
  document.querySelectorAll('.spec-btn[data-sample]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sample === document.documentElement.dataset.sample)));
}
function applyFilters() {
  let shown = 0, total = 0;
  document.querySelectorAll('#page > .session-detail-layout li[data-kind]').forEach(li => { total++; const on = filterState[li.dataset.kind]; li.hidden = !on; if (on) shown++; });
  document.getElementById('readout').textContent = `${shown} of ${total} events`;
}
function jump(id) { const el = document.getElementById('row-' + id); if (!el) return; el.scrollIntoView({ block: 'center' }); el.querySelector('details').open = true; }
document.querySelectorAll('.spec-btn[data-dir]').forEach(b => b.addEventListener('click', () => { document.documentElement.dataset.dir = b.dataset.dir; render(); }));
document.querySelectorAll('.spec-btn[data-sample]').forEach(b => b.addEventListener('click', () => { document.documentElement.dataset.sample = b.dataset.sample; render(); }));
document.getElementById('theme').addEventListener('click', (e) => { const html = document.documentElement; const dark = html.dataset.theme !== 'dark'; html.dataset.theme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Light' : 'Dark'; });
render();
</script>
</body>
</html>
