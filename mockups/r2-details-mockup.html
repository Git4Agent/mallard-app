<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage card: fewer words, copy everything — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1640px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1100px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel > strong { display: block; margin-bottom: 4px; font-size: 14px; }
      .spec-panel > p { margin: 0 0 6px; color: var(--text-2); max-width: 1100px; }
      .spec-panel ul { margin: 4px 0 0 18px; display: grid; gap: 3px; max-width: 1200px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-cols { display: grid; gap: 22px; grid-template-columns: repeat(2, minmax(0, 780px)); justify-content: start; align-items: start; }
      @media (max-width: 1600px) { .spec-cols { grid-template-columns: minmax(0, 780px); } }
      .spec-col { display: grid; gap: 12px; align-content: start; }
      .spec-col-title { margin: 0; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: -4px 0 0; color: var(--text-2); font-size: 12px; }
      .spec-frame { position: relative; padding: 14px; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-clip { margin: 0; padding: 10px 12px; min-height: 64px; border: 1px dashed var(--border-strong); border-radius: 10px; background: var(--surface-muted); color: var(--text-1); font: 12px/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-all; }
      .spec-clip:empty::before { content: "Press a copy button in the proposal: the exact clipboard text lands here."; color: var(--text-3); font-family: system-ui; }
      .spec-measure { margin: 0; color: var(--text-2); font: 600 11.5px/1.5 var(--font-mono); }
      .spec-shot .spec-controls, .spec-shot .spec-panel, .spec-shot .spec-title, .spec-shot .spec-sub { display: none; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* Copy all sits at the status row's tail, after the one doc link. */
      .storage-setup-guide > .btn.storage-copy-all,
      .storage-setup-route-row > .btn.storage-copy-all { margin-left: 2px; }
      .btn.storage-copy-all.copied { color: var(--success-text); }

      /* A — every read-only box carries its own Copy at the right edge; the
         secret keeps Copy + Show (has-copy). One verb needs one slot. */
      .sync-secret-input.has-copy-one > input { padding-right: 40px; }

      /* B — the details list: label, value, verbs; no boxes. */
      .storage-details-list { margin: 0; padding: 4px 14px 8px; display: grid; }
      .storage-details-row {
        min-width: 0;
        min-height: 38px;
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }
      .storage-details-row:last-child { border-bottom: 0; }
      .storage-details-row > dt { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
      .storage-details-row > dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-0); font: var(--type-xs)/1.4 var(--font-mono); }
      .storage-details-verbs { display: inline-flex; align-items: center; gap: 2px; }
      .storage-details-verbs > button {
        min-width: 28px;
        height: 26px;
        padding: 0 7px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 6px;
        color: var(--text-2);
        background: transparent;
        font: inherit;
        font-size: var(--type-2xs);
        cursor: pointer;
      }
      .storage-details-verbs > button:hover { color: var(--text-0); background: var(--bg-hover); }
      .storage-details-verbs > button.copied { color: var(--success-text); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/r2-details-mockup.tsx"></script>
  </body>
</html>
