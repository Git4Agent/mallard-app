<style>
/* ═══ specimen chrome — not part of the app ═══ */
html, body { height: auto; overflow: auto; }
body { background: var(--retro-frame-gutter, var(--bg-1)); padding: 18px 20px 80px; }
.spec-bar { max-width: 990px; margin: 0 auto 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.spec-title { font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin-right: auto; }
.spec-btn { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-0); background: var(--button-bg); border: var(--box-border); border-radius: 999px; padding: 4px 12px; cursor: pointer; box-shadow: var(--shadow-card); }
.spec-btn:active { transform: translate(1px,1px); box-shadow: none; }
.spec-btn[aria-pressed="true"] { background: var(--button-primary-bg); color: var(--button-primary-text); }
.spec-gap { width: 8px; }
.spec-note { max-width: 990px; margin: 0 auto 12px; color: var(--text-2); font-size: var(--type-sm); line-height: 1.55; }
.spec-note b { color: var(--text-0); font-family: var(--font-display); }
.spec-note i { color: var(--text-1); font-style: normal; }
.spec-note code { font-family: var(--font-mono); font-size: .92em; color: var(--text-1); }
.spec-note ul { margin: 4px 0 0 18px; padding: 0; }
.spec-note .measure { display: inline-block; margin-top: 4px; padding: 1px 8px; border: 1px solid var(--border-mid); border-radius: 999px; font-family: var(--font-mono); font-size: var(--type-2xs); color: var(--text-1); }
.frame { max-width: 990px; margin: 0 auto; background: var(--bg-0); border: var(--box-border); border-radius: var(--retro-panel-radius); box-shadow: var(--shadow-card); padding: 16px 22px 28px; }
.session-detail-page { max-width: none; }
svg.icon { width: 12px; height: 12px; flex: 0 0 auto; }
.icon-pixel-fill { shape-rendering: crispEdges; }
.session-detail-toolbar { margin-bottom: 14px; }
.session-detail-event-list { padding: 0; margin: 0; }
.session-detail-tool-call > summary::marker { content: ""; }
[hidden] { display: none !important; }
.spec-compare-head { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text-0); }
.spec-compare-head:first-child { margin-top: 0; }
.spec-compare-head span { font-family: var(--font-sans); font-size: var(--type-xs); font-weight: 400; color: var(--text-2); }

/* ═══ A · floor — the fixes every option carries ═══
   1. One auto margin: the length sits against the chevron. Shipped, the meta
      and the chevron both take margin-left:auto, so flex splits the free space
      and the length floats mid-row at an x that moves with the label.
   2. The stamp is as wide as its word: it inherited the tool column's 88px
      (sized for `exec_command`) — dead gutter on every agent row.
   3. The length is a right-aligned tabular slot, so a burst reads down. */
.ac-end { flex: 0 0 auto; margin-left: auto; display: inline-flex; align-items: center; gap: 10px; }
.ac-end > .session-detail-agent-meta, .ac-end > .session-detail-agent-status, .ac-end > .session-detail-tool-chevron { margin-left: 0; }
.floor .session-detail-agent-stamp { flex: 0 0 auto; }
.floor .session-detail-agent-meta .ac-len { min-width: 3.2ch; text-align: right; color: var(--text-1); }

/* ═══ B · outcome line — the report's first line under the name ═══ */
.ac-b.session-detail-agent > summary { align-items: flex-start; padding-top: 5px; padding-bottom: 6px; }
.ac-b .session-detail-agent-stamp { line-height: 22px; }
.ac-b-main { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; }
.ac-b-line { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 22px; }
.ac-outcome { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-2); font-size: var(--type-sm); line-height: 18px; }
.ac-outcome > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-outcome > svg { color: var(--text-3); }
.ac-outcome.note > span { font-style: italic; }
.session-detail-tool-call[open] > summary .ac-outcome,
.session-detail-tool-call > summary:hover .ac-outcome { color: var(--text-1); }

/* ═══ C · fan-out — one card per burst, a lane per agent on a shared axis ═══ */
.ac-c-card { min-width: 0; border: var(--box-border); border-radius: 8px; background: var(--surface-row); overflow: hidden; }
.ac-c-head { display: flex; align-items: center; gap: 10px; min-height: 26px; padding: 3px 10px 3px 9px; border-bottom: 1px solid var(--border-mid); background: var(--surface-subtle); color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ac-c-head .session-detail-agent-stamp { flex: 0 0 auto; }
.ac-c-head b { color: var(--text-0); font-weight: var(--weight-semibold); }
.ac-c-range { margin-left: auto; }
.ac-c-range + span { min-width: 3.2ch; text-align: right; color: var(--text-1); }
.ac-c-head .ac-c-pad { flex: 0 0 12px; }
.ac-c-lane > summary { border: 0; border-radius: 0; min-height: 30px; background: transparent; }
.ac-c-lane + .ac-c-lane > summary,
.ac-c-lane[open] + .ac-c-lane > summary { border-top: 1px solid var(--border-mid); }
.ac-c-lane .ac-end { margin-left: 0; }
.ac-c-lane .session-detail-tool-body { padding: 4px 8px 8px; }
.ac-track { flex: 0 0 168px; position: relative; height: 12px; margin-left: auto; border-radius: 2px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--border) calc(25% - 1px) 25%); }
.ac-bar { position: absolute; top: 0; bottom: 0; box-sizing: border-box; min-width: 4px; border: 2px solid var(--session-detail-agent-edge); border-radius: 2px; background: color-mix(in srgb, var(--purple) 16%, transparent); }
.ac-bar.running { border-right: 0; border-radius: 2px 0 0 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--green) 22%, transparent), transparent); border-color: var(--session-detail-live); }
.ac-bar.interrupted, .ac-bar.incomplete { border-color: var(--session-detail-amber); border-right-style: dashed; }
.ac-bar.failed { border-color: var(--danger-text); background: var(--danger-text); }

/* ═══ D · ticket — the length on a perforated stub ═══ */
.ac-d > summary { position: relative; min-height: 42px; padding: 0 10px 0 0; }
.ac-d-stub { flex: 0 0 62px; box-sizing: border-box; align-self: stretch; display: grid; align-content: center; justify-items: center; gap: 1px; border-right: 2px dashed var(--session-detail-agent-edge); color: var(--session-detail-agent); }
.ac-d-len { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ac-d-clock { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-3xs); line-height: 1.2; font-variant-numeric: tabular-nums; }
.ac-d > summary::before, .ac-d > summary::after { content: ""; position: absolute; left: 55px; width: 12px; height: 12px; box-sizing: border-box; border: 2px solid var(--accent); border-radius: 50%; background: var(--bg-0); }
.ac-d > summary::before { top: -7px; clip-path: inset(5px 0 0 0); }
.ac-d > summary::after { bottom: -7px; clip-path: inset(0 0 5px 0); }
.ac-d.status-running .ac-d-stub { color: var(--session-detail-live); border-right-color: var(--session-detail-live); }
.ac-d.status-failed .ac-d-stub { color: var(--danger-text); border-right-color: var(--danger-text); }
.ac-d.status-interrupted .ac-d-stub, .ac-d.status-incomplete .ac-d-stub, .ac-d.status-unavailable .ac-d-stub { color: var(--session-detail-amber); border-right-color: var(--session-detail-amber); }
details:not([open]) > summary .c-d, details[open] > summary .c-r { display: none; }
</style>
</head>

/* ───────── helpers ───────── */
const I = (id, s = 12) => `<svg class="icon" width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const toSec = (t) => { const [h, m, s = 0] = t.split(':').map(Number); return h * 3600 + m * 60 + s; };
const hms = (x) => [Math.floor(x / 3600), Math.floor(x % 3600 / 60), x % 60].map((n) => String(n).padStart(2, '0')).join(':');
const hm = (t) => t.slice(0, 5);
/* src/clock.ts formatDuration, same rules */
function fmtSpan(s) {
  if (s <= 0) return null;
  if (s < 60) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
const fmtDur = (a, b) => (a == null || b == null) ? null : fmtSpan(toSec(b) - toSec(a));
const compact = (n) => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n);
const calls = (a) => a.calls != null ? `<span>${compact(a.calls)} ${a.calls === 1 ? 'call' : 'calls'}</span>` : '';
const STATUS_LABEL = { completed: 'completed', running: 'running', failed: 'failed', interrupted: 'interrupted', incomplete: 'incomplete', unavailable: 'no transcript' };
function reportNote(a) {
  switch (a.status) {
    case 'running': return 'Still running — no report yet.';
    case 'failed': return 'The call failed before a report.';
    case 'interrupted': return 'Interrupted before a final message.';
    case 'unavailable': return 'No transcript is available for this agent.';
    default: return 'The transcript ends before a final message.';
  }
}
const briefNote = (a) => a.mode === 'spawn' ? 'The brief is not readable from the rollout; the child transcript opens with it.' : 'No brief was recorded for this agent.';

/* B's one legible rule: the report's first line that is not a rule (---),
   markdown taken off — links keep their text, emphasis and code marks go, a
   leading heading hash / bullet / quote mark goes. Nothing is judged, so
   filler stays filler. */
function outcomeLine(report) {
  if (!report) return null;
  const line = report.split('\n').map((l) => l.trim()).find((l) => l && !/^([-*_])\1{2,}$/.test(l));
  if (!line) return null;
  return line
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s+/, '').replace(/^>\s+/, '').replace(/^([-*+]|\d+\.)\s+/, '')
    .replace(/(\*\*|__)(.+?)\1/g, '$2')
    .replace(/`([^`]*)`/g, '$1').replace(/\s+/g, ' ').trim();
}

/* ───────── shipped pieces (real class names) ───────── */
const tile = (label) => `<span class="session-detail-event-node" role="img" aria-label="${esc(label)}" title="${esc(label)}">${I('i-fork')}</span>`;
const chev = () => `<span class="session-detail-tool-chevron" aria-hidden="true">${I('i-chevr').replace('class="icon"', 'class="icon c-r"')}${I('i-chevd').replace('class="icon"', 'class="icon c-d"')}</span>`;
const statusChip = (a) => a.status === 'completed' ? '' : `<span class="session-detail-agent-status status-${a.status}">${STATUS_LABEL[a.status]}</span>`;
function meta(a) {
  const len = fmtDur(a.t, a.end);
  return `<span class="session-detail-agent-meta">${calls(a)}${len ? `<span class="ac-len">${len}</span>` : ''}</span>`;
}
function names(a) {
  return `<span class="session-detail-agent-label" title="${esc(a.label)}">${esc(a.label)}</span>`
    + (a.task ? `<span class="session-detail-agent-task" title="${esc(a.task)}">${esc(a.task)}</span>` : '')
    + (a.role ? `<span class="session-detail-agent-pill">${esc(a.role)}</span>` : '')
    + (a.mode === 'async' ? `<span class="session-detail-agent-pill mode">async</span>` : '');
}
function pane(a) {
  const len = fmtDur(a.t, a.end);
  const facts = [
    a.role ? `<span>${I('i-fork')}${esc(a.role)}</span>` : '',
    a.model ? `<span>${esc(a.model)}</span>` : '',
    `<span>${a.mode}</span>`,
    `<span>${I('i-clock')}${hm(a.t)} → ${a.end ? hm(a.end) : '…'}${len ? ` · ${len}` : ''}</span>`,
    calls(a),
    a.tokens != null ? `<span>${compact(a.tokens)} tokens</span>` : '',
  ].join('');
  const box = (label, text, note) => `<section class="session-detail-payload-section"><div class="session-detail-payload-head"><span class="session-detail-payload-label">${label}</span>${text ? `<span class="session-detail-payload-tools"><button type="button" class="session-detail-payload-action" title="Copy to clipboard">${I('i-copy')}</button></span>` : ''}</div>${text ? `<pre class="session-detail-payload-body"><code>${esc(text)}</code></pre>` : `<p class="session-detail-agent-note">${note}</p>`}</section>`;
  const can = a.status !== 'failed' && a.status !== 'unavailable';
  return `<div class="session-detail-tool-body"><div class="session-detail-tool-payload"><div class="session-detail-agent-facts">${facts}</div>${box('Brief', a.brief, briefNote(a))}${box('Report', a.report, reportNote(a))}<div class="session-detail-agent-verbs"><button type="button" class="btn btn-ghost session-detail-agent-open"${can ? '' : ' disabled'}>${I('i-ext')}Open transcript</button></div></div></div>`;
}

/* ───────── one agent row, per option ───────── */
function summary(a, opt, open) {
  const stamp = `<span class="session-detail-tool-name session-detail-agent-stamp">Agent</span>`;
  if (opt === 'now') return `${stamp}${names(a)}${meta(a)}${statusChip(a)}${chev(open)}`;
  if (opt === 'b') {
    const line = outcomeLine(a.report);
    const out = line
      ? `<span class="ac-outcome">${I('i-msg')}<span title="${esc(line)}">${esc(line)}</span></span>`
      : `<span class="ac-outcome note">${I('i-msg')}<span>${reportNote(a)}</span></span>`;
    return `${stamp}<span class="ac-b-main"><span class="ac-b-line">${names(a)}<span class="ac-end">${meta(a)}${statusChip(a)}${chev(open)}</span></span>${out}</span>`;
  }
  if (opt === 'd') {
    const len = fmtDur(a.t, a.end);
    return `<span class="ac-d-stub"><b class="ac-d-len">${len ?? '—'}</b><time class="ac-d-clock">${hm(a.t)}</time></span>${names(a)}<span class="ac-end">${a.calls != null ? `<span class="session-detail-agent-meta">${calls(a)}</span>` : ''}${statusChip(a)}${chev(open)}</span>`;
  }
  return `${stamp}${names(a)}<span class="ac-end">${meta(a)}${statusChip(a)}${chev(open)}</span>`;
}
function agentLi(a, opt, open, gap) {
  const cls = ['session-detail-tool-call', 'session-detail-agent', `status-${a.status}`, opt === 'now' ? '' : 'floor', opt === 'b' ? 'ac-b' : '', opt === 'd' ? 'ac-d' : ''].filter(Boolean).join(' ');
  return `<li class="session-detail-row-agent" data-kind="agent">${gapChip(gap)}<article class="session-detail-event event-agent-call agent-${a.status}">${tile(`Agent · ${a.label} · ${hm(a.t)}`)}<div class="session-detail-event-body"><details class="${cls}"${open ? ' open' : ''}><summary>${summary(a, opt, open)}</summary>${pane(a)}</details></div></article></li>`;
}
const gapChip = (gap) => gap ? `<div class="session-detail-event-gap"><span>${gap}</span></div>` : '';

/* ───────── C · bursts, grouped from data ─────────
   Agents of one turn whose starts fall within 60 s of the burst's first
   start. Not adjacency: a tool row between two spawns (shown once Tool
   calls is on) lands after the card instead of splitting it. */
function bursts(sample) {
  const map = new Map(), byTurn = {};
  for (const e of sample.events) if (e.k === 'agent') (byTurn[e.turn] ||= []).push(e);
  for (const list of Object.values(byTurn)) {
    let cur = null;
    for (const e of list) {
      if (cur && toSec(e.t) - toSec(cur[0].t) <= 60) cur.push(e); else cur = [e];
      if (cur.length > 1) cur.forEach((m) => map.set(m.id, cur));
    }
  }
  return map;
}
const TONE = ['failed', 'interrupted', 'incomplete', 'unavailable', 'running', 'completed'];
function burstLi(members, sample, openId, gap) {
  const endOf = (m) => toSec(m.end ?? sample.now ?? m.t);
  const t0 = Math.min(...members.map((m) => toSec(m.t)));
  const t1 = Math.max(...members.map(endOf));
  const span = Math.max(1, t1 - t0);
  const live = members.some((m) => m.status === 'running');
  const ran = members.filter((m) => m.status !== 'failed');
  const overlap = ran.length > 1 && Math.max(...ran.map((m) => toSec(m.t))) < Math.min(...ran.map(endOf));
  const lanes = members.map((m) => {
    const l = (toSec(m.t) - t0) / span * 100, r = (endOf(m) - t0) / span * 100;
    return `<details class="session-detail-tool-call session-detail-agent floor ac-c-lane status-${m.status}"${m.id === openId ? ' open' : ''}><summary>${names(m)}${statusChip(m)}<span class="ac-track" aria-hidden="true"><i class="ac-bar ${m.status}" style="left:${l.toFixed(2)}%;width:${(r - l).toFixed(2)}%"></i></span><span class="ac-end">${meta(m)}${chev()}</span></summary>${pane(m)}</details>`;
  }).join('');
  const tone = TONE.find((st) => members.some((m) => m.status === st));
  const head = `<div class="ac-c-head"><span class="session-detail-tool-name session-detail-agent-stamp">Agents</span><b>${members.length}</b><span>${overlap ? 'in parallel' : 'in one turn'}</span><span class="ac-c-range">${hm(hms(t0))} → ${live ? '…' : hm(hms(t1))}</span><span>${live ? '' : (fmtSpan(t1 - t0) ?? '')}</span><span class="ac-c-pad"></span></div>`;
  return `<li class="session-detail-row-agent" data-kind="agent">${gapChip(gap)}<article class="session-detail-event event-agent-call agent-${tone}">${tile(`${members.length} agents · ${hm(hms(t0))}`)}<div class="session-detail-event-body"><div class="ac-c-card">${head}${lanes}</div></div></article></li>`;
}

/* ───────── the rest of the transcript (shipped markup) ───────── */
function toolLi(e) {
  return `<li class="session-detail-row-tool" data-kind="tool"><article class="session-detail-event event-tool-call tool-completed"><span class="session-detail-event-tick" aria-hidden="true"></span><div class="session-detail-event-body"><details class="session-detail-tool-call status-completed"><summary><span class="session-detail-tool-name cat-${e.cat}">${e.name}</span><span class="session-detail-tool-summary">${esc(e.cmd)}</span>${chev()}</summary></details></div></article></li>`;
}
function cardLi(e, sample, gap) {
  const prompt = e.k === 'prompt';
  const head = prompt ? `<time>${hm(e.t)}</time>${e.dur ? `<span>${e.dur}</span>` : ''}${e.calls ? `<span>${e.calls} calls</span>` : ''}` : `<time>${hm(e.t)}</time>`;
  return `<li data-kind="${e.k}">${gapChip(gap)}<article class="session-detail-event ${prompt ? 'event-prompt' : 'event-response'}"><span class="session-detail-event-node" role="img" aria-label="${prompt ? 'You' : sample.name} · ${hm(e.t)}">${I(prompt ? 'i-user' : sample.mark)}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-${prompt ? 'prompt' : 'reply'}"><div class="session-detail-card-head">${head}</div><div class="session-detail-event-copy">${e.html}</div></div></div></article></li>`;
}

const state = { tools: false, openFirst: false };
function list(sample, opt, agentsOnly = false) {
  const groups = opt === 'c' ? bursts(sample) : new Map();
  const openId = state.openFirst ? sample.events.find((e) => e.k === 'agent')?.id : null;
  let html = '', prev = null;
  for (const e of sample.events) {
    if (e.k === 'tool' && !state.tools) continue;
    if (agentsOnly && e.k !== 'agent' && e.k !== 'tool') continue;
    const wait = prev == null ? 0 : toSec(e.t) - toSec(prev);
    const gap = !agentsOnly && e.k !== 'tool' && wait >= 60 ? `+${fmtSpan(wait)}` : null;
    prev = e.t;
    if (e.k === 'tool') html += toolLi(e);
    else if (e.k === 'agent') {
      const g = groups.get(e.id);
      if (!g) html += agentLi(e, opt, e.id === openId, gap);
      else if (g[0] === e) html += burstLi(g, sample, openId, gap);
    } else html += cardLi(e, sample, gap);
  }
  return `<ol class="session-detail-event-list">${html}</ol>`;
}
function toolbar(sample) {
  const n = (k) => sample.events.filter((e) => e.k === k).length;
  const t = [['prompt', 'Prompts', true], ['reply', 'Replies', true], ['tool', 'Tool calls', state.tools], ['agent', 'Agents', true]]
    .map(([k, label, on]) => `<button type="button" class="session-detail-filter-toggle${on ? ' is-on' : ''}" aria-pressed="${on}" data-filter="${k}"><span class="session-detail-filter-box" aria-hidden="true"></span><span class="session-detail-filter-name">${label}</span><span class="session-detail-filter-count quality-exact">${n(k)}</span></button>`).join('');
  return `<div class="session-detail-toolbar"><span class="session-detail-toolbar-label">Show</span><div class="session-detail-toolbar-toggles" role="group">${t}</div></div>`;
}

/* ───────── notes ───────── */
const NOTES = {

  a: `<b>A · Floor</b> — the fixes, nothing else; B, C and D all stand on it. Length, status and chevron sit in one end cluster that carries the only auto margin, so the length stays against the chevron; the stamp is as wide as its word; the length is a right-aligned tabular slot, so a burst reads down (9m · 6m · 5m). <i>Files:</i> the agent block in App.css, one wrapper span in <code>AgentRow</code>. <i>Pins that break:</i> <code>session-detail.integration.test.tsx:368</code> (the meta moves into the cluster). Reverses nothing.`,
  b: `<b>B · Outcome line</b> — the report's first line under the name: what came back, without opening the row. One rule: the first line that isn't <code>---</code>, markdown taken off (links keep their text; heading hashes and bullets go). The synthetic samples include plain text, markdown links, and CJK report lines. The outcome line makes each visible before the row is opened. <b>Reverses a shipped rule:</b> a done run said nothing and its report waited behind the row (<code>:371</code> asserts exactly that). <i>Files:</i> <code>AgentRow</code>, an <code>agentOutcomeLine</code> helper in sessionDetailModel.ts, App.css. <i>Pins:</i> :371 reversed, :368 moves; new pins for the strip rule.`,
  c: `<b>C · Fan-out</b> — agents started in one turn within 60 s of each other become one card: a head with count, range and length, then a lane per agent with its span on the burst's shared axis, so overlap and the long pole read at a glance. Grouping comes from the data (turn + start), not from rows being adjacent: switch Tool calls on and the <code>exec_command</code> that ran between two fixture spawns lands after the card instead of splitting it. Lone agents stay A rows. <i>Files:</i> SessionDetailTimeline.tsx (one li and one gap chip per burst), a <code>groupAgentBursts</code> helper + tests in sessionDetailModel.ts, an <code>AgentBurst</code> component beside <code>AgentRow</code>, App.css. <i>Pins:</i> the single-agent pins hold (their fixture is one agent); new pins for grouping. Reverses nothing.`,
  d: `<b>D · Ticket</b> — the bold one. Length is the one number every row always has (Codex rows carry no calls or tokens), so it moves onto a perforated stub in the display face, start clock under it; the stub takes the status colour. The stamp goes — the ticket shape and the fork tile already say agent. Same facts as A. <i>Files:</i> <code>AgentRow</code> (stub replaces the stamp and the meta length), App.css (stub, perforation, notches). <i>Pins:</i> :364 (stamp) and :368 (meta length). Reverses nothing.`,
  all: `<b>All options</b> — this sample's agent rows, stacked. The pill beside each name is the measured vertical cost. No option prints call counts on a Codex row: those need a full child parse, which simple mode refused.`,

/* ───────── page ───────── */
const OPTS = [['now', 'Now'], ['a', 'A · Floor'], ['b', 'B · Outcome line'], ['c', 'C · Fan-out'], ['d', 'D · Ticket']];
const root = document.documentElement;
const cur = () => SAMPLES[root.dataset.sample];
function measure() {
  document.querySelectorAll('#page [data-sec]').forEach((sec) => {
    let agents = 0, px = 0;
    sec.querySelectorAll('li.session-detail-row-agent').forEach((li) => {
      const card = li.querySelector('.ac-c-card');
      agents += card ? card.querySelectorAll('.ac-c-lane').length : 1;
      px += (card || li.querySelector('details')).getBoundingClientRect().height;
    });
    const out = document.querySelector(`.measure[data-for="${sec.dataset.sec}"]`);
    if (out) out.textContent = `${agents} agents · ${Math.round(px)}px of agent rows · ${(px / Math.max(1, agents)).toFixed(0)}px per agent`;
  });
}
function render() {
  const sample = cur(), opt = root.dataset.opt;
  const body = opt === 'all'
    ? OPTS.map(([k, label]) => `<div class="spec-compare-head">${label}<span class="measure" data-for="${k}"></span></div><div class="session-detail-day" data-sec="${k}">${list(sample, k, true)}</div>`).join('')
    : `<div class="session-detail-day" data-sec="${opt}"><h2 class="session-detail-day-divider"><span>${sample.day}</span></h2>${list(sample, opt)}</div>`;
  document.getElementById('page').innerHTML = toolbar(sample) + `<div class="session-detail-layout"><section class="session-detail-timeline"><div class="session-detail-days">${body}</div></section></div>`;
  document.getElementById('note').innerHTML = NOTES[opt] + (opt === 'all' ? '' : ` <span class="measure" data-for="${opt}"></span>`);
  document.querySelectorAll('.spec-btn[data-opt]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.opt === opt)));
  document.querySelectorAll('.spec-btn[data-sample]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sample === root.dataset.sample)));
  document.getElementById('tools').setAttribute('aria-pressed', String(state.tools));
  document.getElementById('openfirst').setAttribute('aria-pressed', String(state.openFirst));
  document.fonts.ready.then(measure);
}
document.querySelectorAll('.spec-btn[data-opt]').forEach((b) => b.addEventListener('click', () => { root.dataset.opt = b.dataset.opt; render(); }));
document.querySelectorAll('.spec-btn[data-sample]').forEach((b) => b.addEventListener('click', () => { root.dataset.sample = b.dataset.sample; render(); }));
document.getElementById('tools').addEventListener('click', () => { state.tools = !state.tools; render(); });
document.getElementById('openfirst').addEventListener('click', () => { state.openFirst = !state.openFirst; render(); });
document.getElementById('page').addEventListener('click', (e) => { if (e.target.closest('[data-filter="tool"]')) { state.tools = !state.tools; render(); } });
document.getElementById('page').addEventListener('toggle', () => measure(), true);
const setTheme = (dark) => { root.dataset.theme = dark ? 'dark' : 'light'; document.getElementById('theme').textContent = dark ? 'Light' : 'Dark'; };
document.getElementById('theme').addEventListener('click', () => setTheme(root.dataset.theme !== 'dark'));
const q = new URLSearchParams(location.search);
if (q.get('opt')) root.dataset.opt = q.get('opt');
if (q.get('sample')) root.dataset.sample = q.get('sample');
if (q.get('theme') === 'dark') setTheme(true);
state.tools = q.get('tools') === '1';
state.openFirst = q.get('open') === '1';
render();
</script>
</body>
</html>
