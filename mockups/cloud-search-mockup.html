<style>
  /* Board chrome only — never ships. */
  body { margin: 0; background: var(--bg-0); }
  .board { width: 1180px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 30px; }
  .board-head h1 { margin: 0 0 6px; font-family: var(--font-display); font-size: 30px; color: var(--text-0); }
  .board-head p { margin: 0 0 4px; color: var(--text-1); font-size: 14px; max-width: 86ch; line-height: 1.5; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .legend b { color: var(--text-0); }
  .sec { display: flex; flex-direction: column; gap: 10px; }
  .sec > h2 { margin: 0; font-family: var(--font-display); font-size: 21px; color: var(--text-0); display: flex; align-items: center; gap: 10px; }
  .sec > h2 em { font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-mono); color: var(--text-2); border: 1px solid var(--border-mid); border-radius: 999px; padding: 3px 9px; }
  .sec > h2 em.pick { color: var(--selection-text); background: var(--selection-bg); border-color: var(--ink-line); }
  .sec > p { margin: 0; color: var(--text-1); font-size: 13px; max-width: 96ch; line-height: 1.5; }
  .caption { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin: 8px 0 -2px; }

  /* A shot is a slice of the real page, clipped. */
  .shot { position: relative; border: 1px dashed var(--border-mid); border-radius: 12px; padding: 10px; background: var(--bg-0); overflow: hidden; }
  .shot .shell { min-height: 0; padding: 0; gap: 8px; }
  .shot .page { padding: 8px 0 0; width: 100%; }
  .anchor { position: relative; }

  /* ---- the dropdown: the site's box grammar, hairline dividers inside ---- */
  .omni {
    position: absolute; z-index: 5; width: 460px;
    border: var(--box-border); border-radius: var(--retro-panel-radius);
    background: var(--surface-card); box-shadow: var(--shadow-card);
    padding: 6px 6px 4px; text-align: left;
  }
  .omni-group { padding: 6px 0 2px; }
  .omni-group + .omni-group { border-top: 1px solid var(--border); margin-top: 4px; }
  .omni-label { display: flex; align-items: center; gap: 6px; padding: 2px 10px 5px; font-family: var(--font-display); font-size: var(--type-xs); font-weight: var(--weight-bold); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .omni-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; color: var(--text-1); font-size: var(--type-lg); }
  .omni-row.is-active { background: var(--surface-row-active); }
  .omni-row.is-hover { background: var(--surface-row-hover); }
  .omni-row .who { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; flex: 1 1 auto; }
  .omni-row .who b { max-width: 100%; font-family: var(--font-display); font-weight: var(--weight-bold); color: var(--text-0); font-size: var(--type-lg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .omni-row .who small { max-width: 100%; color: var(--text-2); font-size: var(--type-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .omni-row .tail { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; color: var(--text-2); font-size: var(--type-xs); }
  .omni-row .hint { font-family: var(--font-display); font-weight: var(--weight-bold); font-size: var(--type-xs); color: var(--text-2); opacity: 0; }
  .omni-row.is-active .hint, .omni-row.is-hover .hint { opacity: 1; }
  .kind-tile.tile-xs { width: 28px; height: 28px; border-radius: 8px; box-shadow: none; }
  .omni-ico { flex: 0 0 auto; display: inline-grid; place-items: center; width: 28px; height: 28px; color: var(--text-2); }
  .avatar-xs { width: 26px; height: 26px; border-radius: 999px; border: 2px solid var(--ink-line); object-fit: cover; flex: 0 0 auto; margin: 0 1px; background: var(--bg-3); }
  .omni-foot { display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--border); margin-top: 4px; padding: 7px 10px 3px; font-size: var(--type-xs); color: var(--text-2); }
  .omni-foot .spacer { margin-left: auto; }
  kbd { font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--border-mid); border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; color: var(--text-1); background: var(--bg-2); }
  .need { color: var(--yellow); font-size: 12px; font-weight: 700; }
  mark { background: var(--selection-bg); color: var(--selection-text); border-radius: 2px; padding: 0 1px; }

  /* the launcher in the top bar (direction B) */
  .omni-launcher { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; width: 300px; padding: 0 8px 0 10px; border: 2px solid var(--control-border); border-radius: var(--r); background: var(--bg-4); color: var(--text-2); font: inherit; font-size: var(--type-md); cursor: pointer; }

  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 32px; border: 2px solid var(--control-border); border-radius: var(--r); background: var(--button-bg); color: var(--text-1); box-shadow: var(--shadow-control); cursor: pointer; }
  .topbar.with-omni .topbar-account { margin-left: 0; }
  .topbar.with-omni .omni-slot { margin-left: auto; }
  .field.is-open { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .field.field-wide input { width: 240px; }
  .field .caret { width: 1px; height: 15px; background: var(--text-0); margin-left: -4px; }

  /* the palette (direction C) */
  .scrim { position: absolute; inset: 0; background: rgba(20, 14, 8, .5); border-radius: 12px; }

  .palette { position: absolute; left: 50%; transform: translateX(-50%); top: 56px; width: 560px; }
  .palette .omni { position: static; width: 100%; padding-top: 0; }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .palette-input input { flex: 1; border: 0; background: transparent; color: var(--text-0); font-family: var(--font-display); font-size: 18px; font-weight: var(--weight-bold); outline: none; }
</style>
</head>
<body>
<div class="board"></div>
<script>

const ICON = {

  "git-folder": ["M4 4h6v2H4ZM4 18h16v2H4ZM20 8h2v10h-2ZM2 6h2v12H2ZM10 6h10v2H10Z", "M7 10h2v2H7ZM9 12h2v2H9ZM7 14h2v2H7ZM12 14h5v2h-5Z"],

/* ---------- the board ---------- */
document.querySelector(".board").innerHTML = `
<div class="board-head">
  <h1>Search bar · three directions</h1>
  <p>GitHub's search is a <b>launcher in the top bar</b> that opens an anchored panel of grouped suggestions: recent searches first, then jump-to repositories and owners, then a “search everywhere” row, closing with a keyboard-hint footer. Below is that idea in Mallard's box-and-ink grammar, at three positions. <b>The suggestion rows are identical in all three</b> — only the position and the surrounding chrome change, so pick a position first.</p>
  <div class="legend">
    <span><b>Today:</b> one field in the list bar, filtering only the rows already on screen.</span>
    <span><span class="need">✦</span> <b>needs a new <code>/v1/search</code> endpoint.</b> Every other row runs on what the page already holds.</span>
  </div>
</div>

<section class="sec">
  <h2>A · In place <em>smallest change</em></h2>
  <p>The field stays where it is, at the right of the list bar beside the filter pills. Focusing it drops a panel underneath, aligned to the field's right edge. Page-local: it belongs to the repository list, so a repository, session or profile page still has no search.</p>
  <p class="caption">Closed</p>

</section>

<section class="sec">
  <h2>B · Top bar launcher <em class="pick">closest to GitHub · recommended</em></h2>
  <p>A search button sits in the header between the nav and the account block, wearing a <kbd>/</kbd> hint; clicking it — or pressing <kbd>/</kbd> anywhere — turns it into a live input with the panel anchored below. It follows you onto every page, so repository, session and profile pages get search they do not have today. The list bar keeps its own “Find a repository” field for narrowing the rows on screen: two jobs, two controls, exactly as on GitHub.</p>

  <p class="caption">Open — nothing typed yet</p>
