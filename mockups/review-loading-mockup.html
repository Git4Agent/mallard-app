<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push and Pull loading — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1560px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-seg:disabled { opacity: .45; cursor: default; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(760px, 1fr)); gap: 26px 22px; align-items: start; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title small { margin-right: 6px; color: var(--text-3); font-weight: 600; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; max-width: 820px; }
      .spec-col-note b { color: var(--text-1); }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); }
      .spec-frame .sync-main { height: auto !important; min-height: 240px; overflow: visible !important; }
      .spec-live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 8px; }
      .spec-live-bar .spec-clock { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
      .spec-dots { display: flex; gap: 4px; }
      .spec-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--border-mid); }
      .spec-dots i.on { background: var(--text-0); }

      /* ——— proposed app CSS (mock-only, A and B) ——————————————————— */
      /* The stage line takes the search field's slot and geometry (38px,
         12px below, one rule under it); the rule is the progress track, in
         the direction's ink (cloud for a pull, local for a push) on the
         meter's own --loader-track. The dots name the stage; the tooltip
         lists them. */
      .sync-name-search.mk-stage { position: relative; border-bottom-color: transparent; }
      .mk-stage .sync-name-search-input { color: var(--text-1); font-size: var(--type-sm); }
      .mk-stage .sync-name-search-input > b { min-width: 0; overflow: hidden; color: var(--text-0); font-weight: var(--weight-semibold); white-space: nowrap; text-overflow: ellipsis; }
      .mk-prep-readout { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .mk-prep-track { position: relative; display: block; height: 4px; border-radius: 999px; background: var(--loader-track); overflow: hidden; }
      .mk-prep-track > i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: inherit; background: var(--thread-status-cloud); }
      .mk-prep-track.push > i { background: var(--thread-status-local); }
      .mk-prep-track.indeterminate > i { width: 28%; animation: mk-indeterminate 1.5s ease-in-out infinite; }
      @keyframes mk-indeterminate { from { transform: translateX(-100%); } to { transform: translateX(360%); } }
      .mk-stage-track { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; }
      .mk-stage-dots { display: inline-flex; align-items: center; gap: 4px; }
      .mk-stage-dots i { width: 7px; height: 7px; box-sizing: border-box; border: 1.5px solid var(--text-3); border-radius: 50%; }
      .mk-stage-dots i.done { border-color: var(--text-2); background: var(--text-2); }
      .mk-stage-dots i.now { border-color: var(--text-0); background: var(--text-0); }
      /* Round 2 slots: the search field's own box with its rule hidden
         until the field lands (pixels only). */
      .sync-name-search.mk-slot { border-bottom-color: transparent; }
      .mk-slot > .loading-scaffold-caption { margin: 0; font-size: var(--type-sm); }
      .mk-head-status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: var(--text-2); font-size: var(--type-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
      /* Today's session row is two lines, 68px; the shipped `rows` scaffold
         still draws the older 53px row. Redrawn to the landed height here. */
      .mk-bones .loading-scaffold-row { padding: 17px 12px 19px; }
      /* B: the progress notice under the path bar carries the same track. */
      .mk-notice-track { display: block; width: min(420px, 100%); margin-top: 6px; }
      .mk-notice-readout { margin-left: 6px; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; }
      /* A: while the review prepares, the tools row keeps its slot in bone. */
      .mk-tools-checking { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/review-loading-mockup.tsx"></script>
  </body>
</html>
