<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog back button — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 2500px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 12px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { margin: 0; font: 700 20px/1.2 system-ui; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-col-title { margin: 0 0 2px; font: 700 14px/1.3 system-ui; }
      .spec-seen { margin: 0 0 8px; color: var(--text-2); font-size: 12px; }
      .spec-seen a { color: var(--text-1); }
      .spec-against { color: var(--text-2); }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }

      /* One window column per frame: the bar, then the page, as the live
         harness draws it. */
      .mk-frame { height: 560px; display: flex; overflow: hidden; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--retro-frame-gutter); font-family: var(--font-sans); }
      .mk-frame-column { display: flex; flex-direction: column; flex: 1; min-width: 0; height: 100%; }
      .mk-frame .sync-main { overflow-y: auto; padding-inline: var(--live-pad); }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* The button's row. 1: the section's first child, so whatever stands
         above the item — an outcome, the repository the first Push creates,
         a blocked note — comes after it, 12px down, the page's own gap. 2:
         the item page's first grid row. */
      .mk-back-host { display: flex; }
      .profile-links-section > .mk-back-host { margin-bottom: 12px; }
      .profile-links-section > .mk-back-host + .catalog-item-page { margin-top: 0; }

      /* 3 ships: its frame is the page as it is. Every other frame takes the
         shipped button out of the line, and the line out where it held only
         the button (the rail's widths, a file's page). */
      .mk-unshipped .catalog-item-line > .sync-page-back { display: none; }
      .mk-unshipped .catalog-item-line:has(> .sync-page-back:only-child) { display: none; }
      @container catalog-item (min-width: 880px) {
        .mk-unshipped .catalog-item-line { display: none; }
      }

      /* ‹ only: the shipped button without its words, a 26px round. */
      .mk-chevron .sync-page-back > span { display: none; }
      .mk-chevron .btn.sync-page-back { width: 26px; padding: 0; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/catalog-back-mockup.tsx"></script>
  </body>
</html>
