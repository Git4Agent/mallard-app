<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pull this session — the link, in the app</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1180px; margin: 0 auto; padding: 14px 20px 60px; display: grid; gap: 12px; font: 13px/1.45 system-ui, sans-serif; }
      .spec > * { min-width: 0; }
      .spec-title { margin: 0; font: 700 19px/1.2 system-ui; }
      .spec-title small { margin-left: 8px; color: var(--text-3); font: 400 13px/1.2 system-ui; }
      .spec-controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .spec-seg { padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.3 system-ui; cursor: pointer; }
      .spec-seg b { margin-right: 3px; color: var(--text-3); font-weight: 600; }
      .spec-seg[aria-pressed="true"] { border-color: var(--text-0); background: var(--text-0); color: var(--bg-0); }
      .spec-seg[aria-pressed="true"] b { color: inherit; opacity: 0.7; }
      .spec-card { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-card p { margin: 0; color: var(--text-1); }
      .spec-card p > span { display: inline-block; min-width: 64px; margin-right: 6px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      .spec-card code { font: 12px/1.3 ui-monospace, monospace; padding: 0 3px; border-radius: 4px; background: var(--chip-bg); overflow-wrap: anywhere; }

      /* The website's half: the page's button, and the link the browser hands over. */
      .spec-browser { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-browser > span { flex: none; color: var(--text-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .spec-browser > code { flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px/1.4 ui-monospace, monospace; color: var(--text-1); }
      .spec-browser > button { flex: none; }

      /* The app window, at its default size. */
      .spec-frame { position: relative; height: 720px; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; }
      .spec-frame > .sync-app { height: 100%; }
      .spec-standin { margin: 56px auto; max-width: 460px; padding: 18px 20px; border: 1px dashed var(--border-strong); border-radius: 12px; text-align: center; color: var(--text-2); font: 13px/1.5 system-ui, sans-serif; }
      .spec-standin strong { display: block; margin-bottom: 4px; color: var(--text-0); font-size: 14px; }
      .spec-new { text-decoration: underline dotted; text-underline-offset: 3px; }
      .storage-found-sub { display: block; margin-top: 2px; color: var(--text-2); font-size: 12px; }

      /* The sheet, frozen in place over the window. */
      .spec-scrim { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg-0) 55%, transparent); backdrop-filter: blur(2px); }
      .spec-scrim > dialog.spec-sheet { position: relative; inset: auto; margin: 0; width: 560px; max-width: calc(100% - 48px); }

      .spec-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
      .spec-notes .spec-card > strong { font-size: 13px; }
      .spec-notes ul { margin: 2px 0 0 18px; padding: 0; display: grid; gap: 2px; color: var(--text-1); }
      .spec-stage { color: var(--text-3); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/session-pull-mockup.tsx"></script>
  </body>
</html>
