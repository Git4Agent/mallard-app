<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push: project file defaults — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1440px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel > strong { display: block; margin-bottom: 4px; font-size: 14px; }
      .spec-panel > p { margin: 0 0 6px; color: var(--text-2); max-width: 1100px; }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; max-width: 1100px; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-panels { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); align-items: start; }
      .spec-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      .spec-table th, .spec-table td { padding: 5px 8px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-table thead th { border-top: 0; color: var(--text-2); font-weight: 600; white-space: nowrap; }
      .spec-table tbody th { font-weight: 600; white-space: nowrap; }
      .spec-table td.pick { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
      .spec-table a, .spec-panel li a { color: inherit; }
      .spec-table td.spec-table-group { padding-top: 10px; border-top: 0; color: var(--text-2); font-weight: 700; }
      .spec-table tbody + tbody tr:first-child td { border-top: 1px solid var(--border); }
      .spec-yes, .spec-no, .spec-ask { display: inline-block; padding: 0 6px; border-radius: 999px; font: 600 11px/1.6 system-ui; white-space: nowrap; }
      .spec-yes { background: color-mix(in srgb, var(--thread-status-local, #2a6fb0) 18%, transparent); }
      .spec-no { background: var(--chip-bg); color: var(--text-2); }
      .spec-ask { background: var(--warning-soft); color: var(--warning-text); }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; min-height: 5.8em; }
      .spec-measure { margin: 6px 0 0; color: var(--text-2); font: 600 11.5px/1.5 var(--font-mono); }
      .spec-measure b { color: var(--text-0); }
      .spec-measure i { color: var(--warning-text); font-style: normal; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-sync-review-scroll { height: 300px; overflow-y: auto; }
      .spec-stack { display: grid; gap: 30px 28px; justify-content: start; }
      .spec-shot .spec-controls, .spec-shot .spec-panel, .spec-shot .spec-panels, .spec-shot .spec-title, .spec-shot .spec-sub { display: none; }

      /* The Sessions tab is out of scope: a stand-in list, drawn with the
         file cards' own classes so the selection still works. */
      .mk-session-list { display: grid; gap: 6px; }
      .mk-session-list .sync-history-thread-time { margin-left: auto; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* C — the standing rule for new files, saved with the storage link. */
      .mk-newfiles-rule { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: var(--text-2); font-size: var(--type-xs); }
      .mk-newfiles-rule > span { font-weight: var(--weight-semibold); color: var(--text-1); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/push-file-defaults-mockup.tsx"></script>
  </body>
</html>
