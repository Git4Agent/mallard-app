<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar add on New project — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1500px; margin: 0 auto; padding: 16px 20px 60px; display: grid; gap: 16px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 19px/1.2 system-ui; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-card { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); display: grid; gap: 4px; }
      .spec-card ul { margin: 2px 0 0 18px; display: grid; gap: 2px; }
      .spec-card code, .spec p code { font: 12px/1.3 ui-monospace, monospace; padding: 0 3px; border-radius: 4px; background: var(--chip-bg); }
      .spec-frame { height: 720px; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; }
      .spec-frame > .sync-app { height: 100%; }
      .spec-h2 { margin: 8px 0 0; font: 700 15px/1.3 system-ui; }
      .spec-compare { display: flex; flex-wrap: wrap; gap: 16px; }
      .spec-compare figure { margin: 0; display: grid; gap: 6px; }
      .spec-compare figcaption { font: 600 12px/1.3 system-ui; color: var(--text-2); }
      .spec-compare figcaption small { display: block; font-weight: 400; color: var(--text-3); }
      .spec-mini { width: 330px; height: 430px; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; }
      .spec-mini > .sync-app { height: 100%; }
      .spec-placeholder { margin: 80px auto; max-width: 440px; text-align: center; color: var(--text-2); }
      .spec-placeholder strong { display: block; margin-bottom: 6px; color: var(--text-0); font-size: var(--type-md); }

      /* No new app CSS: the stock :disabled rules already dim the rail's +
         (.sidebar-section-action:disabled) and the empty rail's door
         (.sidebar-door:disabled). */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/sidebar-add-current-mockup.tsx"></script>
  </body>
</html>
