<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New project page — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1500px; margin: 0 auto; padding: 16px 20px 60px; display: grid; gap: 16px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 19px/1.2 system-ui; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(620px, 1fr)); gap: 18px; align-items: start; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; }
      .spec-frame { border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; }
      .spec-frame .sync-main { height: auto !important; overflow: visible !important; }
      .spec-common { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-common ul { margin: 4px 0 0 18px; display: grid; gap: 2px; }

      /* ——— proposed app CSS (shared by the directions) ——————————— */
      /* The field needs no label of its own once the band is named Folder. */
      .nps-band .sync-project-folder-field > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .nps-list-head { max-width: var(--sync-setup-column); display: flex; align-items: baseline; gap: 8px; color: var(--text-1); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
      .nps-list-head small { color: var(--text-3); font-weight: var(--weight-regular); }
      .nps-list-head .btn-link { margin-left: auto; font-size: var(--type-2xs); color: var(--text-2); }
      .nps-hidden-note { max-width: var(--sync-setup-column); color: var(--text-3); font-size: var(--type-2xs); }
      .nps-marks { display: inline-flex; gap: 4px; align-items: center; color: var(--text-2); }
      .nps-more { width: 100%; min-height: 38px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--text-2); font: inherit; font-size: var(--type-xs); cursor: pointer; }
      .nps-more:hover { background: var(--surface-row-hover); color: var(--text-0); }

      /* A: the Repository band's option rows, one per folder. */
      .nps-a .sync-bundle-match-options { max-width: var(--sync-setup-column); }
      .nps-a .sync-bundle-match-meta { gap: 3px; }

      /* B: Add Catalog resource's choice cards. */
      .nps-b .setup-choice-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
      .nps-card-name { min-width: 0; overflow: hidden; font-family: var(--font-display); font-size: var(--type-md); font-weight: var(--weight-bold); text-overflow: ellipsis; white-space: nowrap; }
      .nps-card-path { min-width: 0; overflow: hidden; color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-3xs); text-overflow: ellipsis; white-space: nowrap; }
      .nps-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-3); font-size: var(--type-2xs); }
      .nps-card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }

      /* C: one line per folder, grouped by when it was last used. */
      .nps-c .sync-bundle-choice-list { max-width: var(--sync-setup-column); }
      .nps-group { padding: 7px 12px 3px; color: var(--text-3); font-size: var(--type-3xs); font-weight: var(--weight-semibold); letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
      .nps-line { width: 100%; min-height: 36px; padding: 0 12px; display: grid; grid-template-columns: 16px minmax(0, max-content) minmax(0, 1fr) auto 56px; align-items: center; gap: 9px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text-1); font: inherit; text-align: left; cursor: pointer; }
      .nps-line:last-child { border-bottom: 0; }
      .nps-line:hover, .nps-line.active { background: var(--surface-row-hover); }
      .nps-line.active { box-shadow: inset 2px 0 0 var(--accent); background: var(--accent-soft); }
      .nps-line strong { overflow: hidden; color: var(--text-0); font-size: var(--type-sm); text-overflow: ellipsis; white-space: nowrap; }
      .nps-line-path { overflow: hidden; color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-3xs); text-overflow: ellipsis; white-space: nowrap; }
      .nps-line-when { justify-self: end; color: var(--text-3); font-size: var(--type-2xs); }
      .nps-chip { margin-left: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/project-add-step-mockup.tsx"></script>
  </body>
</html>
