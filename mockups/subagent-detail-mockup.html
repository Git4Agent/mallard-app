html, body { height: auto; overflow: auto; }
body { background: var(--retro-frame-gutter); padding: 18px 20px 80px; }
.spec-bar { max-width: 1180px; margin: 0 auto 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spec-title { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-right: auto; }
.spec-btn { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-0); background: var(--button-bg); border: var(--box-border); border-radius: 999px; padding: 5px 13px; cursor: pointer; box-shadow: var(--shadow-card); }
.spec-btn:active { transform: translate(1px,1px); box-shadow: none; }
.spec-btn[aria-pressed="true"] { background: var(--button-primary-bg); color: var(--button-primary-text); }
.spec-gap { width: 10px; }
.spec-note { max-width: 1180px; margin: 0 auto 12px; color: var(--text-2); font-size: var(--type-sm); line-height: 1.5; }
.spec-note b { color: var(--text-0); font-family: var(--font-display); }
.spec-note i { color: var(--text-1); font-style: normal; }
.spec-note p + p { margin-top: 4px; }
.frame { max-width: 1180px; margin: 0 auto; background: var(--bg-0); border: var(--box-border); border-radius: var(--retro-panel-radius); box-shadow: var(--shadow-card); padding: 18px 22px 30px; }
html[data-width="narrow"] .frame { max-width: 760px; }
.session-detail-page { max-width: none; }
svg.icon { width: 12px; height: 12px; flex: 0 0 auto; }
.icon-pixel-fill { shape-rendering: crispEdges; }
.session-detail-event-list { padding: 0; margin: 0; }
.session-detail-tool-call > summary { list-style: none; }
.session-detail-tool-call > summary::marker { content: ""; }
[hidden] { display: none !important; }

/* ═══ shared across directions ═══ */
/* The verb on the app's bordered pill — .btn, not .btn-ghost — one size under
   the toolbar's 34px so it seats inside a dense pane. */
.ag-verb { min-height: 28px; padding: 0 12px; gap: 6px; font-size: var(--type-xs); }
/* Optional: the verb also on the collapsed row, as a 24px keycap before the
   chevron, so no row has to be opened to reach its transcript. */
.ag-row-open { flex: 0 0 auto; }
.ag-row-open:disabled { opacity: var(--button-disabled-opacity); cursor: default; }

/* ═══ A · head band — chosen; drawn with the shipped class names, so this
   direction shows App.css itself, not specimen CSS ═══ */

/* ═══ B · footer bar ═══ */
.ag-bar { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 10px 0 11px; border: var(--box-border); border-radius: 8px; background: var(--button-bg); box-shadow: var(--shadow-card); color: var(--text-0); font: inherit; font-size: var(--type-sm); font-weight: var(--weight-bold); text-align: left; cursor: pointer; }
.ag-bar:hover:not(:disabled) { background: var(--button-bg-hover); }
.ag-bar:active:not(:disabled) { transform: translate(1px,1px); box-shadow: none; }
.ag-bar:disabled { opacity: var(--button-disabled-opacity); cursor: default; }
.ag-bar-meta { margin-left: auto; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); font-weight: var(--weight-regular); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ag-bar > .chev { display: inline-flex; color: var(--text-3); }

/* ═══ C · sidebar ═══ */
.ag-split { grid-template-columns: minmax(0, 1fr) 208px; gap: 9px 12px; align-items: start; }
.ag-texts { min-width: 0; display: grid; gap: 9px; }
.ag-side { display: grid; gap: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-4); }
.ag-side > .ag-verb { width: 100%; }
.ag-dl { margin: 0; display: grid; gap: 2px; }
.ag-dl > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-height: 18px; font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }
.ag-dl dt { color: var(--text-2); }
.ag-dl dd { margin: 0; min-width: 0; overflow: hidden; color: var(--text-1); text-align: right; text-overflow: ellipsis; white-space: nowrap; }
.ag-dl dd.strong { color: var(--text-0); }
.ag-dl dd.absent { color: var(--text-2); font-style: italic; }
@container session-detail-layout (max-width: 780px) {
  .ag-split { grid-template-columns: minmax(0, 1fr); }
  .ag-side { order: -1; }
}

/* ═══ D · page preview ═══ */
.ag-preview { min-width: 0; border: var(--box-border); border-radius: 8px; background: var(--surface-subtle); overflow: hidden; }
.ag-titlebar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "crumb verb" "facts verb"; align-items: center; column-gap: 12px; row-gap: 6px; padding: 7px 9px 8px 10px; border-bottom: 1px solid var(--border-mid); background: var(--bg-4); }
.ag-crumb { grid-area: crumb; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); }
.ag-crumb > b { min-width: 0; overflow: hidden; color: var(--text-0); font-family: var(--font-sans); font-size: var(--type-md); font-weight: var(--weight-semibold); text-overflow: ellipsis; white-space: nowrap; }
.ag-crumb > .sep { color: var(--text-3); }
.ag-crumb > .task { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-xs); }
.ag-titlebar > .session-detail-agent-facts { grid-area: facts; }
.ag-title-verb { grid-area: verb; display: grid; justify-items: end; gap: 4px; }
.ag-preview-body { display: grid; gap: 8px; padding: 8px 9px 9px; }
.ag-pcard { min-width: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-4); overflow: hidden; }
.ag-pcard > .session-detail-card-head { padding: 3px 10px; font-size: var(--type-2xs); }
.ag-pcard.prompt > .session-detail-card-head { color: var(--session-detail-you); }

.ag-pcard > .session-detail-event-copy h2 { margin: 10px 0 4px; font-size: var(--type-md); }
.ag-pcard > .session-detail-event-copy > :first-child { margin-top: 0; }
.ag-pcard > .session-detail-agent-note { padding: 8px 10px 9px; }

/* ───────── direction notes ───────── */
const NOTES = {
  a: `<b>A · Head band.</b> <i>Heritage: GitHub's pull-request header, Finder's Get Info.</i> The verb moves to the top of the pane and takes the app's bordered pill instead of the ghost: it is the first thing the open row shows, beside the facts, before any text. Brief and report stay as bounded payload boxes. For Codex the empty Brief section is gone: the verb is the way to the brief, and an apology in its place only sent the reader looking for a second control. Least change. <i>Chosen.</i> <i>Tradeoff:</i> on a tall report the verb scrolls away with the head, and a reader who came for the report finds nothing to press at the bottom.`,
  b: `<b>B · Footer bar.</b> <i>Heritage: Slack's View thread, GitHub's View all comments.</i> The verb becomes a full-width row at the foot of the pane, on the punchcard row's own shape — 2px ink box, 8px corner, shadow — so it reads as the next thing to open rather than a button that happens to be there. Its right edge carries the run's numbers (calls · length). <i>Tradeoff:</i> it sits below the 200px report box, so the reader reaches it after the report — right for "I read the summary, now the whole thing", wrong for a reader who wants the transcript first.`,
  c: `<b>C · Sidebar.</b> <i>Heritage: GitHub's issue sidebar, Linear's detail panel.</i> The pane splits: texts on the left, a facts card on the right with the verb at its top. The chips become a key–value list the eye scans down (role, model, mode, started, ended, length, calls, tokens; for Codex the absent brief and model are stated as absent), and the verb stays beside the report at any report height. Under 780px the card stacks above the texts, verb first — press <i>Narrow</i>. <i>Tradeoff:</i> the report's measure narrows by 220px, and the pane grows a second frame inside the frame.`,
  d: `<b>D · Page preview.</b> <i>Heritage: an email client's thread preview, Notion's page peek.</i> The pane is drawn as a peek at the child's own page: its crumb (<i>session › agent</i>) in a title bar with the verb at the bar's right edge, the facts chips under it, then the brief and the report as prose cards — the report rendered as markdown like every reply on this page, not as a stored-value box. The verb sits where a page's open verb always sits. <i>Tradeoff:</i> prose costs more height than a pre box, so the cards stay bounded at 220px; the crumb repeats the row's label.`,
};

/* ───────── helpers ───────── */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const REPORT_NOTE = { running: 'Still running — no report yet.', failed: 'The call failed before a report.', interrupted: 'Interrupted before a final message.', unavailable: 'No transcript is available for this agent.', incomplete: 'The transcript ends before a final message.' };
const briefNote = (a) => a.mode === 'spawn' ? 'The brief is not readable from the rollout; the child transcript opens with it.' : 'No brief was recorded for this agent.';
const cur = () => SAMPLES[document.documentElement.dataset.sample];

/* markdown → HTML for the prose direction: headings, bullets, bold, code. */
function md(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', list = false, para = [];
  const flush = () => { if (para.length) { out += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const close = () => { if (list) { out += '</ul>'; list = false; } };
  for (const l of text.split('\n')) {
    if (/^## /.test(l)) { flush(); close(); out += `<h2>${inline(l.slice(3))}</h2>`; }
    else if (/^- /.test(l)) { flush(); if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(l.slice(2))}</li>`; }
    else if (l.trim() === '') { flush(); close(); }
    else { close(); para.push(l); }
  }
  flush(); close();
  return out;
}

/* ───────── the row, as shipped ───────── */
function verbButton(a, cls = 'btn ag-verb') {
  const on = !!a.transcript;
  return `<button type="button" class="${cls}" ${on ? '' : 'disabled'} title="${on ? "Open this agent's transcript as its own page" : 'No transcript is available for this agent.'}">${I('i-ext')} Open transcript</button>`;
}
function facts(a) {
  const f = [];
  if (a.role) f.push(`<span>${I('i-fork')}${a.role}</span>`);
  if (a.model) f.push(`<span>${a.model}</span>`);
  f.push(`<span>${a.mode}</span>`);
  if (a.start) f.push(`<span>${I('i-clock')}${a.start} → ${a.end ?? '…'} · ${a.length}</span>`);
  if (a.calls != null) f.push(`<span>${a.calls} calls</span>`);
  if (a.tokens) f.push(`<span>${a.tokens} tokens</span>`);
  return `<div class="session-detail-agent-facts">${f.join('')}</div>`;
}
function payload(label, text) {
  return `<section class="session-detail-payload-section"><div class="session-detail-payload-head"><span class="session-detail-payload-label">${label}</span><span class="session-detail-payload-tools"><button type="button" class="session-detail-payload-action" title="Copy to clipboard">${I('i-copy')}</button></span></div><pre class="session-detail-payload-body"><code>${esc(text)}</code></pre></section>`;
}
function noteSection(label, note) {
  return `<section class="session-detail-payload-section"><div class="session-detail-payload-head"><span class="session-detail-payload-label">${label}</span></div><p class="session-detail-agent-note">${note}</p></section>`;
}
const briefSection = (a, sample) => a.brief ? payload('Brief', a.brief) : (sample.provider === 'codex' ? '' : noteSection('Brief', briefNote(a)));
const reportSection = (a) => a.report ? payload('Report', a.report) : noteSection('Report', REPORT_NOTE[a.status] ?? REPORT_NOTE.incomplete);

/* ───────── the four panes ───────── */
function paneA(a, sample) {
  return `<div class="session-detail-tool-payload">
    <div class="session-detail-agent-head">${facts(a)}${verbButton(a, 'btn session-detail-agent-open')}</div>
    ${briefSection(a, sample)}${reportSection(a)}
  </div>`;
}

function paneB(a, sample) {
  const on = !!a.transcript;
  const meta = !on ? 'no transcript' : a.calls != null ? `${a.calls} calls · ${a.length}` : a.length;
  return `<div class="session-detail-tool-payload">
    ${facts(a)}${briefSection(a, sample)}${reportSection(a)}
    <button type="button" class="ag-bar" ${on ? '' : 'disabled'}>${I('i-ext')} Open transcript<span class="ag-bar-meta">${meta}</span><span class="chev">${I('i-chevr')}</span></button>
  </div>`;
}

function paneC(a, sample) {
  const row = (k, v, cls = '') => `<div><dt>${k}</dt><dd class="${cls}">${v}</dd></div>`;
  const rows = [];
  if (a.task) rows.push(row('task', a.task));
  if (a.role) rows.push(row('role', a.role));
  rows.push(row('model', a.model ?? 'not recorded', a.model ? '' : 'absent'));
  rows.push(row('mode', a.mode));
  if (a.start) rows.push(row('started', a.start));
  rows.push(row('ended', a.end ?? (a.status === 'running' ? 'running' : '—')));
  rows.push(row('length', a.length, 'strong'));
  rows.push(row('calls', a.calls != null ? String(a.calls) : 'not recorded', a.calls != null ? '' : 'absent'));
  rows.push(row('tokens', a.tokens ?? 'not recorded', a.tokens ? '' : 'absent'));
  if (sample.provider === 'codex') rows.push(row('brief', a.transcript ? 'in the transcript' : '—', 'absent'));
  return `<div class="session-detail-tool-payload ag-split">
    <div class="ag-texts">${briefSection(a, sample)}${reportSection(a)}</div>
    <aside class="ag-side">${verbButton(a)}<dl class="ag-dl">${rows.join('')}</dl></aside>
  </div>`;
}

function paneD(a, sample) {
  const brief = a.brief
    ? `<div class="ag-pcard prompt"><div class="session-detail-card-head"><time>${hm(a.start)}</time><span>brief</span></div><div class="session-detail-event-copy"><p>${esc(a.brief)}</p></div></div>`
    : '';
  const report = a.report
    ? `<div class="ag-pcard reply"><div class="session-detail-card-head"><time>${a.end ? hm(a.end) : '…'}</time><span>report</span></div><div class="session-detail-event-copy">${md(a.report)}</div></div>`
    : `<div class="ag-pcard reply"><div class="session-detail-card-head"><time>${a.end ? hm(a.end) : '…'}</time><span>report</span></div><p class="session-detail-agent-note">${REPORT_NOTE[a.status] ?? REPORT_NOTE.incomplete}</p></div>`;
  return `<div class="ag-preview">
    <div class="ag-titlebar">
      <div class="ag-crumb"><span>session</span><span class="sep">›</span><b title="${esc(a.label)}">${esc(a.label)}</b>${a.task ? `<span class="task">${a.task}</span>` : ''}</div>
      ${facts(a)}
      <div class="ag-title-verb">${verbButton(a)}</div>
    </div>
    <div class="ag-preview-body">${brief}${report}</div>
  </div>`;
}

const PANES = { a: paneA, b: paneB, c: paneC, d: paneD };

function agentRow(a, sample, dir) {
  const keycap = document.documentElement.dataset.keycap === 'on'
    ? `<button type="button" class="session-detail-payload-action ag-row-open" ${a.transcript ? '' : 'disabled'} title="${a.transcript ? 'Open transcript' : 'No transcript is available for this agent.'}" onclick="event.preventDefault(); event.stopPropagation();">${I('i-ext')}</button>`
    : '';
  const meta = [];
  if (a.calls != null) meta.push(`<span>${a.calls} calls</span>`);
  meta.push(`<span class="session-detail-agent-length">${a.length}</span>`);
  return `<li class="session-detail-row-agent" data-kind="agent" id="row-${a.id}">
    <article class="session-detail-event event-agent-call agent-${a.status}">
      <span class="session-detail-event-node" role="img" aria-label="Agent · ${esc(a.label)} · ${hm(a.start)}">${I('i-fork')}</span>
      <div class="session-detail-event-body">
        <details class="session-detail-tool-call session-detail-agent status-${a.status}" ${a.open ? 'open' : ''}>
          <summary>
            <span class="session-detail-tool-name session-detail-agent-stamp">Agent</span>
            <span class="session-detail-agent-label" title="${esc(a.label)}">${esc(a.label)}</span>
            ${a.task ? `<span class="session-detail-agent-task">${a.task}</span>` : ''}
            ${a.role ? `<span class="session-detail-agent-pill">${a.role}</span>` : ''}
            ${a.mode === 'async' ? `<span class="session-detail-agent-pill mode">async</span>` : ''}
            <span class="session-detail-agent-end">
              <span class="session-detail-agent-meta">${meta.join('')}</span>
              ${a.status !== 'completed' ? `<span class="session-detail-agent-status status-${a.status}">${STATUS_LABEL[a.status]}</span>` : ''}
              ${keycap}
              <span class="session-detail-tool-chevron" aria-hidden="true">${I(a.open ? 'i-chevd' : 'i-chevr')}</span>
            </span>
          </summary>
          <div class="session-detail-tool-body">${PANES[dir](a, sample)}</div>
        </details>
      </div>
    </article>
  </li>`;
}

function card(kind, sample, e) {
  const node = kind === 'prompt' ? I('i-user') : I(sample.mark);
  const head = kind === 'prompt'
    ? `<time>${e.t}</time>${e.dur ? `<span>${e.dur}</span>` : ''}${e.calls ? `<span>${e.calls} calls</span>` : ''}`
    : `<time>${e.t}</time>`;
  return `<li data-kind="${kind}"><article class="session-detail-event event-${kind === 'prompt' ? 'prompt' : 'response'}"><span class="session-detail-event-node" role="img" aria-label="${kind === 'prompt' ? 'You' : sample.name} · ${e.t}">${node}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-${kind === 'prompt' ? 'prompt' : 'reply'}"><div class="session-detail-card-head">${head}</div><div class="session-detail-event-copy">${e.html}</div></div></div></article></li>`;
}
function stepRow(e, sample) {
  return `<li data-kind="step"><article class="session-detail-event event-intermediate-step"><span class="session-detail-event-node">${I(sample.mark)}</span><div class="session-detail-event-body"><div class="session-detail-event-copy session-detail-intermediate-prose">${e.html}</div></div></article></li>`;
}

/* ───────── page ───────── */
function render() {
  const sample = cur(); const dir = document.documentElement.dataset.dir;
  const list = sample.events.map(e => {
    if (e.k === 'prompt') return card('prompt', sample, e);
    if (e.k === 'reply') return card('reply', sample, e);
    if (e.k === 'step') return stepRow(e, sample);
    return agentRow(e, sample, dir);
  }).join('');
  document.getElementById('page').innerHTML =
    `<div class="session-detail-layout"><div class="session-detail-timeline"><section class="session-detail-day"><h2 class="session-detail-day-divider"><span>${sample.day}</span></h2><ol class="session-detail-event-list">${list}</ol></section></div></div>`;
  document.getElementById('note').innerHTML = `<p>${NOTES[dir]}</p><p>${sample.note}</p>`;
  document.querySelectorAll('.spec-btn[data-dir]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
  document.querySelectorAll('.spec-btn[data-sample]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sample === document.documentElement.dataset.sample)));
  document.getElementById('keycap').setAttribute('aria-pressed', String(document.documentElement.dataset.keycap === 'on'));
  /* The chevron follows the disclosure, as the shipped row's does. */
  document.querySelectorAll('.session-detail-agent').forEach(d => d.addEventListener('toggle', () => {
    d.querySelector('.session-detail-tool-chevron').innerHTML = I(d.open ? 'i-chevd' : 'i-chevr');
  }));
}
document.querySelectorAll('.spec-btn[data-dir]').forEach(b => b.addEventListener('click', () => { document.documentElement.dataset.dir = b.dataset.dir; render(); }));
document.querySelectorAll('.spec-btn[data-sample]').forEach(b => b.addEventListener('click', () => { document.documentElement.dataset.sample = b.dataset.sample; render(); }));
document.getElementById('keycap').addEventListener('click', () => { const h = document.documentElement; h.dataset.keycap = h.dataset.keycap === 'on' ? 'off' : 'on'; render(); });
document.getElementById('width').addEventListener('click', (e) => { const h = document.documentElement; const narrow = h.dataset.width !== 'narrow'; h.dataset.width = narrow ? 'narrow' : 'wide'; e.target.textContent = narrow ? 'Wide' : 'Narrow'; e.target.setAttribute('aria-pressed', String(narrow)); });
document.getElementById('theme').addEventListener('click', (e) => { const h = document.documentElement; const dark = h.dataset.theme !== 'dark'; h.dataset.theme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Light' : 'Dark'; });
render();
</script>
</body>
</html>
