<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session page return button — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 2100px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; min-height: 3.2em; }
      .spec-measure { margin: 6px 0 0; color: var(--text-2); font: 600 12px/1.3 ui-monospace, monospace; }
      .spec-measure.over { color: var(--danger-text); }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-main { height: auto !important; min-height: 0; overflow: visible !important; }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }
      .mk-bar-host { display: contents; }

      /* The window with its sidebar hidden: the bar insets past the traffic
         lights, as `.sync-app.sidebar-hidden .sync-titlebar` does. */
      .spec.mk-sidebar-hidden .sync-titlebar { padding-left: 146px; }
      .spec.mk-sidebar-hidden .sync-titlebar::before { content: ""; position: absolute; top: 13px; bottom: 13px; left: 129px; width: 1px; background: var(--border); }
      .mk-lights { position: absolute; z-index: 8; top: 20px; left: 20px; display: flex; gap: 8px; }
      .mk-lights > i { width: 12px; height: 12px; border-radius: 50%; background: var(--border-strong); }

      /* ——— proposed app CSS (mock-only) ———————————————————————————
         Scoped under .spec: App.css is injected after this sheet, so an
         unscoped rule would lose every tie. */

      /* A · the button ahead of the trail. It is the refresh button's box, so
         the bar holds one kind of round control at each end. The bar's 12px
         gap is for the trail and its actions; the button sits 6px from the
         first crumb, the gap the actions keep between themselves. */
      .spec .mk-back-slot { display: contents; }
      .spec .mk-bar-back {
        align-self: center;
        margin-right: -6px;
      }
      /* What pays for it: 36px, the button and its gap.
         Above the 760 rung the leaf is the rigid crumb (its cap is its floor),
         so the cap gives the 36px back. */
      .spec.mk-pay [data-dir="a"] .sync-path-crumb.leaf { max-width: calc(30cqi - 36px); }
      /* Below it the leaf is already down to a few characters, so the trail
         continues its own ladder, outermost first: the storage crumb, already
         down to its mark, steps out while a session is open and is back one
         click up. An agent's page has a fourth crumb, so it steps out one
         rung earlier there. */
      @container sync-pathbar (max-width: 640px) {
        .spec.mk-pay [data-dir="a"] .sync-path-item:first-child { display: none; }
        .spec.mk-pay [data-dir="a"] .sync-path-item:nth-child(2) > .sync-path-separator { display: none; }
      }
      @container sync-pathbar (max-width: 760px) {
        .spec.mk-pay[data-page="agent"] [data-dir="a"] .sync-path-item:first-child { display: none; }
        .spec.mk-pay[data-page="agent"] [data-dir="a"] .sync-path-item:nth-child(2) > .sync-path-separator { display: none; }
      }

      /* B · shipped (2026-10-02): the frame mounts `SessionDetailBack` on the
         shipped CSS and needs no rule here. */

      /* C · the crumb that already walks back, drawn as what it does: the
         open-crumb chip (edge and fill) on the label half, and the chevron in
         the accent the bar's other controls wear. */
      .spec [data-dir="c"] .sync-path-crumb.split > .sync-path-crumb-link {
        border: 1px solid var(--border-mid);
        background: var(--chip-bg);
        color: var(--text-0);
      }
      .spec [data-dir="c"] .sync-path-crumb.split > .sync-path-crumb-link > svg { color: var(--accent); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/session-back-mockup.tsx"></script>
  </body>
</html>
