<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session page chips — live check</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }
      .live { padding: 16px 20px 400px; display: grid; gap: 18px; }
      .live-frame { border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); }
      .live-frame > h2 { margin: 0; padding: 8px 14px 0; color: var(--text-2); font: 600 12px/1.3 system-ui, sans-serif; }
      .live-frame .sync-main { height: auto !important; min-height: 0; overflow: visible !important; }
      .live-readout { margin: 0; color: var(--text-3); font: 12px/1.3 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/session-notices-live.tsx"></script>
  </body>
</html>
