<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session page notices — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 2100px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 16px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { margin: 0; font: 700 20px/1.2 system-ui; }
      .spec-sub { margin: -8px 0 0; color: var(--text-2); max-width: 1040px; }
      .spec-sub code { font: 12px/1.3 ui-monospace, monospace; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: grid; gap: 7px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-seg.rec::after { content: " ★"; color: var(--accent); }
      .spec-seg[aria-pressed="true"].rec::after { color: inherit; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; min-height: 3.2em; }
      .spec-col-note b { color: var(--text-1); }
      .spec-measure { margin: 6px 0 0; color: var(--text-2); font: 600 12px/1.3 ui-monospace, monospace; }
      .spec-measure.over { color: var(--danger-text); }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-main { height: auto !important; min-height: 0; overflow: visible !important; padding-bottom: 18px; }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }
      .spec-copy { display: grid; gap: 6px; max-width: 1240px; }
      .spec-copy table { border-collapse: collapse; width: 100%; font-size: 12px; }
      .spec-copy th, .spec-copy td { padding: 6px 8px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-copy th { color: var(--text-2); font-weight: 600; }
      .spec-copy td:first-child { font: 11px/1.4 ui-monospace, monospace; color: var(--text-2); white-space: nowrap; }
      .spec-copy td.old { color: var(--text-2); }
      .spec-rung { display: inline-block; min-width: 54px; font-weight: 700; }
      .spec-rung.warning { color: var(--warning-text); }
      .spec-rung.info { color: var(--info-text); }
      .spec-rung.danger { color: var(--danger-text); }
      .spec-rung.hidden { color: var(--text-3); }
      .mk-bar-host { display: contents; }

      /* ——— proposed app CSS (mock-only) ———————————————————————————
         Scoped under .spec: App.css is injected after this sheet, so an
         unscoped rule would lose every tie. */

      /* The page's one box. Today's rule pulls the zone 10px up into the
         header's 18px bottom margin; the footnote below keeps the same rhythm. */
      .spec .mk-zone { margin: -10px 0 18px; }

      /* Caveats as a footnote: no frame, no fill, no ×. A line in the
         strip's own small type, the rung named in its ink, and the glyph in
         the same ink. It sits right above the SHOW bar — the list it
         qualifies. */
      .spec .mk-notes {
        margin: -8px 0 14px;
        display: grid;
        gap: 4px;
        color: var(--text-2);
        font-size: var(--type-xs);
        line-height: 1.45;
      }
      .spec .mk-note {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin: 0;
      }
      .spec .mk-note > svg { flex: 0 0 auto; margin-top: 1px; }
      .spec .mk-note b { font-weight: var(--weight-semibold); }
      .spec .mk-note.info > svg, .spec .mk-note.info b { color: var(--info-text); }
      .spec .mk-note.warning > svg, .spec .mk-note.warning b { color: var(--warning-text); }
      .spec .mk-note em { font-style: normal; font-family: var(--font-mono); font-size: 0.95em; color: var(--text-1); }
      .spec .mk-note-action {
        margin-left: 4px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--session-detail-link, var(--accent));
        font: inherit;
        font-weight: var(--weight-semibold);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        white-space: nowrap;
      }
      /* Several notes fold under one line: the loudest rung's glyph and a
         count. The list opens in place, the same small type. */
      .spec .mk-notes details > summary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        list-style: none;
        cursor: pointer;
      }
      .spec .mk-notes details > summary::-webkit-details-marker { display: none; }
      .spec .mk-notes details > summary b { color: var(--text-1); }
      .spec .mk-notes details > summary.warning > svg:first-child { color: var(--warning-text); }
      .spec .mk-notes details > summary.info > svg:first-child { color: var(--info-text); }
      .spec .mk-notes details > summary > .mk-fold { color: var(--text-3); }
      .spec .mk-notes details[open] > summary > .mk-fold { transform: rotate(90deg); }
      .spec .mk-notes details > ul { margin: 5px 0 2px; padding: 0 0 0 20px; display: grid; gap: 4px; list-style: none; }

      /* Caveats as a chip on the fact strip, opening a top-layer list. */
      .spec .mk-notes-chip { cursor: pointer; background: transparent; font-family: inherit; }
      .spec .mk-notes-chip.info { color: var(--info-text); border-color: color-mix(in srgb, var(--blue) 45%, var(--border)); }
      .spec .mk-notes-chip.info > svg { color: inherit; }
      .spec .mk-notes-chip.warning { color: var(--warning-text); border-color: color-mix(in srgb, var(--yellow) 45%, var(--border)); }
      .spec .mk-notes-chip.warning > svg { color: inherit; }
      .mk-pop {
        position: fixed;
        inset: auto;
        margin: 0;
        width: min(420px, calc(100vw - 32px));
        padding: 10px 12px;
        display: grid;
        gap: 6px;
        border: var(--box-border, 2px solid var(--border-strong));
        border-radius: 8px;
        background: var(--surface-card);
        color: var(--text-1);
        box-shadow: var(--shadow-card, 0 4px 14px rgba(0,0,0,.12));
        font-family: var(--font-sans);
        font-size: var(--type-xs);
        font-weight: normal;
        letter-spacing: normal;
        text-transform: none;
        line-height: 1.45;
        text-align: left;
        white-space: normal;
      }
      .mk-pop:not(:popover-open) { display: none; }
      .mk-pop-title { margin: 0 0 2px; color: var(--text-0); font-weight: var(--weight-semibold); }

      /* Status as a chip, leading the strip's verbs — right under Push. */
      .spec .mk-status-chip.info { color: var(--info-text); border-color: color-mix(in srgb, var(--blue) 45%, var(--border)); }
      .spec .mk-status-chip.danger { color: var(--danger-text); border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
      .spec .mk-status-chip > svg { color: inherit; }
      .spec .mk-status-chip { margin-right: 4px; }

      /* Caveats anchored on the list they qualify: a glyph after the count. */
      .spec .mk-anchor {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-left: 2px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        align-self: center;
      }
      .spec .mk-anchor.info { color: var(--info-text); }
      .spec .mk-anchor.warning { color: var(--warning-text); }
      .spec .mk-anchor:hover { background: var(--surface-subtle); }
      .spec .session-detail-toolbar-readout.mk-has-anchor { display: inline-flex; align-items: center; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/session-notices-mockup.tsx"></script>
  </body>
</html>
