<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session status filter — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--retro-frame-gutter) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1480px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { margin: 0; font: 700 20px/1.2 system-ui; }
      .spec-sub { margin: -10px 0 0; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); max-width: 1180px; }
      .spec-panel > strong { display: block; margin-bottom: 2px; }
      .spec-panel ul { margin: 4px 0 0 18px; padding: 0; display: grid; gap: 3px; }
      .spec-panel a { color: inherit; }
      .spec-from { margin: 6px 0 0; color: var(--text-2); }
      .spec-std { width: 100%; margin-top: 6px; border-collapse: collapse; }
      .spec-std th, .spec-std td { padding: 5px 10px 5px 0; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-std th { width: 190px; font-weight: 600; white-space: nowrap; }
      .spec-std td:last-child { width: 34%; color: var(--text-2); }
      .spec-std thead th { border-top: 0; color: var(--text-2); font-weight: 600; }
      .spec-h { margin: 6px 0 -8px; font: 700 14px/1.3 system-ui; }
      .spec-h small { margin-left: 8px; color: var(--text-2); font-weight: 500; }
      .spec-h em { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--text-0); color: var(--bg-0); font: 600 11px/1.5 system-ui; font-style: normal; vertical-align: 2px; }
      .spec-compare { display: grid; gap: 14px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-live { max-width: 1180px; }
      .spec-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 18px 16px; align-items: start; }
      .spec-cell > span { display: block; margin: 0 0 4px 2px; color: var(--text-1); font: 600 12px/1.3 system-ui; }
      .spec-cell > span > small { margin-left: 6px; color: var(--text-2); font-weight: 500; }
      .spec-cell.narrow { width: 580px; }
      /* A state cell shows the head of the page; the list runs on below. */
      .spec-clip { max-height: var(--clip, 300px); overflow: hidden; -webkit-mask-image: linear-gradient(#000 calc(100% - 44px), transparent); mask-image: linear-gradient(#000 calc(100% - 44px), transparent); }

      /* The workspace, just enough of it: the app root for its input rules,
         the main column, the path bar, and the panel the page renders in. */
      .spec-frame > .sync-app { display: block; height: auto; overflow: visible; padding: 0; background: transparent; }
      .spec-frame .sync-main { height: auto !important; min-height: 0; overflow: visible !important; padding: 0 18px 8px; border-radius: 12px; background: var(--bg-0); }
      .spec-frame .sync-project-tab-panel { padding-top: 14px; }

      /* The four directions not picked draw their own search row above the
         shipped page, so the shipped row and its scope bar step aside. */
      .mk-swap .sync-history-content > .sync-name-search,
      .mk-swap .sync-history-content > .sync-list-head,
      .mk-swap .sync-history-content > .sync-status-scopes { display: none; }

      /* ——— proposed app CSS (mock-only) ——————————————————————————— */

      /* A, B · one chip per status the loaded rows carry: the row's own
         glyph and how many rows wear it; B adds the name. The chips sit in
         the search row, between the field and the count the two of them
         produce, and wrap under the field when they don't fit. Quiet until
         pressed; pressed doubles its edge in ink, so the state is a weight
         and not only a colour. */
      .sync-name-search-tail {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 12px;
      }
      /* The field takes the spare room while the tail sits beside it; a
         tail that has wrapped under the field takes the whole line. */
      .sync-name-search:has(> .sync-name-search-tail) > .sync-name-search-input { flex-grow: 1000; }
      .sync-list-head:has(.sync-name-search-tail),
      .sync-list-head:has(.sync-status-filter.named) { align-items: flex-start; }
      /* B: the named chips are a line of their own, inside the row's rule. */
      .sync-status-filter.named { flex: 0 0 100%; padding: 0 0 8px; }
      .sync-status-filter {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 5px 0;
      }
      .sync-status-chip {
        position: relative;
        height: 26px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 9px 0 5px;
        border: 1px solid var(--border);
        border-radius: var(--r-pill);
        background: transparent;
        color: var(--text-1);
        font: inherit;
        font-size: var(--type-2xs);
        white-space: nowrap;
        cursor: pointer;
      }
      .sync-status-chip > b { color: var(--text-2); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
      .sync-status-chip:hover { border-color: var(--button-border); color: var(--text-0); }
      .sync-status-chip:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
      .sync-status-chip[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        background: var(--bg-active);
        color: var(--text-0);
      }
      .sync-status-chip[aria-pressed="true"] > b { color: var(--text-0); font-weight: var(--weight-bold); }
      /* While the list is narrowed, the chips left out step back. */
      .sync-status-filter.narrowed .sync-status-chip[aria-pressed="false"]:not(:hover) .thread-status-icon { opacity: 0.5; }
      /* The row badge's tooltip, on a chip that carries no name. */
      .sync-status-chip[data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        z-index: 45;
        top: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        padding: 5px 7px;
        border: 1px solid var(--border-strong);
        background: var(--surface-popover);
        color: var(--text-0);
        font-size: var(--type-xs);
        font-weight: var(--weight-medium);
        line-height: 1.3;
        pointer-events: none;
        display: none;
      }
      .sync-status-chip[data-tooltip]:hover::after,
      .sync-status-chip[data-tooltip]:focus-visible::after,
      .sync-status-chip.mk-tip::after { display: block; }
      /* The way back, there only while the list is narrowed. */
      .sync-status-filter > .sync-name-search-clear { margin-left: 2px; }

      /* D · one Status button closing the search row, and the path bar's
         check menu under it. The button names what is in force. */
      .sync-status-menu { position: relative; flex: 0 0 auto; }
      .sync-status-menu > .btn { gap: 6px; }
      .sync-status-menu-glyphs { display: inline-flex; align-items: center; gap: 2px; }
      .sync-status-menu .sync-path-menu { min-width: 248px; }
      .sync-status-menu .sync-path-menu-item > small { margin-left: auto; color: var(--text-2); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }
      .sync-status-menu .sync-path-menu-check { margin-left: 0; width: 14px; }
      .sync-status-menu .sync-path-menu-check.off { visibility: hidden; }

      /* E · the session page's Show bar, as it ships, under the search row.
         The status glyph takes the tick box's place. */
      .mk-show-bar { margin: 0 0 12px; }
      .mk-show-bar .session-detail-filter-toggle { padding-left: 6px; gap: 5px; }
      .mk-show-bar .session-detail-filter-toggle:not(.is-on) .thread-status-icon { opacity: 0.45; }
      .mk-show-bar .session-detail-filter-toggle:not(.is-on) .session-detail-filter-name { text-decoration: line-through; text-decoration-color: var(--text-3); }

      /* Every direction · a narrowed list with no row left says so and
         offers the way back, in the shipped empty box. */
      .mk-emptied .sync-history-content > .sync-history-state { display: none; }
      .sync-history-state.mk-empty { margin-bottom: 12px; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mockups/session-filter-mockup.tsx"></script>
  </body>
</html>
