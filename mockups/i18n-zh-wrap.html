<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese UI — any harness</title>
  </head>
  <body>
    <!-- Any mockups/*-live.tsx harness in Chinese: ?h=<harness>&lang=zh|en&steps=Label|Label. -->
    <div id="root"></div>
    <script>
      // ?ui=en|zh-CN: the app's own catalogs in that language, no shim.
      try {
        const ui = new URLSearchParams(location.search).get("ui");
        if (ui) localStorage.setItem("mallard.language", ui);
      } catch {}
    </script>
    <script type="module" src="/mockups/i18n-zh-wrap.tsx"></script>
  </body>
</html>
