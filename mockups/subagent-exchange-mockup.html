<title>Mallard — a delegation is an exchange, three directions</title>

<style>
/* ═══ specimen chrome — not part of the app ═══ */
html, body { height: auto; overflow: auto; }
body { background: var(--retro-frame-gutter); padding: 18px 20px 80px; }
.spec-bar { max-width: 1180px; margin: 0 auto 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spec-title { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-right: auto; }
.spec-btn { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-0); background: var(--button-bg); border: var(--box-border); border-radius: 999px; padding: 5px 13px; cursor: pointer; box-shadow: var(--shadow-card); }
.spec-btn:active { transform: translate(1px,1px); box-shadow: none; }
.spec-btn[aria-pressed="true"] { background: var(--button-primary-bg); color: var(--button-primary-text); }
.spec-gap { width: 10px; }
.spec-note { max-width: 1180px; margin: 0 auto 12px; color: var(--text-2); font-size: var(--type-sm); line-height: 1.5; }
.spec-note b { color: var(--text-0); font-family: var(--font-display); }
.spec-note i { color: var(--text-1); font-style: normal; }
.spec-note p + p { margin-top: 4px; }
.frame { max-width: 1180px; margin: 0 auto; background: var(--bg-0); border: var(--box-border); border-radius: var(--retro-panel-radius); box-shadow: var(--shadow-card); padding: 18px 22px 30px; }
html[data-width="narrow"] .frame { max-width: 760px; }
.session-detail-page { max-width: none; }
svg.icon { width: 12px; height: 12px; flex: 0 0 auto; }
.icon-pixel-fill { shape-rendering: crispEdges; }
.session-detail-event-list { padding: 0; margin: 0; }
.session-detail-tool-call > summary { list-style: none; }
.session-detail-tool-call > summary::marker { content: ""; }
[hidden] { display: none !important; }

/* ═══ new classes (specimen CSS — these do not exist in App.css yet) ═══ */

/* The count the collapsed row gains: how many times parent and child spoke.
   Mono, beside the calls, so a talkative delegation is findable closed. */
.ag-count { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }

/* ── A · exchange list ── */
.ag-ex { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.ag-ex > li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 8px; align-items: start; }
/* The rail: one keyline down the gutter so the list reads as one thread. */
.ag-ex > li:not(:last-child) { position: relative; }
.ag-ex > li:not(:last-child)::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: -7px; width: 1px; background: var(--border); }
.ag-ex-mark { grid-column: 1; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: 1px solid var(--border-mid); border-radius: var(--r-pill); background: var(--bg-0); color: var(--text-2); font-family: var(--font-mono); font-size: 9px; line-height: 1; }
/* Out of the parent is the agent ink; back from the child is neutral, so a
   glance down the gutter says who was talking. */
.ag-ex > li.out > .ag-ex-mark { border-color: var(--session-detail-agent-edge); color: var(--session-detail-agent); }
.ag-ex > li.end > .ag-ex-mark { border-color: var(--session-detail-amber); color: var(--session-detail-amber); }
.ag-ex > li.live > .ag-ex-mark { border-color: var(--session-detail-live); color: var(--session-detail-live); }
.ag-ex-head { grid-column: 2; display: flex; align-items: baseline; gap: 8px; min-height: 16px; }
.ag-ex-kind { color: var(--text-1); font-size: var(--type-2xs); font-weight: var(--weight-bold); letter-spacing: .04em; text-transform: uppercase; }
.ag-ex-clock { color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }
.ag-ex-summary { min-width: 0; overflow: hidden; color: var(--text-1); font-size: var(--type-xs); text-overflow: ellipsis; white-space: nowrap; }
.ag-ex-body { grid-column: 2; margin-top: 3px; max-height: 148px; overflow: auto; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-4); color: var(--text-1); font-size: var(--type-xs); line-height: 1.5; }
.ag-ex-body p { margin: 0; }
.ag-ex-body p + p { margin-top: 6px; }
.ag-ex-note { grid-column: 2; margin: 2px 0 0; color: var(--text-2); font-size: var(--type-xs); font-style: italic; }

/* ── B · agent lane ── */
.ag-lane { padding-left: 0; }
.ag-lane .session-detail-event { align-items: flex-start; }
.ag-lane-node { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; padding: 2px 0; }
.ag-lane-tile { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border: 1px solid var(--session-detail-agent-edge); border-radius: var(--r-pill); color: var(--session-detail-agent); font-family: var(--font-mono); font-size: 9px; }
.ag-lane-node.back .ag-lane-tile { border-color: var(--border-mid); color: var(--text-2); }
.ag-lane-node.end .ag-lane-tile { border-color: var(--session-detail-amber); color: var(--session-detail-amber); }
.ag-lane-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 3px 9px; border-left: 2px solid var(--session-detail-agent-edge); border-radius: 0 6px 6px 0; background: var(--bg-4); }
.ag-lane-who { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); }
.ag-lane-text { min-width: 0; overflow: hidden; color: var(--text-1); font-size: var(--type-xs); text-overflow: ellipsis; white-space: nowrap; }
.ag-lane-clock { margin-left: auto; color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }

/* ── C · roster card ── */
.ag-roster { padding: 9px 10px 10px; border: var(--box-border); border-radius: 8px; background: var(--surface-subtle); }
.ag-roster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ag-roster-title { color: var(--text-0); font-family: var(--font-display); font-size: var(--type-sm); font-weight: var(--weight-bold); }
.ag-roster-span { margin-left: auto; color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; }
.ag-roster-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
/* A bar is a shape, not a status: the word rides beside it, so the state
   never rests on the tint alone. */
.ag-roster-row { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(0, 1.6fr) auto auto; gap: 10px; align-items: center; min-height: 26px; padding: 3px 6px; border: 1px solid transparent; border-radius: 6px; }
.ag-roster-row:hover { border-color: var(--border); background: var(--bg-0); }
.ag-roster-who { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ag-roster-name { overflow: hidden; color: var(--text-0); font-size: var(--type-sm); font-weight: var(--weight-semibold); text-overflow: ellipsis; white-space: nowrap; }
.ag-roster-role { color: var(--text-2); font-size: var(--type-2xs); }
.ag-roster-track { position: relative; height: 8px; border-radius: var(--r-pill); background: var(--bg-4); box-shadow: inset 0 0 0 1px var(--border); }
.ag-roster-bar { position: absolute; top: 0; bottom: 0; border-radius: var(--r-pill); background: var(--session-detail-agent-edge); }
.ag-roster-row.agent-interrupted .ag-roster-bar, .ag-roster-row.agent-incomplete .ag-roster-bar { background: var(--session-detail-amber); }
.ag-roster-row.agent-failed .ag-roster-bar { background: var(--danger-text); }
.ag-roster-row.agent-running .ag-roster-bar { background: var(--session-detail-live); }
.ag-roster-meta { color: var(--text-2); font-family: var(--font-mono); font-size: var(--type-2xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>

<script>
/* ───────── helpers ───────── */
const I = (id, s = 12) => `<svg class="icon" width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const span = (a, b) => { const d = mins(b) - mins(a); return d >= 60 ? `${Math.floor(d / 60)}h ${d % 60}m` : `${d}m`; };

/* Synthetic fixtures only. No provider-session content or personal paths. */
const EX = {
  brief:    { kind: 'Brief',     cls: 'out',  glyph: '→' },
  spawn:    { kind: 'Spawned',   cls: 'out',  glyph: '→' },
  followup: { kind: 'Follow-up', cls: 'out',  glyph: '→' },
  sent:     { kind: 'Sent',      cls: 'out',  glyph: '→' },
  report:   { kind: 'Report',    cls: 'back', glyph: '←' },
  answer:   { kind: 'Answered',  cls: 'back', glyph: '←' },
  stopped:  { kind: 'Stopped',   cls: 'end',  glyph: '⨯' },
  cut:      { kind: 'Interrupted', cls: 'end', glyph: '⨯' },
  running:  { kind: 'Still running', cls: 'live', glyph: '·' },
};

const SAMPLES = {
  claude: {
    provider: 'claude', mark: 'i-claude', name: 'Claude', day: 'Tuesday, 15 September 2026',
    note: '<b>Claude.</b> The brief is on the call; the follow-ups are the parent’s own <i>SendMessage</i> and <i>TaskOutput</i> rows, keyed to the agent by id, and the summary line each one already carries becomes the exchange’s label. 69% of delegations here are background runs, so the counts chip is absent on most rows and the reason is said in words.',
    events: [
      { k: 'prompt', t: '09:12', dur: '41m', calls: 28, html: '<p>Work out how the review pane decides which files to preselect, then draft the change.</p>' },
      { k: 'reply', t: '09:14', html: '<p>I’ll put two explorers on it in parallel — one on the selection rule, one on the preselect defaults — and draft once both answer.</p>' },
      { k: 'agent', turn: 't1', id: 'c1', label: 'Map the selection rule', role: 'Explore', model: 'claude-opus-5[1m]', mode: 'async', status: 'completed',
        start: '09:14', end: '09:31', calls: null, tokens: null, transcript: true, open: true,
        exchanges: [
          { k: 'brief', t: '09:14', text: 'Repository: the desktop app. Search breadth: very thorough.\n\nFind where the review pane decides which files start selected. I want the rule, the file and line, and the test that pins it.' },
          { k: 'followup', t: '09:22', summary: 'Hint: start from the selection bar, not the tab list', text: 'The bar is the thing that keeps the count, so the rule is more likely to live beside it than in the tab component.' },
          { k: 'report', t: '09:31', text: 'The rule is one function, and the test that pins it is a table test over four shapes.\n\n- Everything reviewed on the last push starts selected.\n- A file the other side changed starts cleared, whatever its last state.\n- The count in the bar is derived, never stored.' },
        ] },
      { k: 'agent', turn: 't1', id: 'c2', label: 'Trace the preselect defaults', role: 'Explore', model: 'claude-opus-5[1m]', mode: 'async', status: 'running',
        start: '09:14', end: null, calls: null, tokens: null, transcript: true,
        exchanges: [
          { k: 'brief', t: '09:14', text: 'Same repository. Find every place a default selection is written, and say which one wins when two disagree.' },
          { k: 'followup', t: '09:26', summary: 'Narrowing: only the push side matters', text: 'Skip the pull path — the question is about what a push preselects.' },
          { k: 'running', t: null },
        ] },
      { k: 'agent', turn: 't2', id: 'c3', label: 'Audit the payload budget', role: 'Explore', model: 'claude-opus-5', mode: 'sync', status: 'completed',
        start: '09:33', end: '09:39', calls: 45, profile: '38 shell · 7 read · 0 edits', tokens: null, transcript: true,
        exchanges: [
          { k: 'brief', t: '09:33', text: 'Measure what the page reads per open, and tell me which read is the one worth removing.' },
          { k: 'report', t: '09:39', text: 'One read dominates: the tail window, at 256 KiB per child. Everything else is under a millisecond.' },
        ] },
    ],
    states: [
      { k: 'agent', id: 's1', label: 'Draft the migration notes', role: 'general-purpose', model: 'claude-opus-5[1m]', mode: 'async', status: 'completed',
        start: '11:02', end: '11:20', calls: null, tokens: null, transcript: true, open: true,
        exchanges: [ { k: 'brief', t: '11:02', text: 'Write the notes for the cutover, one paragraph per step.' }, { k: 'report', t: '11:20', text: 'Notes written. Three steps, no migration needed — the schema does not move.' } ],
        note: 'A background run the parent never collected: no call or token counts, because the parent recorded none and the child is not parsed in full.' },
      { k: 'agent', id: 's2', label: 'Check the storage names', role: 'Explore', mode: 'async', status: 'unavailable',
        start: '11:24', end: null, calls: null, transcript: false,
        exchanges: [ { k: 'brief', t: '11:24', text: 'List every place a storage name is rendered.' } ],
        note: 'The child transcript is gone from this profile, so the row can open nothing and says so.' },
      { k: 'agent', id: 's3', label: 'Re-run the parity suite', role: 'general-purpose', mode: 'async', status: 'interrupted',
        start: '11:31', end: '11:33', calls: null, transcript: true,
        exchanges: [ { k: 'brief', t: '11:31', text: 'Run the suite and report only the failures.' }, { k: 'stopped', t: '11:33', summary: 'Stopped by the parent' } ],
        note: 'The parent stopped it: the stop is its own exchange, with its clock, instead of a status word alone. Drawn only when the stop names an id this parent’s agents carry — 7 of 16 in the corpus do.' },
    ],
  },
  codex: {
    provider: 'codex', mark: 'i-codex', name: 'Codex', day: 'Tuesday, 15 September 2026',
    note: '<b>Codex.</b> Every message to a collaborator is encrypted — the spawn and the follow-ups alike — so a Codex row prints structure, not text: the send and its clock, the target path, and what the child started from (<i>inherited all turns</i>). What it can quote is the child’s own answers, as many as sit inside the tail the row already reads. The parent records every exchange, and the child’s tail carries its token total.',
    events: [
      { k: 'prompt', t: '07:00', dur: '19m', calls: 12, html: '<p>Audit the interaction code before I touch the raycast.</p>' },
      { k: 'reply', t: '07:02', html: '<p>Spawning three collaborators on the three areas, forked from this thread so they start with the context.</p>' },
      { k: 'agent', turn: 't1', id: 'x1', label: 'Goodall', task: '/root/audit_interaction', role: 'reviewer', agentType: 'explorer', fork: 'all', depth: 1, mode: 'spawn', status: 'completed',
        start: '07:02', end: '07:07', calls: null, tokens: '1.2M', transcript: true, open: true,
        exchanges: [
          { k: 'spawn', t: '07:02', note: 'No brief is readable: the spawn message is encrypted, and the child started from all of this thread’s turns.' },
          { k: 'sent', t: '07:06', summary: '/root/audit_interaction', note: 'The message to the agent is encrypted; only the send and its clock are readable.' },
          { k: 'answer', t: '07:07', text: 'Filter on the collider’s group and clear the prompt when the collider changes. Two lines, no new state.' },
        ] },
      { k: 'agent', turn: 't1', id: 'x2', label: 'Aristotle', task: '/root/audit_input', role: 'explorer', agentType: 'explorer', fork: 'all', depth: 1, mode: 'spawn', status: 'completed',
        start: '07:02', end: '07:11', calls: null, tokens: '2.6M', transcript: true,
        exchanges: [
          { k: 'spawn', t: '07:02', note: 'No brief is readable: the child started from all of this thread’s turns.' },
          { k: 'answer', t: '07:09', text: 'Input is read in two places and only one of them respects the pause state.' },
          { k: 'sent', t: '07:10', summary: '/root/audit_input', note: 'The message to the agent is encrypted; only the send and its clock are readable.' },
          { k: 'answer', t: '07:11', text: 'Keep the one on the player; the other predates the pause state and has no other caller.' },
        ] },
      { k: 'reply', t: '07:12', html: '<p>While they work: the raycast itself is one script, so whatever comes back lands in one place.</p>' },
      { k: 'agent', turn: 't1', id: 'x3', label: 'Hilbert', task: '/root/audit_physics', role: 'explorer', agentType: 'explorer', fork: '3', depth: 1, mode: 'spawn', status: 'interrupted',
        start: '07:02', end: '07:19', calls: null, tokens: '640K', transcript: true,
        exchanges: [
          { k: 'spawn', t: '07:02', note: 'No brief is readable: the child started from the last three turns of this thread.' },
          { k: 'answer', t: '07:14', text: 'The step rate is fixed, but two bodies are moved outside it.' },
          { k: 'cut', t: '07:18', summary: 'Interrupted by the parent' },
          { k: 'answer', t: '07:19', text: 'Stopping here. The two bodies are named in my transcript.' },
        ] },
    ],
    states: [
      { k: 'agent', id: 'y1', label: 'Agent', task: '/root/review_plan', role: null, agentType: 'explorer', fork: 'none', mode: 'spawn', status: 'failed',
        start: '13:40', end: '13:40', transcript: false, open: true,
        exchanges: [ { k: 'spawn', t: '13:40', note: 'The spawn was refused, so no child thread exists and the row can name no agent.' }, { k: 'stopped', t: '13:40', summary: 'Refused: agent thread limit reached' } ],
        note: 'A refused spawn: the only two things the rollout proves are the attempt and the refusal, and both are exchanges.' },
      { k: 'agent', id: 'y2', label: 'Ramanujan', task: '/root/long_scan', role: 'explorer', agentType: 'explorer', fork: 'all', mode: 'spawn', status: 'running',
        start: '13:52', end: null, tokens: '180K', transcript: true,
        exchanges: [ { k: 'spawn', t: '13:52', note: 'No brief is readable: the child started from all of this thread’s turns.' }, { k: 'answer', t: '14:04', text: 'Halfway through the tree; nothing conclusive yet.' }, { k: 'running', t: null } ],
        note: 'Still writing: the last thing it said is shown as an exchange, not as a final report it never gave.' },
      { k: 'agent', id: 'y3', label: 'Curie', task: '/root/check_paths', role: 'explorer', agentType: 'explorer', fork: 'all', mode: 'spawn', status: 'incomplete',
        start: '14:10', end: '14:12', tokens: '95K', transcript: true,
        exchanges: [ { k: 'spawn', t: '14:10', note: 'No brief is readable: the child started from all of this thread’s turns.' }, { k: 'answer', t: '14:12', text: 'Two paths resolve outside the workspace root.' } ],
        note: 'The child transcript stops mid-run and nothing is writing to it: the row shows what it has and prints <i>incomplete</i>.' },
    ],
  },
};

const NOTES = {
  a: '<b>A · Exchange list.</b> The head band stays; under it one chronological list replaces the brief-and-report pair. Every line is something the parent can prove: what it sent, what came back, what stopped it. The collapsed row gains the exchange count, so a talkative delegation is findable without opening it. Smallest change of the three — nothing moves in the timeline.',
  b: '<b>B · Agent lane.</b> The delegation opens a lane on the rail and its exchanges take their own places among the parent’s events, at their own clocks. Overlap and interleaving become visible — you can see the parent working while a child is still out. The cost is the timeline model: child events now sort into the parent’s list.',
  c: '<b>C · Roster card.</b> Delegations whose spans overlap collapse into one card with a span bar each, drawn to scale. A burst reads as one act with three workers instead of three unrelated rows. The key is overlap, not the record’s shape — Claude never puts two in one message but launches them seconds apart, in bursts that reach fifteen. It needs A underneath it: opening a name gives A’s pane.',
};

/* ───────── pieces ───────── */
const STATUS_LABEL = { completed: 'completed', running: 'running', failed: 'failed', interrupted: 'interrupted', incomplete: 'incomplete', unavailable: 'no transcript' };

function md(text) {
  let out = '', para = [], list = false;
  const flush = () => { if (para.length) { out += `<p>${esc(para.join(' '))}</p>`; para = []; } };
  const close = () => { if (list) { out += '</ul>'; list = false; } };
  for (const l of String(text).split('\n')) {
    if (!l.trim()) { flush(); close(); }
    else if (/^- /.test(l)) { flush(); if (!list) { out += '<ul>'; list = true; } out += `<li>${esc(l.slice(2))}</li>`; }
    else { close(); para.push(l.trim()); }
  }
  flush(); close();
  return out;
}

function facts(a) {
  const f = [];
  if (a.role) f.push(`<span>${I('i-fork')}${a.role}</span>`);
  if (a.agentType && a.agentType !== a.role) f.push(`<span>${a.agentType}</span>`);
  if (a.model) f.push(`<span>${a.model}</span>`);
  f.push(`<span>${a.mode}</span>`);
  if (a.fork) f.push(`<span>inherited ${a.fork === 'all' ? 'all turns' : a.fork === 'none' ? 'no turns' : a.fork + ' turns'}</span>`);
  if (a.depth) f.push(`<span>depth ${a.depth}</span>`);
  f.push(`<span>${I('i-clock')}${a.start} → ${a.end ?? '…'}${a.end ? ` · ${span(a.start, a.end)}` : ''}</span>`);
  if (a.calls != null) f.push(`<span>${a.calls} calls</span>`);
  if (a.profile) f.push(`<span>${a.profile}</span>`);
  /* Named, not bare: the child's own running total, which is not the same
     thing as the context the last request carried. */
  if (a.tokens) f.push(`<span title="The child thread's own running total, as its rollout records it.">${a.tokens} tokens billed</span>`);
  return `<div class="session-detail-agent-facts">${f.join('')}</div>`;
}

function verb(a) {
  return `<button type="button" class="btn session-detail-agent-open" ${a.transcript ? '' : 'disabled'} title="${a.transcript ? 'Open this agent’s transcript as its own page' : 'No transcript is available for this agent.'}">${I('i-ext')}Open transcript</button>`;
}

function exchangeList(a) {
  const items = a.exchanges.map((e) => {
    const meta = EX[e.k];
    const head = `<div class="ag-ex-head"><span class="ag-ex-kind">${meta.kind}</span>${e.t ? `<span class="ag-ex-clock">${e.t}</span>` : ''}${e.summary ? `<span class="ag-ex-summary">${esc(e.summary)}</span>` : ''}</div>`;
    const body = e.text ? `<div class="ag-ex-body">${md(e.text)}</div>` : '';
    const note = e.note ? `<p class="ag-ex-note">${e.note}</p>` : '';
    return `<li class="${meta.cls}"><span class="ag-ex-mark">${meta.glyph}</span>${head}${body}${note}</li>`;
  }).join('');
  return `<ol class="ag-ex">${items}</ol>`;
}

function paneA(a) {
  return `<div class="session-detail-tool-payload">
    <div class="session-detail-agent-head">${facts(a)}${verb(a)}</div>
    ${exchangeList(a)}
    ${a.note ? `<p class="session-detail-agent-note">${a.note}</p>` : ''}
  </div>`;
}

function agentRow(a, dir) {
  const meta = [];
  /* Only a delegation that was actually talked to earns the chip: a plain
     brief-and-report row is the one-shot the row already reads as. */
  const talk = a.exchanges.filter((e) => e.k !== 'running').length;
  if (talk > 2) meta.push(`<span class="ag-count">${talk} exchanges</span>`);
  if (a.calls != null) meta.push(`<span>${a.calls} calls</span>`);
  meta.push(`<span class="session-detail-agent-length">${a.end ? span(a.start, a.end) : '…'}</span>`);
  return `<li class="session-detail-row-agent" data-kind="agent" id="row-${a.id}">
    <article class="session-detail-event event-agent-call agent-${a.status}">
      <span class="session-detail-event-node" role="img" aria-label="Agent · ${esc(a.label)} · ${a.start}">${I('i-fork')}</span>
      <div class="session-detail-event-body">
        <details class="session-detail-tool-call session-detail-agent status-${a.status}" ${a.open ? 'open' : ''}>
          <summary>
            <span class="session-detail-tool-name session-detail-agent-stamp">Agent</span>
            <span class="session-detail-agent-label" title="${esc(a.label)}">${esc(a.label)}</span>
            ${a.task ? `<span class="session-detail-agent-task">${a.task}</span>` : ''}
            ${a.role ? `<span class="session-detail-agent-pill">${a.role}</span>` : ''}
            ${a.mode !== 'sync' ? `<span class="session-detail-agent-pill mode">${a.mode}</span>` : ''}
            <span class="session-detail-agent-end">
              <span class="session-detail-agent-meta">${meta.join('')}</span>
              ${a.status !== 'completed' ? `<span class="session-detail-agent-status status-${a.status}">${STATUS_LABEL[a.status]}</span>` : ''}
              <span class="session-detail-tool-chevron" aria-hidden="true">${I(a.open ? 'i-chevd' : 'i-chevr')}</span>
            </span>
          </summary>
          <div class="session-detail-tool-body">${dir === 'b' ? paneBBody(a) : paneA(a)}</div>
        </details>
      </div>
    </article>
  </li>`;
}

/* B keeps the head band in the row and moves the exchanges onto the rail. */
function paneBBody(a) {
  return `<div class="session-detail-tool-payload"><div class="session-detail-agent-head">${facts(a)}${verb(a)}</div>${a.note ? `<p class="session-detail-agent-note">${a.note}</p>` : ''}</div>`;
}

function laneNodes(a) {
  return a.exchanges.filter((e) => e.t).map((e) => {
    const meta = EX[e.k];
    const who = meta.cls === 'back' ? a.label : 'you → ' + a.label;
    const text = e.summary || e.text || e.note || meta.kind;
    return `<li data-kind="lane" data-t="${e.t}"><div class="ag-lane-node ${meta.cls}">
      <span class="ag-lane-tile">${meta.glyph}</span>
      <div class="ag-lane-line"><span class="ag-lane-who">${esc(who)}</span><span class="ag-lane-text">${esc(String(text).split('\n')[0])}</span><span class="ag-lane-clock">${e.t}</span></div>
    </div></li>`;
  }).join('');
}

function rosterCard(group) {
  const starts = group.map((a) => mins(a.start));
  const ends = group.map((a) => mins(a.end ?? a.start) + (a.end ? 0 : 6));
  const lo = Math.min(...starts), hi = Math.max(...ends), width = Math.max(1, hi - lo);
  const rows = group.map((a) => {
    const left = ((mins(a.start) - lo) / width) * 100;
    const w = Math.max(3, (((a.end ? mins(a.end) : hi) - mins(a.start)) / width) * 100);
    const meta = a.end ? span(a.start, a.end) : '…';
    return `<li><div class="ag-roster-row agent-${a.status}">
      <span class="ag-roster-who">${I('i-fork')}<span class="ag-roster-name">${esc(a.label)}</span>${a.role ? `<span class="ag-roster-role">${a.role}</span>` : ''}</span>
      <span class="ag-roster-track" role="img" aria-label="${a.start} to ${a.end ?? 'now'}"><span class="ag-roster-bar" style="left:${left}%;width:${w}%"></span></span>
      <span class="ag-roster-meta">${a.exchanges.filter((e) => e.k !== 'running').length} exch · ${meta}</span>
      ${a.status !== 'completed' ? `<span class="session-detail-agent-status status-${a.status}">${STATUS_LABEL[a.status]}</span>` : ''}
    </div></li>`;
  }).join('');
  const last = group.reduce((acc, a) => (a.end && mins(a.end) > mins(acc) ? a.end : acc), group[0].start);
  return `<li class="session-detail-row-agent" data-kind="agent">
    <article class="session-detail-event event-agent-call agent-completed">
      <span class="session-detail-event-node" role="img" aria-label="Agents">${I('i-fork')}</span>
      <div class="session-detail-event-body">
        <div class="ag-roster">
          <div class="ag-roster-head"><span class="ag-roster-title">${group.length} agents at once</span><span class="ag-roster-span">${group[0].start} → ${last}</span></div>
          <ol class="ag-roster-list">${rows}</ol>
        </div>
      </div>
    </article>
  </li>`;
}

function card(kind, sample, e) {
  const node = kind === 'prompt' ? I('i-user') : I(sample.mark);
  const head = kind === 'prompt'
    ? `<time>${e.t}</time>${e.dur ? `<span>${e.dur}</span>` : ''}${e.calls ? `<span>${e.calls} calls</span>` : ''}`
    : `<time>${e.t}</time>`;
  return `<li data-kind="${kind}" data-t="${e.t}"><article class="session-detail-event event-${kind === 'prompt' ? 'prompt' : 'response'}"><span class="session-detail-event-node" role="img" aria-label="${kind === 'prompt' ? 'You' : sample.name} · ${e.t}">${node}</span><div class="session-detail-event-body"><div class="session-detail-card session-detail-card-${kind === 'prompt' ? 'prompt' : 'reply'}"><div class="session-detail-card-head">${head}</div><div class="session-detail-event-copy">${e.html}</div></div></div></article></li>`;
}

/* ───────── page ───────── */
function render() {
  const sample = SAMPLES[document.documentElement.dataset.sample];
  const dir = document.documentElement.dataset.dir;
  const scene = document.documentElement.dataset.scene;
  const events = scene === 'states' ? sample.states : sample.events;
  let list = '';
  if (scene === 'main' && dir === 'c') {
    const done = new Set();
    list = events.map((e) => {
      if (e.k !== 'agent') return card(e.k, sample, e);
      if (done.has(e.turn)) return '';
      const group = events.filter((o) => o.k === 'agent' && o.turn === e.turn);
      done.add(e.turn);
      return group.length > 1 ? rosterCard(group) : agentRow(e, 'a');
    }).join('');
  } else if (scene === 'main' && dir === 'b') {
    /* Exchanges sort into the parent's own list, by clock. */
    const rows = [];
    events.forEach((e) => {
      if (e.k !== 'agent') { rows.push({ t: e.t, html: card(e.k, sample, e) }); return; }
      rows.push({ t: e.start, html: agentRow(e, 'b') });
      e.exchanges.filter((x) => x.t && x.k !== 'brief' && x.k !== 'spawn').forEach((x) => {
        rows.push({ t: x.t, html: laneNodes({ ...e, exchanges: [x] }) });
      });
    });
    list = rows.sort((p, q) => mins(p.t) - mins(q.t)).map((r) => r.html).join('');
  } else {
    list = events.map((e) => (e.k === 'agent' ? agentRow(e, dir === 'b' ? 'a' : dir) : card(e.k, sample, e))).join('');
  }
  document.getElementById('page').innerHTML =
    `<div class="session-detail-layout"><div class="session-detail-timeline"><section class="session-detail-day"><h2 class="session-detail-day-divider"><span>${sample.day}</span></h2><ol class="session-detail-event-list ${dir === 'b' ? 'ag-lane' : ''}">${list}</ol></section></div></div>`;
  const sceneNote = scene === 'states'
    ? '<b>Degraded rows.</b> These are the common rows, not edge cases: a background run the parent never collected, a missing transcript, a stop, a refused spawn, a run still writing. Each one says in words what it could not read, and never leaves an empty chip where a fact should be.'
    : NOTES[dir];
  document.getElementById('note').innerHTML = `<p>${sceneNote}</p><p>${sample.note}</p>`;
  document.querySelectorAll('.spec-btn[data-dir]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
  document.querySelectorAll('.spec-btn[data-sample]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sample === document.documentElement.dataset.sample)));
  document.querySelectorAll('.spec-btn[data-scene]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === scene)));
  document.querySelectorAll('.session-detail-agent').forEach((d) => d.addEventListener('toggle', () => {
    d.querySelector('.session-detail-tool-chevron').innerHTML = I(d.open ? 'i-chevd' : 'i-chevr');
  }));
}
document.querySelectorAll('.spec-btn[data-dir]').forEach((b) => b.addEventListener('click', () => { document.documentElement.dataset.dir = b.dataset.dir; render(); }));
document.querySelectorAll('.spec-btn[data-sample]').forEach((b) => b.addEventListener('click', () => { document.documentElement.dataset.sample = b.dataset.sample; render(); }));
document.querySelectorAll('.spec-btn[data-scene]').forEach((b) => b.addEventListener('click', () => { document.documentElement.dataset.scene = b.dataset.scene; render(); }));
document.getElementById('width').addEventListener('click', (e) => { const h = document.documentElement; const narrow = h.dataset.width !== 'narrow'; h.dataset.width = narrow ? 'narrow' : 'wide'; e.target.textContent = narrow ? 'Wide' : 'Narrow'; e.target.setAttribute('aria-pressed', String(narrow)); });
document.getElementById('theme').addEventListener('click', (e) => { const h = document.documentElement; const dark = h.dataset.theme !== 'dark'; h.dataset.theme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Light' : 'Dark'; });
/* ?dir=a|b|c&sample=claude|codex&scene=main|states&theme=dark&width=narrow — so a
   headless shot can address one scene without clicking. */
new URLSearchParams(location.search).forEach((value, key) => {
  if (['dir', 'sample', 'scene', 'theme', 'width'].includes(key)) document.documentElement.dataset[key] = value;
});
render();
</script>
</body>
</html>
