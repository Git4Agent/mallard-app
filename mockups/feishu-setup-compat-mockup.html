<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage setup lanes — R2, Dropbox, Feishu</title>
    <style>
      /* App.css locks html, body, #root and .sync-app at overflow: hidden
         for the app shell; here #root is the one scroller. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }
      .compat-specimen { padding: 16px; display: grid; gap: 28px; }
      .compat-scene-title { margin: 0 0 8px; font: 700 15px/1.3 system-ui; color: var(--text-0); }
      .compat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 16px; align-items: start; }
      .compat-col-title { margin: 0 0 6px; font: 600 12px/1.3 system-ui; color: var(--text-2); }
      .compat-col .sync-main { height: auto !important; overflow: visible !important; padding: 0 !important; }
    </style>
  </head>
  <body class="sync-app">
    <div id="root"></div>
    <script type="module" src="/mockups/feishu-setup-compat-mockup.tsx"></script>
  </body>
</html>
