<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet · Skill · Plugin marks — live specimen</title>
    <style>
      /* Page chrome only. Everything inside .specimen-surface is the shipped skin. */
      /* App.css pins html/body/#root to 100% with overflow hidden for the Tauri
         shell; a specimen is a document and needs to scroll. Vite injects the
         imported stylesheet after this block, so these out-specify it rather
         than merely follow it. */
      html:root { height: auto; overflow: visible; }
      :root > body { height: auto; min-height: 100%; overflow: visible; }
      body > #root { height: auto; overflow: visible; }
      body { margin: 0; background: var(--bg-0, #14110d); color: var(--text-1, #ccc); }
      .specimen-page { padding: 28px 32px 96px; display: flex; flex-direction: column; gap: 38px;
        font-family: var(--font, system-ui); }
      .specimen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
        border-bottom: 1px solid var(--border, #333); padding-bottom: 18px; }
      .specimen-head h1 { margin: 0 0 6px; font-size: 20px; color: var(--text-0); }
      .specimen-head p { margin: 0 0 6px; font-size: 13px; color: var(--text-2); max-width: 72ch; line-height: 1.55; }
      .specimen-controls { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
      section > h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
        color: var(--text-2); font-weight: 400; }
      .specimen-lead { margin: 0 0 16px; font-size: 13px; color: var(--text-2); max-width: 78ch; line-height: 1.55; }
      .specimen-lead code, .specimen-note code { font-family: var(--font-mono); font-size: 12px; color: var(--text-1); }

      .specimen-concept { border-top: 1px solid var(--border); padding-top: 22px; }
      .specimen-concept > h3 { margin: 0 0 2px; font-size: 15px; color: var(--text-0); }
      .specimen-concept > p { margin: 0 0 18px; font-size: 12.5px; color: var(--text-2); max-width: 78ch; line-height: 1.55; }

      .specimen-grid { display: flex; flex-wrap: wrap; gap: 18px; }
      .specimen-card { flex: 1 1 300px; min-width: 290px; max-width: 380px; border: 1px solid var(--border);
        border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
        background: var(--surface-row, transparent); }
      .specimen-card.is-chosen { border-color: var(--text-2, #999); }
      .specimen-card.is-chosen .specimen-card-head em { color: var(--text-0); }
      .specimen-card.is-current { border-color: var(--border-mid, #555); opacity: 0.85; }
      .specimen-card-head { display: flex; align-items: baseline; gap: 8px; }
      .specimen-card-head b { color: var(--text-0); font-size: 13px; }
      .specimen-card-head em { color: var(--text-3); font-size: 11px; font-style: normal; }
      .specimen-card-blurb { margin: 0; font-size: 11.5px; color: var(--text-2); line-height: 1.5; }
      .specimen-card-cite { margin: 0; font-size: 11px; color: var(--text-3); line-height: 1.5; }

      .specimen-shape-marks { display: flex; align-items: center; gap: 16px; color: var(--text-2); }
      .specimen-big { padding: 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-1);
        /* One line per grid cell, so an off-grid stem is visible rather than argued about. */
        background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px),
                          linear-gradient(to bottom, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px);
        background-size: 6px 6px; background-position: 6px 6px; }

      .specimen-strip { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 6px; color: var(--text-2); }
      .specimen-strip > span { display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
        font-size: 10px; color: var(--text-3); }
      .specimen-strip mark { background: none; color: var(--text-0); }

      .specimen-surface { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
        background: var(--surface-row, transparent); }
      .specimen-surface + .specimen-surface { margin-top: 10px; }
      .specimen-surface-label { display: block; margin-bottom: 6px; font-size: 11px; color: var(--text-3); }

      .specimen-paths { display: flex; flex-direction: column; gap: 12px; font-size: 11.5px; }
      .specimen-paths b { display: block; margin-bottom: 3px; color: var(--text-0); font-size: 12px; }
      .specimen-paths code { display: block; max-width: 100%; overflow-x: auto; padding: 7px 9px;
        border: 1px solid var(--border); border-radius: 4px; color: var(--text-2);
        font-family: var(--font-mono); white-space: pre; }
      .specimen-measure { display: flex; flex-direction: column; gap: 5px; padding: 8px 9px;
        border: 1px solid var(--border); border-radius: 5px; }
      .specimen-measure-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono); }
      .specimen-measure-row b { color: var(--text-1); }
      .specimen-measure > p { margin: 0; font-size: 11px; color: var(--text-2); line-height: 1.5; }
      .specimen-verdict { padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border-mid, #555);
        font-family: var(--font); font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; }
      .specimen-verdict.is-ok { color: var(--text-1); }
      .specimen-verdict.is-risk { color: var(--warning-text, #d9a441); border-color: var(--warning-text, #d9a441); }

      .specimen-note { font-size: 12px; color: var(--text-2); line-height: 1.6; max-width: 78ch; }
      .specimen-note b { color: var(--text-0); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kind-icon-options.tsx"></script>
  </body>
</html>
