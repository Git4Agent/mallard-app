<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>From Mallard Cloud — an existing folder</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1560px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-group select { padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-h2 { margin: 10px 0 -8px; font: 700 16px/1.3 system-ui; }
      .spec-h2 small { margin-left: 8px; color: var(--text-2); font-weight: 600; font-size: 12px; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel ul { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel table { border-collapse: collapse; margin-top: 6px; }
      .spec-panel th, .spec-panel td { padding: 3px 14px 3px 0; text-align: left; vertical-align: top; }
      .spec-panel th { color: var(--text-2); font-weight: 600; }
      .spec-panel code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(640px, 1fr)); gap: 22px; align-items: start; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title small { margin-right: 6px; color: var(--text-3); font-weight: 600; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; max-width: 780px; }
      /* The frame restores the app body's type, which .spec overrides. */
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); font-size: var(--type-md); font-weight: var(--weight-regular); line-height: 1.35; }
      .spec-frame .sync-main { height: auto !important; overflow: visible !important; }

      /* ——— proposed app CSS: one rule ————————————————————————————— */
      /* The New folder / Existing folder switch heads the Folder field, seated
         at its start like the Sessions/Files switch, not stretched across. */
      .sync-project-folder-field > .sync-segmented { align-self: flex-start; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cloud-project-existing-mockup.tsx"></script>
  </body>
</html>
