<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add project — directions</title>
    <style>
      /* App.css locks html, body and #root at overflow: hidden for the app
         shell; here #root is the one scroller. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .pa-spec { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .pa-spec h1.pa-title { font: 700 20px/1.2 system-ui; }
      .pa-spec h2.pa-h2 { font: 700 15px/1.3 system-ui; margin: 8px 0 2px; }
      .pa-controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); position: sticky; top: 0; z-index: 40; }
      .pa-group { display: flex; gap: 4px; align-items: center; }
      .pa-group > span { color: var(--text-2); font-weight: 600; margin-right: 4px; }
      .pa-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .pa-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .pa-seg:disabled { opacity: .4; cursor: default; }
      .pa-card { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); display: grid; gap: 6px; }
      .pa-card dl { display: grid; grid-template-columns: 130px 1fr; gap: 3px 12px; }
      .pa-card dt { color: var(--text-2); font-weight: 600; }
      .pa-card code, .pa-spec p code, .pa-spec li code { font: 12px/1.3 ui-monospace, monospace; padding: 0 3px; border-radius: 4px; background: var(--chip-bg); }
      .pa-card .pa-flow { font-weight: 600; }
      .pa-try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .pa-try > span { color: var(--text-2); font-weight: 600; }
      .pa-try button { padding: 3px 8px; border: 1px dashed var(--border-strong); border-radius: 6px; background: transparent; color: var(--text-1); font: 12px/1.3 ui-monospace, monospace; cursor: pointer; }
      .pa-try button.act { font-family: system-ui; font-weight: 600; border-style: solid; }
      .pa-frame { height: 700px; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; position: relative; }
      .pa-frame > .sync-app { height: 100%; }
      .pa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
      .pa-cell { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); display: grid; gap: 6px; align-content: start; }
      .pa-cell > h3 { font: 600 12px/1.3 system-ui; color: var(--text-2); }
      .pa-cell > p.pa-why { color: var(--text-3); font-size: 12px; }
      .pa-notes { display: grid; gap: 4px; padding-left: 18px; }

      /* ——— new app CSS the directions would ship ——————————————— */
      /* A: the sheet sits in the frame instead of the top layer, so the
         specimen can show several frames; the real one is a <dialog>. */
      .pa-backdrop { position: absolute; inset: 0; z-index: 19; backdrop-filter: blur(8px); background: rgb(0 0 0 / 0.1); }
      dialog.pa-add-dialog { position: absolute; inset: 0; z-index: 20; margin: auto; height: fit-content; width: min(580px, 100% - 48px); }
      .pa-add-dialog .sync-modal-body { padding: 14px 18px 16px; display: grid; gap: 12px; }
      .pa-add-dialog .sync-modal-footer > span kbd { font: inherit; padding: 0 4px; border: 1px solid var(--border); border-radius: 4px; }

      /* The folder field: the profile path row's grammar, one level up. */
      .pa-field { position: relative; display: grid; gap: 4px; max-width: var(--sync-setup-column); }
      .pa-dialog-field { max-width: none; }
      .pa-field > .pa-field-label { color: var(--text-1); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
      .pa-field .sync-profile-select-row input { height: 32px; padding: 0 10px; font-family: var(--font-mono); font-size: var(--type-xs); border: 1px solid var(--control-border); }
      .pa-field .sync-profile-select-row input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--red) 52%, var(--control-border)); }
      .pa-field .sync-setup-path-hint { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
      .pa-field .sync-setup-path-hint code { margin-left: 0; }
      .pa-field .sync-setup-path-hint .btn-link { font-size: var(--type-2xs); font-weight: var(--weight-semibold); color: var(--text-0); text-decoration: underline; text-underline-offset: 2px; }

      /* D: completion under the field, the popover grammar. */
      .pa-complete { position: absolute; z-index: 30; top: calc(var(--pa-label, 0px) + 34px); left: 0; right: 90px; margin: 0; padding: 4px; list-style: none; border: var(--box-border); border-radius: var(--r-sm); background: var(--surface-popover); box-shadow: var(--shadow-popover); }
      .pa-complete li button { width: 100%; padding: 4px 8px; display: flex; align-items: center; gap: 7px; border: 0; border-radius: 6px; background: transparent; color: var(--text-1); font: var(--type-xs)/1.4 var(--font-mono); text-align: left; cursor: pointer; }
      .pa-complete li button.active, .pa-complete li button:hover { background: var(--surface-row-hover); color: var(--text-0); }
      .pa-complete li button small { margin-left: auto; color: var(--text-3); font-family: var(--font); font-size: var(--type-3xs); }
      .pa-complete .pa-complete-foot { padding: 4px 8px 2px; color: var(--text-3); font: var(--type-3xs)/1.4 var(--font); }

      /* C: folders the agents have worked in, the storage chooser's rows. */
      .pa-suggest { display: grid; gap: 6px; }
      .pa-suggest-head { display: flex; align-items: baseline; gap: 8px; color: var(--text-1); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
      .pa-suggest-head small { color: var(--text-3); font-weight: var(--weight-regular); }
      .pa-suggest .sync-storage-link-list { max-height: 262px; overflow-y: auto; }
      .pa-suggest .sync-storage-index-row { min-height: 46px; grid-template-columns: 26px minmax(0, 1fr) auto auto 18px; }
      .pa-suggest .pa-row-marks { display: inline-flex; gap: 4px; align-items: center; }
      .pa-suggest .sync-storage-index-copy small .pa-facts { font-family: var(--font); }
      .pa-suggest-state { min-height: 46px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; border: 1px dashed var(--border); color: var(--text-2); font-size: var(--type-xs); }
      .pa-form-suggest { max-width: var(--sync-setup-column); }

      /* B: the bands wait for a folder. */
      .pa-waiting { opacity: .42; }

      /* E: a folder held over the window. */
      .pa-drop { position: absolute; inset: 10px; z-index: 25; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: var(--retro-panel-radius); background: color-mix(in srgb, var(--bg-0) 82%, transparent); color: var(--text-0); font: var(--weight-semibold) var(--type-md)/1.3 var(--font); }
      .pa-drop span { display: flex; gap: 8px; align-items: center; }

      /* The system dialog, drawn foreign on purpose. */
      .pa-os { position: absolute; z-index: 50; left: 50%; top: 70px; transform: translateX(-50%); width: 560px; border-radius: 10px; background: #ececec; color: #1d1d1f; box-shadow: 0 18px 50px rgb(0 0 0 / .35); font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
      .pa-os-bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #dcdcdc; border-bottom: 1px solid #c8c8c8; }
      .pa-os-bar .dots { display: flex; gap: 6px; } .pa-os-bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .pa-os-bar .dots i:nth-child(2) { background: #febc2e; } .pa-os-bar .dots i:nth-child(3) { background: #28c840; }
      .pa-os-bar strong { margin: 0 auto; font-weight: 600; }
      .pa-os-crumb { padding: 6px 12px; border-bottom: 1px solid #d0d0d0; color: #555; font-size: 12px; }
      .pa-os ul { list-style: none; margin: 0; padding: 4px 0; max-height: 220px; overflow: auto; background: #fff; }
      .pa-os li button { width: 100%; padding: 4px 14px; border: 0; background: transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; }
      .pa-os li button.sel { background: #0a64d8; color: #fff; }
      .pa-os li button:disabled { color: #aaa; cursor: default; }
      .pa-os-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #d0d0d0; }
      .pa-os button { color: #1d1d1f; }
      .pa-os-foot button { padding: 4px 14px; border: 1px solid #b8b8b8; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
      .pa-os-foot button.primary { background: #0a64d8; border-color: #0a64d8; color: #fff; }
      .pa-os li button.sel { color: #fff; }
      .pa-os.gtk { border-radius: 8px; background: #f6f5f4; }
      .pa-os.gtk .pa-os-bar { background: #ebebeb; justify-content: space-between; }
      .pa-os.gtk .pa-os-bar strong { margin: 0; }
      .pa-os.gtk .pa-os-bar button { padding: 3px 12px; border: 1px solid #cdc7c2; border-radius: 5px; background: #fff; font: inherit; cursor: pointer; }
      .pa-os.gtk .pa-os-bar button.primary { background: #3584e4; border-color: #3584e4; color: #fff; }
      .pa-os-crumb .btn-link { color: #555; }
      .pa-os.gtk li button.sel { background: #3584e4; }
      .pa-os-label { position: absolute; z-index: 51; left: 50%; top: 44px; transform: translateX(-50%); padding: 2px 8px; border-radius: 6px; background: #1d1d1f; color: #fff; font: 600 11px/1.4 system-ui; white-space: nowrap; }
      .pa-placeholder { margin: 60px auto; max-width: 420px; text-align: center; color: var(--text-2); }
      .pa-placeholder strong { display: block; margin-bottom: 6px; color: var(--text-0); font-size: var(--type-md); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/project-add-mockup.tsx"></script>
  </body>
</html>
