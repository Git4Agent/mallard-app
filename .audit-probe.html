<title>computed-style probe</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --color-scheme: dark;
  --bg-0: #151515;
  --bg-1: #242424;
  --bg-2: #2f2f2f;
  --bg-3: #383838;
  --bg-4: #1c1c1c;
  --bg-hover: rgba(255, 255, 255, 0.055);
  --bg-active: rgba(255, 255, 255, 0.095);
  --border: rgba(255, 255, 255, 0.075);
  --border-mid: rgba(255, 255, 255, 0.16);
  --border-strong: rgba(255, 255, 255, 0.24);
  --button-bg: #202020;
  --button-bg-hover: #292929;
  --button-bg-active: #303030;
  --button-border: rgba(255, 255, 255, 0.14);
  --button-primary-bg: #343434;
  --button-primary-hover: #3d3d3d;
  --button-primary-border: rgba(255, 255, 255, 0.18);
  --button-disabled-opacity: 0.38;
  --button-radius: 8px;
  --app-shell: #101010;
  --surface-card: #181818;
  --surface-row: #191919;
  --surface-row-hover: #1c1c1c;
  --surface-row-active: #1a1a1a;
  --surface-popover: #1d1d1d;
  --surface-footer: #171717;
  --surface-subtle: rgba(255, 255, 255, 0.025);
  --surface-subtle-hover: rgba(255, 255, 255, 0.035);
  --surface-overlay: rgba(28, 28, 28, 0.96);
  --surface-muted: rgba(0, 0, 0, 0.12);
  --chip-bg: rgba(255, 255, 255, 0.05);
  --chip-strong-bg: rgba(255, 255, 255, 0.08);
  --loader-track: rgba(255, 255, 255, 0.18);
  --danger-soft: rgba(248, 113, 113, 0.09);
  --warning-soft: rgba(251, 191, 36, 0.09);
  --accent-soft: rgba(134, 189, 251, 0.08);
  --accent-contrast: #10233c;
  --switch-off: #4a4a4a;
  --switch-thumb: #ffffff;
  --editor-active-line: rgba(255, 255, 255, 0.035);
  --text-0: #ededed;
  --text-1: #c6c6c6;
  --text-2: #898989;
  --text-3: #616161;
  --accent: #86bdfb;
  --accent-glow: rgba(134, 189, 251, 0.16);
  --primary: #f3f3f3;
  --primary-text: #0d0d0d;
  --green: #4ade80;
  --red: #f87171;
  /* Error sentences, as opposed to error glyphs: prose must clear 4.5:1 where
     a 3:1 graphic can ride the brighter signal red. Resolved against the
     active palette's --red by default; a palette overrides it where its red
     reads too light for body text. */
  --danger-text: var(--red);
  --yellow: #fbbf24;
  --blue: #86bdfb;
  --purple: #a78bfa;
  --thread-status-synced: #31ae6b;
  --thread-status-cloud: #397dcc;
  --thread-status-local: #16a7c9;
  --thread-status-divergent: #7655d6;
  --thread-status-pending: #e59b1b;
  --thread-status-conflict: #e44649;
  --thread-status-unavailable: #85878e;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Cascadia Code', 'Consolas', monospace;
  --r-lg: 22px;
  --r: 14px;
  --r-sm: 8px;
  --r-pill: 999px;
  --shadow-card: 0 18px 54px rgba(0, 0, 0, 0.28);
  --shadow-overlay: 0 12px 36px rgba(0, 0, 0, 0.34);
  --shadow-popover: 0 8px 30px rgba(0, 0, 0, 0.45);
  --z-log: 20;
}

:root[data-theme="light"] {
  --color-scheme: light;
  --bg-0: #f6f7f8;
  --bg-1: #eef0f2;
  --bg-2: #e4e7ea;
  --bg-3: #d9dde1;
  --bg-4: #ffffff;
  --bg-hover: rgba(24, 32, 44, 0.05);
  --bg-active: rgba(24, 32, 44, 0.09);
  --border: rgba(24, 32, 44, 0.09);
  --border-mid: rgba(24, 32, 44, 0.16);
  --border-strong: rgba(24, 32, 44, 0.25);
  --button-bg: #ffffff;
  --button-bg-hover: #f0f2f4;
  --button-bg-active: #e7eaed;
  --button-border: rgba(24, 32, 44, 0.16);
  --button-primary-bg: #e5e8eb;
  --button-primary-hover: #dce0e4;
  --button-primary-border: rgba(24, 32, 44, 0.2);
  --app-shell: #e9ecef;
  --surface-card: #ffffff;
  --surface-row: #fbfcfd;
  --surface-row-hover: #f2f4f6;
  --surface-row-active: #edf4fc;
  --surface-popover: #ffffff;
  --surface-footer: #f7f8fa;
  --surface-subtle: rgba(24, 32, 44, 0.025);
  --surface-subtle-hover: rgba(24, 32, 44, 0.045);
  --surface-overlay: rgba(255, 255, 255, 0.96);
  --surface-muted: rgba(24, 32, 44, 0.035);
  --chip-bg: rgba(24, 32, 44, 0.055);
  --chip-strong-bg: rgba(24, 32, 44, 0.085);
  --loader-track: rgba(24, 32, 44, 0.2);
  --danger-soft: rgba(209, 36, 47, 0.08);
  --warning-soft: rgba(154, 103, 0, 0.09);
  --accent-soft: rgba(57, 125, 204, 0.09);
  --accent-contrast: #ffffff;
  --switch-off: #aab0b8;
  --switch-thumb: #ffffff;
  --editor-active-line: rgba(24, 32, 44, 0.045);
  --text-0: #20242a;
  --text-1: #434a54;
  --text-2: #6d7580;
  --text-3: #9198a1;
  --accent: #397dcc;
  --accent-glow: rgba(57, 125, 204, 0.14);
  --primary: #252a31;
  --primary-text: #ffffff;
  --green: #238636;
  --red: #d1242f;
  --yellow: #9a6700;
  --blue: #397dcc;
  --purple: #7c3aed;
  --shadow-card: 0 14px 38px rgba(24, 32, 44, 0.1);
  --shadow-overlay: 0 12px 34px rgba(24, 32, 44, 0.14);
  --shadow-popover: 0 8px 24px rgba(24, 32, 44, 0.15);
}

html, body, #root {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg-0);
  color: var(--text-0);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  color-scheme: var(--color-scheme);
}

body,
.app,
.app-sidebar,
.sync-panel {
  transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
}

button,
input,
summary {
  touch-action: manipulation;
}

button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Layout ─────────────────────────────────────── */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--app-shell);
}

.app.resizing-sidebar,
.app.resizing-sidebar *,
.sync-app.resizing-sidebar,
.sync-app.resizing-sidebar * {
  cursor: col-resize !important;
  user-select: none;
}

.app.resizing-log,
.app.resizing-log *,
.sync-workspace.resizing-log,
.sync-workspace.resizing-log * {
  cursor: row-resize !important;
  user-select: none;
}

.app.resizing-log .log-drawer,
.sync-workspace.resizing-log .log-drawer {
  transition: none;
}

.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

.app-workspace {
  position: relative;
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.workspace-titlebar-drag-region {
  display: none;
}

.app.macos-titlebar-overlay .workspace-titlebar-drag-region {
  display: block;
  position: absolute;
  top: 0;
  right: 8px;
  left: 0;
  height: 30px;
  z-index: 5;
  user-select: none;
}

/* The file header occupies the titlebar strip; keep its real controls above
   the invisible drag layer while the breadcrumb/empty space remains draggable. */
.app.macos-titlebar-overlay .file-preview-header .editor-actions {
  position: relative;
  z-index: 6;
}

.sidebar-titlebar-drag-region {
  display: none;
}

.app.macos-titlebar-overlay .sidebar-titlebar-drag-region {
  display: block;
  height: 30px;
  flex-shrink: 0;
  user-select: none;
  background: var(--bg-1);
}

.app-sidebar {
  width: 320px;
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg-1);
  border-right: 1px solid var(--border-mid);
}

.sidebar-resizer {
  width: 7px;
  margin-left: -4px;
  margin-right: -3px;
  flex-shrink: 0;
  position: relative;
  z-index: 4;
  cursor: col-resize;
  touch-action: none;
}

.sidebar-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 1px;
  background: transparent;
  transition: background 0.12s ease;
}

.sidebar-resizer:hover::after,
.sidebar-resizer:active::after {
  background: var(--border-strong);
}

.sidebar-chrome {
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-mid);
}

.sidebar-title-row {
  min-height: 50px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 0;
}

.sidebar-product-logo {
  width: 25px;
  height: 25px;
  flex: 0 0 auto;
  border-radius: 7px;
  object-fit: contain;
}

.sidebar-product-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-0);
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 4px 8px 10px;
  flex-shrink: 0;
}

.sidebar-nav-item {
  width: 100%;
  min-height: 34px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-1);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}

.sidebar-nav-item svg {
  color: var(--text-2);
  flex-shrink: 0;
}

.sidebar-nav-item:hover,
.sidebar-nav-item.active {
  background: var(--bg-active);
  color: var(--text-0);
}

.sidebar-nav-item:hover svg,
.sidebar-nav-item.active svg {
  color: var(--text-0);
}

.sidebar-nav-badge {
  min-width: 17px;
  height: 17px;
  margin-left: auto;
  padding: 0 5px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 10px;
  font-weight: 700;
}

.sidebar-section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 10px 4px 20px;
  flex-shrink: 0;
}

.sidebar-section-title {
  color: var(--text-3);
  font-size: 12.5px;
  font-weight: 600;
}

.sidebar-section-action {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}

.sidebar-section-action:hover:not(:disabled) {
  background: var(--button-bg-hover);
  color: var(--text-0);
}

.sidebar-section-action:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}

.sidebar-section-action:disabled {
  cursor: default;
  opacity: 0.65;
}

.sidebar-content {
  min-height: 0;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 8px 8px;
}

.sidebar-footer {
  min-height: 46px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  border-top: 1px solid var(--border-mid);
  color: var(--text-1);
}

.sidebar-profile-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-3);
  color: var(--text-1);
}

.sidebar-profile-label {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
}

.sidebar-footer-action {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: var(--button-radius);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.sidebar-footer-action:hover {
  background: var(--bg-hover);
  color: var(--text-0);
}

/* Main */
.app-main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
}

/* ── Footer — composer-weight action bar ────────── */

.app-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  height: 54px;
  background: var(--bg-0);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  font-size: 13px;
  color: var(--text-2);
  user-select: none;
}

.progress-wrap {
  width: 90px;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.08s linear;
}

.progress-text {
  font-size: 11px;
  color: var(--text-1);
  font-family: var(--font-mono);
  flex-shrink: 0;
}

.footer-spacer { flex: 1; }
.status-message {
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.last-sync {
  flex-shrink: 0;
  white-space: nowrap;
}
.status-path {
  color: var(--text-2);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.status-indicator {
  width: 16px;
  height: 16px;
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 11px;
  line-height: 1;
}
.status-indicator.status-idle    { color: var(--text-2); }
.status-indicator.status-success { color: var(--green); }
.status-indicator.status-error   { color: var(--red); }
.status-indicator.status-partial { color: var(--yellow); }
.status-indicator.status-paused  { color: var(--yellow); }
.status-indicator.status-uploading,
.status-indicator.status-downloading {
  color: var(--text-1);
}

.status-loader {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: inline-block;
  position: relative;
}

.status-loader::before {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1.5px solid var(--loader-track);
  border-top-color: var(--text-0);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}

.status-loader::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-1);
  transform: translate(-50%, -50%);
  opacity: 0.9;
}

@keyframes spin { to { transform: rotate(360deg); } }

.footer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.footer-sync-actions {
  margin-left: 2px;
  padding-left: 12px;
  border-left: 1px solid var(--border);
}

.footer-selection-chip {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  border-radius: var(--r-pill);
  background: var(--chip-bg);
  color: var(--text-1);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.status-btn {
  flex-shrink: 0;
}

.status-btn svg { flex-shrink: 0; }

.status-btn.active {
  background: var(--button-bg-active);
  color: var(--text-0);
}

.pull-badge {
  min-width: 18px;
  height: 16px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-glow);
  color: var(--blue);
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
}

.push-badge {
  min-width: 18px;
  height: 16px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--button-border);
  background: var(--chip-strong-bg);
  color: var(--text-0);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  flex-shrink: 0;
}

/* ── Buttons — restrained shared system ─────────── */

.btn,
.status-btn,
.composer-action,
.editor-btn,
.sync-link-save {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 13px;
  border: 1px solid var(--button-border);
  border-radius: var(--button-radius);
  background: var(--button-bg);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}

.btn:hover:not(:disabled),
.status-btn:hover:not(:disabled),
.composer-action:hover:not(:disabled),
.editor-btn:hover:not(:disabled),
.sync-link-save:hover:not(:disabled) {
  background: var(--button-bg-hover);
  border-color: var(--border-strong);
  color: var(--text-0);
}

.btn:active:not(:disabled),
.status-btn:active:not(:disabled),
.composer-action:active:not(:disabled),
.editor-btn:active:not(:disabled),
.sync-link-save:active:not(:disabled) {
  background: var(--button-bg-active);
}

.btn:disabled,
.status-btn:disabled,
.composer-action:disabled,
.editor-btn:disabled,
.sync-link-save:disabled {
  opacity: var(--button-disabled-opacity);
  cursor: not-allowed;
}

.btn-primary,
.status-btn-primary,
.composer-action-primary,
.editor-btn-primary {
  background: var(--button-primary-bg);
  color: var(--text-0);
  border-color: var(--button-primary-border);
  font-weight: 600;
}

.btn-primary:hover:not(:disabled),
.status-btn-primary:hover:not(:disabled),
.composer-action-primary:hover:not(:disabled),
.editor-btn-primary:hover:not(:disabled) {
  background: var(--button-primary-hover);
  border-color: var(--border-strong);
}

.btn-secondary {
  color: var(--text-1);
}

.btn-ghost {
  background: transparent;
  color: var(--text-1);
  border-color: transparent;
  min-height: 32px;
  padding: 0 9px;
  border-radius: var(--button-radius);
}
.btn-ghost:hover:not(:disabled) {
  color: var(--text-0);
  background: var(--bg-hover);
}
.btn-ghost.active {
  color: var(--text-0);
  background: var(--button-bg-active);
}

.btn-link {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-1);
  padding: 0;
}
.btn-link:hover { color: var(--text-0); }
.btn-link:disabled { opacity: var(--button-disabled-opacity); cursor: not-allowed; }

/* ── File Tree ───────────────────────────────────── */

.file-tree {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  padding: 0;
}

.file-tree + .file-tree { margin-top: 8px; }

/* Section header — a Codex sidebar nav row */
.file-tree-header {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 0 10px;
  min-height: 40px;
  background: transparent;
  border: none;
  cursor: pointer;
  user-select: none;
  color: var(--text-0);
  font-family: var(--font);
  text-align: left;
  border-radius: 10px;
  flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease;
}

.file-tree-header:hover {
  background: var(--bg-hover);
}

.file-tree-header:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}

.file-tree-kind-icon {
  flex-shrink: 0;
  color: var(--text-1);
}

.icon-local  { color: var(--text-1); }
.icon-cloud  { color: var(--blue); }
.icon-git-branch-mark,
.icon-git-folder-mark { color: var(--blue); }

.file-tree-section-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-0);
  line-height: 1.15;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-tree-section-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.file-tree-header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.profile-utility-btn {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
}

.profile-utility-btn:hover:not(:disabled),
.profile-utility-btn.active {
  color: var(--text-0);
  background: var(--button-bg-hover);
}

.profile-remove-btn:hover:not(:disabled) {
  color: var(--red);
  background: var(--danger-soft);
}

.profile-utility-btn:disabled {
  opacity: var(--button-disabled-opacity);
  cursor: not-allowed;
}

.profile-utility-btn:focus-visible,
.file-tree-all-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.file-tree-all-btn {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  color: var(--text-2);
  padding: 0 8px;
  border-radius: var(--button-radius);
}
.file-tree-all-btn:hover {
  color: var(--text-0);
  background: var(--button-bg-hover);
  text-decoration: none;
}

.file-tree-chevron {
  flex-shrink: 0;
  color: var(--text-2);
}

.file-tree-body {
  padding: 4px 0 8px;
}

.tree-node { display: block; }

.tree-item {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 9px;
  cursor: pointer;
  user-select: none;
  border-radius: var(--r-sm);
  transition: background 0.15s ease, color 0.15s ease;
}

.tree-item:hover { background: var(--bg-hover); }
.tree-item-active {
  background: var(--bg-active) !important;
  box-shadow: inset 2px 0 0 var(--text-2);
}
.tree-item-active .tree-name { color: var(--text-0); font-weight: 500; }
.tree-item-excluded .tree-icon,
.tree-item-excluded .tree-name { opacity: 0.5; }
.tree-item-excluded .tree-name { color: var(--text-1); }

.tree-exclusion-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
}

.tree-check {
  width: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tree-check input[type="checkbox"] {
  appearance: none;
  width: 13px;
  height: 13px;
  display: grid;
  place-content: center;
  border: 1.5px solid var(--border-mid);
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.tree-check input[type="checkbox"]::before {
  content: "";
  width: 7px;
  height: 7px;
  transform: scale(0);
  clip-path: polygon(14% 44%, 0 58%, 38% 96%, 100% 18%, 86% 6%, 36% 68%);
  background: var(--primary-text);
}

.tree-check input[type="checkbox"]:checked {
  background: var(--primary);
  border-color: var(--primary);
}

.tree-check input[type="checkbox"]:checked::before {
  transform: scale(1);
}

.tree-check input[type="checkbox"]:indeterminate {
  background: var(--text-1);
  border-color: var(--text-1);
}

.tree-toggle {
  width: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
}

.tree-icon {
  color: var(--text-1);
  width: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
}
.tree-icon.dir { color: var(--text-1); }
.tree-icon.code { color: var(--blue); }
.tree-icon.doc { color: var(--text-1); }
.tree-icon.db { color: var(--green); }
.tree-icon.media { color: var(--purple); }

.tree-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13.5px;
  color: var(--text-1);
}

.tree-size {
  font-size: 11px;
  color: var(--text-2);
  flex-shrink: 0;
  font-family: var(--font-mono);
}

.file-status-badge {
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
  line-height: 1;
  margin-right: 3px;
}
.file-status-push     { color: var(--green); }
.file-status-pull     { color: var(--blue); }
.file-status-conflict { color: var(--yellow); }
.file-status-synced   { color: var(--text-2); }

.tree-row-actions {
  width: 22px;
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  opacity: 0;
}

.tree-item:hover .tree-row-actions,
.tree-item-active .tree-row-actions {
  opacity: 1;
}

.tree-icon-btn {
  width: 22px;
  height: 22px;
  border-radius: var(--r-sm);
  color: var(--text-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.tree-icon-btn:hover {
  background: var(--bg-active);
}

/* ── File Preview — document-style header ────────── */

.file-preview {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.file-preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  min-height: 54px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg-0);
}

.file-breadcrumb {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  display: flex;
  align-items: center;
  margin-right: 18px;
}

.breadcrumb-ancestors {
  min-width: 0;
  overflow: hidden;
  display: flex;
  justify-content: flex-end;
}

.breadcrumb-ancestor-track {
  display: inline-flex;
  align-items: center;
  flex: 0 0 max-content;
}

.breadcrumb-segment {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
}

.breadcrumb-chevron {
  flex-shrink: 0;
  margin: 0 7px;
  color: var(--text-3);
}

.breadcrumb-segment:first-child .breadcrumb-chevron {
  margin-left: 0;
}

.breadcrumb-file-chevron {
  margin-left: 7px;
}

.breadcrumb-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-0);
  font-size: 14px;
  font-weight: 600;
}

.file-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-2);
}
.meta-sep { color: var(--border-mid); }

.file-preview-body {
  flex: 1;
  overflow: auto;
  padding: 24px 34px;
}

.file-content {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-0);
  white-space: pre;
  tab-size: 2;
}

.file-error {
  color: var(--red);
  font-size: 13px;
  padding: 24px 34px;
}

/* ── Files workspace ─────────────────────────────── */

.files-workspace {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-0);
}

.app.macos-titlebar-overlay .files-workspace-header {
  min-height: 94px;
  padding-top: 30px;
}

.files-workspace-header {
  min-height: 68px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}

.files-context,
.files-destination,
.files-workspace-actions,
.files-profile-heading,
.files-link-meta,
.files-summary-filters,
.files-view-toggle {
  display: flex;
  align-items: center;
}

.files-context {
  min-width: 190px;
  flex: 1 1 260px;
  gap: 6px;
}

.files-profile-heading {
  min-width: 0;
  flex: 1;
  gap: 11px;
}

.files-profile-icon {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-1);
}

.files-profile-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}

.files-profile-copy strong {
  overflow: hidden;
  color: var(--text-0);
  font-size: 14px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.files-profile-copy span {
  max-width: 300px;
  overflow: hidden;
  color: var(--text-2);
  font-size: 11.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.files-icon-action,
.files-refresh-action {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: var(--button-radius);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
}

.files-icon-action:hover:not(:disabled),
.files-refresh-action:hover:not(:disabled) {
  background: var(--bg-hover);
  color: var(--text-0);
}

.files-destination {
  min-width: 230px;
  flex: 0 1 350px;
  gap: 8px;
  padding-left: 18px;
  border-left: 1px solid var(--border);
}

.files-toolbar-label {
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 600;
}

.files-storage-select {
  min-width: 0;
  flex: 1;
  height: 34px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--button-border);
  border-radius: var(--button-radius);
  background: var(--button-bg);
  color: var(--text-0);
  font: inherit;
  font-size: 12px;
}

.files-workspace-actions {
  flex-shrink: 0;
  gap: 7px;
}

.files-workspace-actions .btn {
  min-height: 34px;
  padding: 0 11px;
}

.files-action-count {
  min-width: 17px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background: var(--chip-strong-bg);
  color: var(--text-1);
  font-size: 9.5px;
  font-weight: 700;
}

.files-summary-bar {
  min-height: 43px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 6px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-subtle);
}

.files-summary-filters {
  min-width: 0;
  gap: 4px;
}

.files-summary-filters button,
.files-view-toggle button,
.files-select-visible {
  min-height: 28px;
  padding: 0 9px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}

.files-summary-filters button:hover,
.files-view-toggle button:hover,
.files-select-visible:hover:not(:disabled),
.files-summary-filters button.active,
.files-view-toggle button.active {
  background: var(--bg-hover);
  color: var(--text-0);
}

.files-summary-filters button span {
  margin-left: 4px;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
}

.files-summary-filters button.warning,
.files-summary-filters button.warning span {
  color: var(--yellow);
}

.files-link-meta {
  min-width: 0;
  justify-content: flex-end;
  gap: 9px;
  color: var(--text-2);
  font-size: 11px;
  white-space: nowrap;
}

.files-link-meta > span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
}

.files-sync-state {
  max-width: 180px;
  overflow: hidden;
  color: var(--text-1);
  text-overflow: ellipsis;
}

.files-sync-state.state-success { color: var(--green); }
.files-sync-state.state-error { color: var(--red); }
.files-sync-state.state-partial,
.files-sync-state.state-paused { color: var(--yellow); }

.files-notice {
  min-height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 6px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--warning-soft);
  color: var(--text-1);
  font-size: 11.5px;
}

.files-workspace-body {
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
}

.files-browser-pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--surface-subtle);
}

.files-browser-toolbar {
  min-height: 49px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}

.files-browser-toolbar input {
  min-width: 80px;
  height: 32px;
  flex: 1;
  padding: 0 10px;
  border: 1px solid var(--button-border);
  border-radius: var(--button-radius);
  background: var(--bg-0);
  color: var(--text-0);
  font: inherit;
  font-size: 12px;
}

.files-browser-toolbar input::placeholder { color: var(--text-3); }

.files-view-toggle {
  gap: 1px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--button-radius);
}

.files-view-toggle button {
  min-height: 26px;
  padding: 0 7px;
}

.files-select-visible {
  padding: 0 5px;
}

.files-select-visible:disabled {
  opacity: var(--button-disabled-opacity);
  cursor: not-allowed;
}

.files-browser-content {
  min-height: 0;
  flex: 1;
  overflow: auto;
  padding: 6px;
}

.file-tree-workspace .file-tree-body {
  padding: 0;
}

.file-tree-workspace .tree-item {
  border-radius: 6px;
}

.files-pane-message,
.files-preview-placeholder,
.files-workspace-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.files-pane-message {
  min-height: 180px;
  gap: 7px;
  padding: 24px;
  color: var(--text-2);
  font-size: 12px;
}

.files-pane-message strong {
  color: var(--text-1);
  font-size: 13px;
}

.files-pane-message .btn { margin-top: 7px; }

.files-preview-pane {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--bg-0);
}

.files-preview-placeholder {
  width: 100%;
  height: 100%;
  gap: 6px;
  color: var(--text-3);
}

.files-preview-placeholder strong {
  margin-top: 4px;
  color: var(--text-1);
  font-size: 13px;
  font-weight: 600;
}

.files-preview-placeholder span {
  color: var(--text-2);
  font-size: 12px;
}

.files-workspace-empty {
  gap: 8px;
  padding: 30px;
  color: var(--text-2);
}

.files-workspace-empty h1 {
  margin-top: 7px;
  color: var(--text-0);
  font-size: 20px;
  font-weight: 600;
}

.files-workspace-empty p {
  margin-bottom: 8px;
  font-size: 13px;
}

/* ── Sync Panel — floating-card sections ─────────── */

.sync-panel {
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-gutter: stable;
  background: var(--bg-0);
}

.sync-panel-content {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  padding: 38px 40px 28px;
}

.sync-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.sync-panel-title {
  font-size: 26px;
  font-weight: 650;
  color: var(--text-0);
  letter-spacing: -0.025em;
}

.settings-close {
  width: 32px;
  min-width: 32px;
  height: 32px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
}

.sync-panel-body {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: visible;
}

.appearance-section {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.appearance-row {
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.appearance-copy {
  min-width: 0;
}

.appearance-copy .settings-note {
  margin-top: 5px;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 500;
  user-select: none;
}

.theme-toggle > span {
  min-width: 30px;
  transition: color 150ms ease;
}

.theme-toggle > span:first-child {
  text-align: right;
}

.theme-toggle > span.active {
  color: var(--text-0);
}

.theme-switch-label {
  height: 22px;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}

.theme-switch {
  width: 38px;
  height: 22px;
}

.theme-switch::before {
  width: 18px;
  height: 18px;
}

.theme-switch:checked::before {
  transform: translateX(16px);
}

.settings-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.settings-section-title {
  color: var(--text-0);
  font-size: 17px;
  font-weight: 650;
  line-height: 1.2;
}

.settings-note {
  color: var(--text-2);
  font-size: 12.5px;
  line-height: 1.5;
}

.form-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-field { display: flex; flex-direction: column; gap: 6px; }

.form-label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-1);
  flex-shrink: 0;
}

.form-hint { font-size: 12px; color: var(--text-2); }

.form-label-row {
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex-wrap: nowrap;
  overflow: hidden;
}

.field-help {
  position: relative;
  width: 18px;
  height: 18px;
  border: 1px solid var(--border-mid);
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  flex-shrink: 0;
  font-family: var(--font);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1;
}

/* Visually 18px; the hit area meets the 24px minimum without inflating the glyph. */
.field-help::after {
  content: "";
  position: absolute;
  inset: -3px;
}

.field-help:hover {
  border-color: var(--border-strong);
  background: var(--button-bg-hover);
  color: var(--text-0);
}

.form-label-row .form-hint {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.form-input {
  min-height: 42px;
  background: var(--bg-4);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-0);
  font-family: var(--font);
  font-size: 13px;
  padding: 0 12px;
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
  width: 100%;
}
.form-input:focus {
  background: var(--button-bg);
  border-color: var(--accent);
}
.form-input::placeholder { color: var(--text-2); }

/* Optional-data card */
.exclusion-settings {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-4);
  padding: 0 14px;
}

.exclusion-summary {
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}

.exclusion-summary::-webkit-details-marker { display: none; }

.exclusion-summary::before {
  content: "›";
  color: var(--text-2);
  font-size: 18px;
  line-height: 1;
  transform: rotate(0deg);
  transition: transform 0.12s ease-out;
}

.exclusion-settings[open] .exclusion-summary::before { transform: rotate(90deg); }

.exclusion-summary:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 3px;
}

.exclusion-title {
  display: block;
  color: var(--text-0);
  font-size: 13.5px;
  font-weight: 600;
}

.exclusion-subtitle {
  display: block;
  margin-top: 2px;
  color: var(--text-2);
  font-size: 11px;
}

.exclusion-count {
  margin-left: auto;
  flex-shrink: 0;
  color: var(--text-2);
  font-size: 11px;
}

.exclusion-content { padding: 0 0 12px 24px; }
.exclusion-group + .exclusion-group { margin-top: 14px; }

.exclusion-group-label {
  margin-bottom: 4px;
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
}

.exclusion-list { border-top: 1px solid var(--border); }

.exclusion-row {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.exclusion-row:last-child { border-bottom: none; }

.exclusion-copy {
  min-width: 0;
  flex: 1;
  padding: 8px 0;
}

.exclusion-path {
  display: block;
  overflow-wrap: anywhere;
  color: var(--text-0);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.exclusion-reason {
  display: block;
  margin-top: 2px;
  color: var(--text-2);
  font-size: 11px;
}

.exclusion-warning {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--yellow);
}

/* iOS-style switch */
.exclusion-switch {
  appearance: none;
  width: 34px;
  height: 20px;
  position: relative;
  flex-shrink: 0;
  border: none;
  border-radius: var(--r-pill);
  background: var(--switch-off);
  cursor: pointer;
  transition: background 0.15s;
}

.exclusion-switch::before {
  content: "";
  width: 16px;
  height: 16px;
  position: absolute;
  top: 2px;
  left: 2px;
  border-radius: 50%;
  background: var(--text-1);
  transition: transform 0.15s ease-out, background 0.15s;
}

.exclusion-switch:checked {
  background: var(--accent);
}

.exclusion-switch:checked::before {
  transform: translateX(14px);
  background: var(--switch-thumb);
}

.exclusion-switch:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sync-panel-footer {
  position: sticky;
  bottom: 12px;
  align-self: flex-end;
  margin-top: 18px;
  padding: 8px;
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--border-mid);
  border-radius: 11px;
  background: var(--surface-overlay);
  box-shadow: var(--shadow-overlay);
  backdrop-filter: blur(18px);
  z-index: 4;
}

.save-feedback { font-size: 12.5px; color: var(--green); font-weight: 500; }

/* ── Cloud profile card ── */
.profile-box {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-4);
}
.profile-box-row {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 20px;
}
.profile-box-icon { color: var(--blue); flex-shrink: 0; }
.profile-box-label { font-size: 13.5px; font-weight: 600; color: var(--text-0); }
.profile-box-rev {
  font-size: 11px;
  color: var(--text-2);
  margin-left: auto;
  white-space: nowrap;
}
.profile-box-hint { font-size: 12.5px; color: var(--text-1); line-height: 1.5; }

.profile-box-fields {
  margin-top: 2px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.icon-spin {
  transform-box: view-box;
  transform-origin: center;
  animation: icon-spin 0.8s linear infinite;
}

.icon-spin-frame {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 16px;
  transform-origin: 8px 8px;
}

.icon-spin-frame > svg {
  width: 16px;
  height: 16px;
  display: block;
}

.icon-spin-frame.spinning {
  animation: icon-spin 0.8s linear infinite;
}

@keyframes icon-spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }

  .icon-spin,
  .icon-spin-frame.spinning,
  .exclusion-summary::before,
  .exclusion-switch,
  .exclusion-switch::before { transition: none; animation: none; }
}

/* ── Log drawer ─────────────────────────────────── */

.log-drawer {
  height: 0;
  overflow: hidden;
  flex-shrink: 0;
  border-top: 0 solid var(--border);
  background: var(--bg-1);
  position: relative;
  z-index: var(--z-log);
  transition: height 0.18s ease, border-top-width 0.18s;
}

.log-drawer.open {
  height: 240px;
  overflow: visible;
  border-top-width: 1px;
}

.log-resizer {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  z-index: 3;
  cursor: row-resize;
  touch-action: none;
}

.log-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: transparent;
  transition: background 0.12s ease;
}

.log-resizer:hover::after,
.log-resizer:active::after {
  background: var(--border-strong);
}

.log-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.log-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px 0 20px;
  min-height: 46px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.log-panel-heading {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.log-panel-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-1);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.log-panel-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.log-clear-btn { font-size: 11px; }

.log-manage-btn {
  min-height: 29px;
  font-size: 11px;
}

.log-type-filter {
  position: relative;
  height: 28px;
  color: var(--text-3);
  font-family: var(--font);
  font-size: 10.5px;
}

.log-type-filter > summary {
  min-width: 112px;
  height: 28px;
  padding: 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-0);
  cursor: pointer;
  list-style: none;
  user-select: none;
}

.log-type-filter > summary::-webkit-details-marker { display: none; }
.log-type-filter > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.log-type-filter[open] > summary { border-color: var(--border-strong); }
.log-type-filter > summary svg { margin-left: auto; transition: transform 120ms ease; }
.log-type-filter[open] > summary svg { transform: rotate(180deg); }

.log-type-filter-value {
  overflow: hidden;
  color: var(--text-1);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.log-type-filter-menu {
  position: absolute;
  z-index: 40;
  bottom: calc(100% + 7px);
  left: 0;
  width: 190px;
  padding: 6px;
  border: 1px solid var(--border-mid);
  border-radius: 9px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-popover);
}

.log-type-filter-bulk-actions {
  margin-bottom: 4px;
  padding-bottom: 5px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  border-bottom: 1px solid var(--border);
}

.log-type-filter-bulk-actions button {
  min-height: 26px;
  padding: 0 5px;
  border: 0;
  border-radius: 5px;
  color: var(--text-2);
  background: transparent;
  font: 10px var(--font);
  cursor: pointer;
}

.log-type-filter-bulk-actions button:hover:not(:disabled) {
  color: var(--text-0);
  background: var(--bg-hover);
}

.log-type-filter-bulk-actions button:disabled { opacity: .42; cursor: default; }

.log-type-filter-option {
  min-height: 29px;
  padding: 0 7px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 5px;
  color: var(--text-1);
  cursor: pointer;
  user-select: none;
}

.log-type-filter-option:hover { color: var(--text-0); background: var(--bg-hover); }

.log-type-filter-option input {
  width: 13px;
  height: 13px;
  margin: 0;
  accent-color: var(--accent);
}

.log-filter-control {
  height: 28px;
  padding-left: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-3);
  background: var(--bg-0);
  font-family: var(--font);
  font-size: 9.5px;
}

.log-filter-control select {
  height: 26px;
  max-width: 128px;
  padding: 0 24px 0 0;
  border: 0;
  outline: 0;
  color: var(--text-1);
  background: transparent;
  font: inherit;
  font-size: 10.5px;
  cursor: pointer;
}

.log-filter-control:focus-within {
  border-color: var(--border-strong);
}

.log-search-control input {
  width: 132px;
  height: 28px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: 0;
  color: var(--text-1);
  background: var(--bg-0);
  font: 10.5px var(--font);
}

.log-search-control input::placeholder { color: var(--text-3); }
.log-search-control input:focus { border-color: var(--border-strong); }

.log-panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  padding: 8px 0;
  font-size: 12px;
  line-height: 1.6;
}

.log-empty {
  padding: 8px 18px;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 12px;
}

.log-empty .status-loader { margin-right: 7px; }
.log-load-error { color: var(--red); }

.log-load-older {
  min-height: 25px;
  margin: 0 18px 6px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-2);
  font: 10.5px var(--font);
  cursor: pointer;
}

.log-load-older:hover:not(:disabled) { color: var(--text-0); }
.log-load-older:disabled { opacity: var(--button-disabled-opacity); cursor: wait; }

.log-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 1px 18px;
}

.log-line:hover { background: var(--bg-hover); }

.log-ts {
  color: var(--text-2);
  flex-shrink: 0;
  font-size: 10.5px;
  min-width: 68px;
}

.log-type {
  width: 78px;
  flex: 0 0 78px;
  overflow: hidden;
  color: var(--text-3);
  font-family: var(--font);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.035em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.log-msg { color: var(--text-1); word-break: break-all; }
.log-info  .log-msg { color: var(--text-1); }
.log-success .log-msg { color: var(--green); }
.log-warning .log-msg { color: var(--yellow); }
.log-error .log-msg { color: var(--red); }

.sync-log-manager-dialog { width: min(620px, 100%); }

.sync-log-manager-body {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.sync-log-manager-loading {
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-2);
  font-size: 12px;
}

.sync-log-storage-summary {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border);
}

.sync-log-storage-summary > div {
  min-width: 0;
  padding: 8px 12px 16px 0;
}

.sync-log-storage-summary dt {
  margin-bottom: 4px;
  color: var(--text-3);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.sync-log-storage-summary dd {
  overflow: hidden;
  color: var(--text-0);
  font-size: 14px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sync-log-policy-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.sync-log-policy-fields label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--text-2);
  font-size: 10.5px;
}

.sync-log-policy-fields select {
  min-height: 34px;
  padding: 0 32px 0 10px;
  border: 1px solid var(--border-mid);
  border-radius: 7px;
  outline: none;
  color: var(--text-1);
  background: var(--input-bg);
  font: 11.5px var(--font);
}

.sync-log-policy-fields select:focus-visible { border-color: var(--border-strong); }

.sync-log-cleanup-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.sync-log-cleanup-actions .btn { min-height: 32px; font-size: 11px; }
.sync-log-cleanup-actions .danger { margin-left: auto; color: var(--red); }

.sync-log-manager-notice {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--green);
  font-size: 11px;
}

@media (max-width: 720px) {
  .log-panel-header { padding-right: 8px; padding-left: 12px; }
  .log-panel-heading { gap: 6px; }
  .log-type-filter > summary { min-width: 82px; padding: 0 6px; }
  .log-type-filter-key { display: none; }
  .log-filter-control { padding-left: 6px; }
  .log-filter-control > span { display: none; }
  .log-filter-control select { max-width: 90px; }
  .log-search-control { display: none; }
  .log-manage-btn { padding: 0 6px; }
  .log-line { gap: 7px; padding-right: 12px; padding-left: 12px; }
  .log-type { width: 62px; flex-basis: 62px; }
  .sync-log-storage-summary { grid-template-columns: 1fr; }
  .sync-log-storage-summary > div { padding-bottom: 10px; }
  .sync-log-policy-fields { grid-template-columns: 1fr; }
  .sync-log-cleanup-actions { align-items: stretch; flex-direction: column; }
  .sync-log-cleanup-actions .danger { margin-left: 0; }
}

.status-area-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: none;
  cursor: pointer;
  min-height: 34px;
  padding: 0 10px;
  border-radius: var(--button-radius);
  color: inherit;
  font-family: inherit;
  font-size: inherit;
  min-width: 0;
  max-width: min(340px, 38vw);
  flex-shrink: 1;
}

.status-area-btn:hover  { background: var(--button-bg-hover); }
.status-area-btn.active { background: var(--button-bg-active); }

.log-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 9.5px;
  font-weight: 700;
  font-family: var(--font);
  line-height: 1;
}

/* ── Sidebar messages ────────────────────────────── */

.sidebar-msg { padding: 16px; font-size: 13px; color: var(--text-2); }
.sidebar-msg.error { color: var(--red); }

/* ── Scrollbar ───────────────────────────────────── */

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-2); }

@media (max-width: 900px) {
  .app-sidebar {
    width: 280px;
  }

  .sync-panel-content {
    padding: 28px 24px;
  }

  .footer-actions {
    gap: 6px;
  }

  .status-path,
  .last-sync {
    display: none;
  }

}

@media (max-width: 720px) {
  .app-body {
    flex-direction: column;
  }

  .app-sidebar {
    width: 100% !important;
    max-height: 42vh;
    border-right: 0;
    border-bottom: 1px solid var(--border-mid);
  }

  .sidebar-resizer {
    display: none;
  }

  .sidebar-nav {
    flex-direction: row;
    padding-bottom: 8px;
  }

  .sidebar-nav-item {
    justify-content: center;
  }

  .sidebar-nav-item span:not(.sidebar-nav-badge) {
    display: none;
  }

  .file-preview-header,
  .app-footer {
    padding-left: 14px;
    padding-right: 14px;
  }

  .file-preview-body,
  .file-error {
    padding: 18px 16px;
  }

  .app-footer {
    height: auto;
    min-height: 58px;
    flex-wrap: wrap;
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .footer-actions {
    order: 4;
    width: 100%;
    margin-left: 0;
  }

  .footer-sync-actions {
    padding-left: 0;
    border-left: 0;
  }

  .footer-selection-chip {
    min-height: 34px;
  }

  .status-btn,
  .composer-action {
    flex: 1;
  }

  .form-row-2 {
    grid-template-columns: 1fr;
  }
}

/* ── File editor ─────────────────────────────────── */

.editor-dirty {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yellow);
  display: inline-block;
  margin-left: 8px;
  flex-shrink: 0;
}

.editor-actions { gap: 8px; }

.editor-readonly {
  font-size: 11px;
  color: var(--text-2);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-pill);
  padding: 2px 9px;
  white-space: nowrap;
}

.editor-saved { color: var(--green); font-size: 12px; white-space: nowrap; }

.editor-error {
  color: var(--red);
  font-size: 12px;
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.editor-btn {
  min-height: 30px;
  padding: 0 11px;
  font-size: 12px;
}

.file-editor-body {
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.file-code-editor {
  height: 100%;
}

.file-code-editor .cm-editor {
  height: 100%;
}

.file-editor-body .cm-scroller {
  height: 100%;
  overflow: auto;
  font-family: var(--font-mono);
  line-height: 1.6;
}

.file-loading {
  padding: 20px 28px;
  color: var(--text-2);
  font-size: 13px;
}

/* ── Markdown preview ────────────────────────────── */

.mode-toggle {
  display: inline-flex;
  align-items: center;
  padding: 2px;
  border: 1px solid var(--border-mid);
  border-radius: var(--button-radius);
  background: var(--bg-4);
  gap: 2px;
}

.mode-toggle-btn {
  min-height: 22px;
  padding: 0 11px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}

.mode-toggle-btn:hover {
  color: var(--text-0);
  background: var(--button-bg-hover);
}

.mode-toggle-btn.active {
  background: var(--button-bg-active);
  color: var(--text-0);
}

.markdown-preview {
  height: 100%;
  overflow-y: auto;
  padding: 26px 34px 48px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-0);
}

.markdown-preview-content {
  max-width: 820px;
}

.markdown-preview h1,
.markdown-preview h2,
.markdown-preview h3,
.markdown-preview h4 {
  font-weight: 650;
  letter-spacing: -0.01em;
  margin: 1.4em 0 0.5em;
  line-height: 1.3;
}
.markdown-preview h1:first-child,
.markdown-preview h2:first-child,
.markdown-preview h3:first-child { margin-top: 0; }
.markdown-preview h1 { font-size: 1.6em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
.markdown-preview h2 { font-size: 1.3em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
.markdown-preview h3 { font-size: 1.12em; }
.markdown-preview h4 { font-size: 1em; }

.markdown-preview p { margin: 0.6em 0; }

.markdown-preview a { color: var(--accent); text-decoration: none; }
.markdown-preview a:hover { text-decoration: underline; }

.markdown-preview ul,
.markdown-preview ol { margin: 0.6em 0; padding-left: 1.6em; }
.markdown-preview li { margin: 0.25em 0; }
.markdown-preview li > ul,
.markdown-preview li > ol { margin: 0.15em 0; }

.markdown-preview code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--bg-3);
  padding: 0.15em 0.4em;
  border-radius: var(--r-sm);
}

.markdown-preview pre {
  background: var(--bg-4);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  margin: 0.8em 0;
  overflow-x: auto;
}

.markdown-preview pre code {
  background: transparent;
  padding: 0;
  font-size: 12.5px;
  line-height: 1.6;
}

.markdown-preview blockquote {
  margin: 0.8em 0;
  padding: 2px 14px;
  border-left: 3px solid var(--border-strong);
  color: var(--text-1);
}

.markdown-preview hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 1.4em 0;
}

.markdown-preview table {
  border-collapse: collapse;
  margin: 0.8em 0;
  display: block;
  overflow-x: auto;
  max-width: 100%;
}

.markdown-preview th,
.markdown-preview td {
  border: 1px solid var(--border-mid);
  padding: 6px 12px;
  font-size: 13px;
}

.markdown-preview th {
  background: var(--bg-2);
  font-weight: 600;
  text-align: left;
}

.markdown-preview img { max-width: 100%; border-radius: var(--r-sm); }

.markdown-preview input[type="checkbox"] {
  margin-right: 6px;

/* Sync destination mode switch (settings) */
.mode-switch {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg-4);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: fit-content;
}
.mode-switch-btn {
  min-height: 32px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
  line-height: 1;
}
.mode-switch-btn:hover {
  color: var(--text-1);
  background: var(--button-bg-hover);
}
.mode-switch-btn.active {

.sync-link-content {
  display: grid;

}

.sync-link-card {
  padding: 12px;

}

.sync-link-card-focused {
  border-color: var(--border-strong);
  background: var(--surface-subtle-hover);
}

.sync-link-card-head,
.sync-link-location-row,
.sync-link-cloud-row {

  align-items: center;
  gap: 10px;
}

.sync-link-card-head {
  justify-content: space-between;
  margin-bottom: 10px;
}

.sync-link-card-title {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--text-0);
  font-size: 13.5px;
  font-weight: 600;
}

.sync-link-root {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--bg-2);
  color: var(--text-0);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}

.sync-link-location-pill {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--bg-2);
  color: var(--text-2);
  font-size: 11px;
  font-weight: 600;
}

.sync-link-location-pill.custom {
  color: var(--blue);
  background: var(--accent-glow);
}

.sync-link-location-label {
  width: 76px;
  flex-shrink: 0;
  color: var(--text-2);
  font-size: 11.5px;
}

.sync-link-location-value {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-1);
  font-family: var(--font-mono);
  font-size: 12px;
}

.sync-link-action {
  flex-shrink: 0;
  color: var(--text-2);
  font-size: 11.5px;
  white-space: nowrap;
}

.sync-link-editor {
  min-width: 0;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}

.sync-link-editor .form-input,
.sync-link-cloud-row .form-input {
  min-height: 36px;
}

.sync-link-save {
  min-width: 58px;
  min-height: 36px;
  padding: 0 12px;
  font-size: 11.5px;
}

.sync-link-edit-hint {
  margin: 6px 0 0 86px;
  line-height: 1.4;
}

.sync-link-cloud-row {
  margin-top: 10px;
}

.sync-link-cloud-row .form-input {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 13px;
}

.sync-link-setup-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

@media (max-width: 620px) {
  .sync-link-location-row {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .sync-link-editor {
    flex-basis: calc(100% - 86px);
  }

  .sync-link-edit-hint {
    margin-left: 0;
  }
}

/* ── Project-scoped sync ────────────────────────────────────────────────── */

.sync-app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  overflow: hidden;
  background: var(--app-shell);
  color: var(--text-0);
}

.sync-sidebar-toggle {
  position: absolute;
  z-index: 12;
  top: 14px;
  left: 86px;
  width: 28px;
  height: 24px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 7px;
  color: var(--text-2);
  background: transparent;

}

.sync-sidebar-toggle:hover {
  color: var(--text-0);
  background: var(--bg-hover);
}

.sync-sidebar-toggle:focus-visible {

  outline-offset: 1px;
}

.sync-app.sidebar-hidden .sync-sidebar,
.sync-app.sidebar-hidden .sync-sidebar-resizer {
  display: none;
}

.sync-app.sidebar-hidden .sync-titlebar {
  padding-left: 140px;
}

.sync-app.sidebar-hidden .sync-titlebar::before {
  content: "";
  position: absolute;
  top: 13px;
  bottom: 13px;
  left: 123px;
  width: 1px;
  background: var(--border);
  pointer-events: none;
}

.sync-sidebar {
  position: relative;

  min-width: var(--sync-sidebar-width, 318px);

.sync-sidebar-brand {

.sync-brand-logo {

.sync-sidebar-brand > span:last-child {

.sync-primary-nav {

.sync-sidebar-section-heading {

.sync-sidebar-section-heading > div {

.sync-sidebar-section-heading button {

}

.sync-sidebar-section-heading button:hover:not(:disabled) { color: var(--text-0); background: var(--bg-hover); }

.sync-project-list {

}

.sync-project-nav-item {
  width: 100%;

  align-items: center;
  gap: 9px;

  border-radius: 10px;

  color: var(--text-1);

  text-align: left;

}

.sync-project-nav-item:hover { background: var(--bg-hover); }
.sync-project-nav-item.active { color: var(--text-0); background: var(--surface-row-active); border-color: var(--border); }

.sync-project-nav-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--accent);

  border-radius: 8px;
}

.sync-project-nav-copy { min-width: 0; display: flex; flex-direction: column; }
.sync-project-nav-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 600; }
.sync-project-nav-copy span { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 10.5px; }

.sync-readiness-dot {
  margin-left: auto;

  background: var(--chip-bg);

  text-transform: uppercase;
}
.sync-readiness-dot.ready { color: var(--green); }
.sync-readiness-dot.blocked { color: var(--red); }

.sync-sidebar-message { padding: 14px 10px; color: var(--text-3); font-size: 12px; }
.sync-sidebar-empty {
  width: 100%;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px dashed var(--border-mid);
  border-radius: 9px;
  color: var(--text-2);
  background: transparent;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.sync-sidebar-empty:hover:not(:disabled) { color: var(--text-0); background: var(--bg-hover); }

.sync-sidebar-footer {
  padding: 9px;
  border-top: 1px solid var(--border);
}
.sync-sidebar-footer button {
  width: 100%;
  height: 34px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: 8px;
  color: var(--text-2);
  background: transparent;
  font: inherit;
  font-size: 11.5px;
  cursor: pointer;
}
.sync-sidebar-footer button:hover:not(:disabled) { color: var(--text-0); background: var(--bg-hover); }

.sync-workspace {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
}

.sync-titlebar {
  position: relative;
  z-index: 6;
  width: 100%;
  height: 52px;
  min-height: 52px;
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 14px 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-0);
}

.sync-titlebar-context {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text-0);
}

.sync-titlebar-context > svg {
  flex-shrink: 0;
  color: var(--text-1);
}

.sync-titlebar-context strong {
  overflow: hidden;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sync-titlebar-context span {
  flex-shrink: 0;
  padding: 2px 6px;
  border-radius: var(--r-pill);
  color: var(--text-2);
  background: var(--chip-bg);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.sync-theme-button {
  min-height: 24px;
  flex-shrink: 0;
  padding: 0 9px;
  border: 0;
  border-radius: 6px;
  color: var(--text-2);
  background: transparent;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.sync-theme-button:hover { color: var(--text-0); background: var(--bg-hover); }

.sync-titlebar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.sync-titlebar-actions .storage-link-more {
  width: 28px;
  height: 28px;
  border: 0;
}

.sync-startup-screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--text-0);
  background: var(--bg-0);
}

.sync-startup-drag-region {
  position: absolute;
  z-index: 5;
  top: 0;
  right: 0;
  left: 0;
  height: 52px;
}

.sync-startup-content {
  width: min(292px, calc(100vw - 64px));
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: sync-startup-rise 360ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.sync-startup-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sync-startup-mark {
  position: relative;
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
}

.sync-startup-mark::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 7px;
  height: 7px;
  border: 2px solid var(--bg-0);
  border-radius: 50%;
  background: var(--accent);
  animation: sync-startup-pulse 1.8s ease-in-out infinite;
}

.sync-startup-mark img {
  width: 36px;
  height: 36px;
  display: block;
  border-radius: 50%;
}

.sync-startup-brand h1 {
  color: var(--text-0);
  font-size: 17px;
  font-weight: 650;
  line-height: 1;
  letter-spacing: -0.02em;
}

.sync-startup-progress {
  width: 100%;
  margin-top: 22px;
}

.sync-startup-progress-track {
  position: relative;
  height: 2px;
  display: block;
  overflow: hidden;
  border-radius: var(--r-pill);
  background: var(--loader-track);
}

.sync-startup-progress-track > span {
  position: relative;
  width: var(--sync-startup-progress);
  height: 100%;
  display: block;
  overflow: hidden;
  border-radius: inherit;
  background: var(--accent);
  transition: width 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.sync-startup-progress-track > span::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 22px;
  background: color-mix(in srgb, var(--text-0) 38%, transparent);
  animation: sync-startup-progress-glint 1.8s ease-in-out infinite;
}

.sync-startup-progress > p {
  margin-top: 9px;
  color: var(--text-2);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@keyframes sync-startup-rise {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes sync-startup-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

@keyframes sync-startup-progress-glint {
  from { left: -42px; }
  to { left: calc(100% + 12px); }
}

.sync-host-recovery {
  min-height: 100vh;
  min-height: 100svh;
  padding: 24px;
  display: grid;
  place-items: center;
  color: var(--text-1);
  background: var(--bg-0);
}
.sync-host-recovery .sync-empty-state { width: min(620px, 100%); }
.sync-host-recovery .sync-callout { margin: 8px 0; }

.sync-main {
  flex: 1;
  min-height: 0;
  overflow: auto;
  /* Reserve the scrollbar gutter so content never shifts sideways when the
     scrollbar appears — visible on systems set to always-show scrollbars. */
  scrollbar-gutter: stable;
  padding: 28px clamp(22px, 3.5vw, 52px) 64px;
}

.sync-eyebrow {
  display: block;
  margin-bottom: 3px;
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.075em;
}

.sync-page-header,
.sync-project-header {
  max-width: 1180px;
  margin: 0 auto 22px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.sync-page-header h1,
.sync-project-header h1 {
  color: var(--text-0);
  font-size: 25px;
  line-height: 1.18;
  letter-spacing: -0.035em;
}
.sync-page-header p { max-width: 660px; margin-top: 5px; color: var(--text-2); font-size: 12.5px; }
.sync-page-actions, .sync-project-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.sync-page-actions select,
.sync-project-actions select {
  min-width: 150px;
  height: 34px;
  padding: 0 30px 0 10px;
  border: 1px solid var(--button-border);
  border-radius: var(--button-radius);
  color: var(--text-0);
  background: var(--button-bg);
  font: inherit;
  font-size: 12px;
}

.sync-project-identity { display: flex; align-items: center; gap: 13px; }
.sync-project-large-icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  border-radius: 13px;
}

.sync-path-button {
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 5px;
  border: 0;
  color: var(--text-2);
  background: transparent;
  font: inherit;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
}
.sync-path-button:hover { color: var(--accent); }

.sync-storage-picker { position: relative; display: flex; align-items: center; gap: 3px; }
.sync-link-popover {
  position: absolute;
  z-index: 20;
  top: calc(100% + 7px);
  right: 0;
  width: 250px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  border: 1px solid var(--border-mid);
  border-radius: 11px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-popover);

.sync-link-popover > strong { padding: 5px 7px; font-size: 11px; }
.sync-link-popover > span,
.sync-link-popover > button {
  min-height: 32px;
  padding: 6px 7px;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  border-radius: 7px;
  color: var(--text-1);
  background: transparent;
  font: inherit;
  font-size: 11.5px;
  text-align: left;
}
.sync-link-popover > button { cursor: pointer; }
.sync-link-popover > button:hover { color: var(--text-0); background: var(--bg-hover); }
.sync-link-popover small { margin-left: auto; color: var(--text-3); font-size: 9.5px; }

.sync-scope-strip,
.sync-project-summary {
  max-width: 1180px;
  margin: 0 auto 12px;
  display: grid;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-card);
  overflow: hidden;
}

.sync-scope-strip { grid-template-columns: 1fr 1fr 1fr 0.8fr auto; }
.sync-scope-strip > div {
  min-width: 0;
  padding: 10px 13px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}
.sync-scope-strip span,
.sync-project-summary span { color: var(--text-3); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.045em; }
.sync-scope-strip strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-1); font-size: 11px; font-weight: 500; }
.sync-scope-strip > button { width: 38px; border: 0; color: var(--text-2); background: transparent; cursor: pointer; }

.sync-project-summary > div:last-child { border-right: 0; }
.sync-project-summary strong { font-size: 15px; }
.sync-project-summary .warning strong { color: var(--yellow); }
.sync-readiness-summary.ready strong { color: var(--green); }
.sync-readiness-summary.blocked strong { color: var(--red); }
.sync-readiness-summary.needs_setup strong { color: var(--yellow); }

.sync-resource-groups {
  width: 100%;
  max-width: none;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sync-resource-group {
  border: 0;
  border-radius: 0;
  background: transparent;
  overflow: visible;
}

.sync-resource-group-header {
  min-height: 40px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  border-radius: 10px;
  color: var(--text-0);
  background: transparent;
  cursor: pointer;

.sync-resource-group-header:hover { background: var(--bg-hover); }

/* The blocked tally rides in front of the selected/total pair and takes the

.sync-resource-row {

.sync-resource-select { display: grid; place-items: center; }

}
.sync-resource-select input {

.sync-fact-grid { margin: 18px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--border); border-radius: 9px; background: var(--border); overflow: hidden; }

}
.sync-field-grid.three { grid-template-columns: 1fr 1.3fr 0.8fr; }

.sync-provider-toggle span { color: var(--text-3); font-size: 9.5px; }

.sync-profile-select-row { min-width: 0; display: flex; gap: 7px; }

}
.sync-profile-select-row select {
  min-width: 0;
  height: 33px;

/* A native select cannot hold an <svg> child, so the app's chevron rides a

}

.sync-provider-home-grid input,
.sync-storage-fields input,

.sync-storage-checks { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sync-storage-checks label { min-width: 0; padding: 8px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-row); cursor: pointer; }

.sync-bundle-match-meta,

  min-height: 72px;
  padding: 10px 16px 10px 20px;
  border-top-color: var(--button-primary-border);
  background: color-mix(in srgb, var(--accent-soft) 48%, var(--surface-footer));
