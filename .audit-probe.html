.sync-path-sync,
.sync-path-menu-label,
.sync-path-rename label,
.sync-sync-review-header h1,
.sync-sync-review-header h2,
.sync-history-section-heading h2,
.sync-history-branch-state,
.sync-history-preserved-badge,
.sync-history-continuity-copy > strong,
.sync-sync-review-tabs > button,
.sync-modal-header h1,
.log-panel-title,
.log-type,
.log-type-filter-key,
.log-type-filter-value,
.log-filter-control > span,
.sync-log-storage-summary dt,
.sync-log-policy-fields label > span,
.sync-setup-section > .sync-card-heading strong,
.sync-setup-workspace .sync-field-grid label > span,
.sync-setup-workspace .sync-agent-choice button strong,
.sync-bundle-recommended,
.sync-divergence-choice button,
.sync-storage-editor-title,
.sync-storage-repositories-heading h2,
.sync-field-name,
.sync-storage-repository-details > dt,
.sync-storage-repo-chip > span,
.sync-r2-guide-warning,
.sync-r2-guide > .btn-link,
.sync-secret-reveal,
.session-detail-day-divider > span,
.session-detail-toolbar-label,
.session-detail-filter-name,
.session-detail-checkpoint-branch,
.session-detail-payload-label {
  font-family: var(--font-pixel);
  /* One weight exists, and synthesis is off, so asking for anything heavier
     here would be a declaration that quietly does nothing. Pixel hierarchy is
     size and colour. */
  font-weight: var(--weight-regular);
  font-synthesis: none;
  letter-spacing: 0;
}

/* Sizes and tracking for the chrome labels that App.css left on fractional
   values. Uppercase micro-labels keep their air with whole-pixel tracking. */
.sync-eyebrow,
.sync-draft-badge,
.sync-bundle-recommended,
.sync-field-name,
.sync-storage-repository-details > dt,
.sync-storage-repo-chip > span,
.sync-r2-guide-warning {
  font-size: var(--type-3xs);
  letter-spacing: 1px;
}

/* Chrome names for the storage panels, one step under the page heading. */
.sync-storage-editor-title,
.sync-storage-repositories-heading h2 {
  font-size: var(--type-md);
}

.settings-section-title {
  font-size: var(--type-xl);
}

.sync-sync-review-tabs > button {
  font-size: var(--type-md);
}

/* The review header names the page in the app's own voice, and the tabs directly
   under it already speak in the pixel face — leaving the title in the sans split
   one control across two voices. App.css also asked for 650, which this face
   never drew apart from 600. */
.sync-sync-review-header h1,
.sync-sync-review-header h2 {
  font-size: var(--type-lg);
}

/* The line under it is a sentence, and 10.5px is on no step of the scale. */
.sync-sync-review-header p {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-prose);
}

/* Counts, not labels: tabular figures so the header does not reflow as the
   selection changes. */
.sync-sync-review-icon-action > span,
.sync-sync-review-selected {
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
}

.sync-sync-review-selected {
  padding: 0 6px;
  color: var(--text-2);
  white-space: nowrap;
}

/* Tabular figures equalise digit widths but not digit counts: 9 → 10 grows the
   string by a character, which shoved the header's icon buttons sideways on a
   plain checkbox tick. The numerator gets a slot as wide as the total, so the
   slash, the total, and every icon after them hold still while selecting. */
.sync-sync-review-selected > b {
  display: inline-block;
  min-width: calc(var(--review-count-digits, 1) * 1ch);
  font-weight: inherit;
  text-align: right;
}

.sync-sync-review-tabs > button > small {
  font-family: var(--font-mono);
  font-size: var(--type-3xs);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
}

/* The lineage column on a blocked destination is figures, not a sentence: it
   holds its width in the mono face while the sentence beside it stays in the
   clean one. App.css left it on a literal 10px. */
.sync-sync-review-pull-detail {
  font-family: var(--font-mono);
  font-size: var(--type-3xs);
  font-variant-numeric: tabular-nums;
}

/* Recovery copy is prose, not chrome. Keep it in the clean reading face even
   though the surrounding review controls use the pixel label face. */
.sync-sync-review-pull-required > span {
  font-family: var(--font-sans);
  font-size: var(--type-sm);
  line-height: var(--leading-prose);
}

.sync-sync-review-pull-required > span > strong {
  font-family: var(--font-sans);
  font-size: var(--type-md);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-snug);
  letter-spacing: 0;
}

/* Sentences the app wrote are still sentences: they read in the clean face at
   prose leading, not in blocks. */
.profile-links-subtitle,
.sync-empty-state p,
.sync-empty-state > span,
.sync-pane-message,
.sync-backend-banner span,
.sync-callout,
.sync-modal-footer span {
  font-family: var(--font-sans);
  line-height: var(--leading-prose);
}

/* Counts glued into an English phrase keep the surrounding face and only ask
   for figures that hold their width. */
.profile-links-counts {
  font-family: var(--font-sans);
  font-size: var(--type-md);
  font-variant-numeric: tabular-nums;
}

button,
input,
select,
textarea,
summary {
  font-family: inherit;
  font-variant-ligatures: none;
}

::selection {
  color: var(--primary-text);
  background: var(--primary);
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
  box-shadow: none;
}

::-webkit-scrollbar-thumb {
  min-height: 28px;
  min-width: 28px;
  border: 0;
  border-radius: 3px;
  background: var(--retro-scroll-thumb);
}

::-webkit-scrollbar-thumb:vertical {
  box-shadow:
    inset -1px 0 0 var(--retro-scroll-thumb-highlight),
    0 1px 2px var(--retro-scroll-thumb-shadow);
}

::-webkit-scrollbar-thumb:horizontal {
  box-shadow:
    inset 0 -1px 0 var(--retro-scroll-thumb-highlight),
    0 1px 2px var(--retro-scroll-thumb-shadow);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--retro-scroll-thumb-hover);
}

::-webkit-scrollbar-thumb:vertical:hover {
  box-shadow:
    inset -1px 0 0 var(--retro-scroll-thumb-highlight),
    0 1px 3px var(--retro-scroll-thumb-shadow);
}

::-webkit-scrollbar-thumb:horizontal:hover {
  box-shadow:
    inset 0 -1px 0 var(--retro-scroll-thumb-highlight),
    0 1px 3px var(--retro-scroll-thumb-shadow);
}

::-webkit-scrollbar-corner {
  background: transparent;
  box-shadow: none;
}

.sync-app {
  padding: var(--retro-gutter);
  border: 0;
  border-radius: 0;
  background: var(--retro-frame-gutter);
  box-shadow: none;
}

.sync-app svg {
  shape-rendering: crispEdges;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.sync-app .icon-git-branch-mark,
.sync-app .icon-git-folder-mark {
  color: var(--text-1);
}

.sync-workspace {
  background: var(--bg-0);
}

.sync-main {
  color: var(--text-1);
}

.btn,
.sync-app button {
  letter-spacing: 0;
}

.btn {
  border-color: var(--button-border);
  border-radius: var(--button-radius);
  background: var(--button-bg);
  box-shadow: none;
  font-size: var(--type-sm);
  line-height: var(--leading-flat);
  transition:
    color 90ms steps(2, end),
    background 90ms steps(2, end),
    border-color 90ms steps(2, end),
    transform 70ms steps(1, end);
}

.btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--button-bg-hover);
}

.btn:active:not(:disabled) {
  box-shadow: none;
  transform: translate(1px, 1px);
}

.btn.btn-primary,
.sync-app .btn-primary {
  border-color: var(--button-primary-border);
  background: var(--button-primary-bg);
  color: var(--button-primary-text);
}

.btn.btn-primary:hover:not(:disabled),
.sync-app .btn-primary:hover:not(:disabled) {
  background: var(--button-primary-hover);
}

.sync-app button:focus-visible,
.sync-app input:focus-visible,
.sync-app select:focus-visible,
.sync-app textarea:focus-visible,
.sync-app summary:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

/* Checked reads as a marked box, not a filled one. The base style inverts to a
   solid --text-0 square, which stamps a hard dark block into every selected row
   — the heaviest thing on the page, for the smallest control on it. Keeping the
   box transparent and drawing the tick in the text colour says the same thing
   at the weight the control deserves. */
.sync-sync-row-choice input:checked,
.sync-sync-review-workspace .sync-resource-select input:checked,
.sync-sync-review-workspace .sync-pull-item-select input:checked {
  border-color: var(--border-strong);
  background: transparent;
}

.sync-sync-row-choice input:checked::before,
.sync-sync-review-workspace .sync-resource-select input:checked::before,
.sync-sync-review-workspace .sync-pull-item-select input:checked::before {
  background: var(--text-0);
}

.sync-app input:not([type="checkbox"]):not([type="radio"]),
.sync-app select,
.sync-app textarea,
.sync-modal input:not([type="checkbox"]):not([type="radio"]),
.sync-modal select,
.sync-modal textarea {
  border-color: var(--button-border);
  border-radius: 4px;
  background: var(--bg-4);
  color: var(--text-0);
  box-shadow: inset 1px 1px 0 var(--surface-muted);
}

.sync-app input::placeholder,
.sync-app textarea::placeholder {
  color: var(--text-3);
}

/* The storage editor states each example once, as the placeholder — which
   makes it content, not a hint behind a visible value. --text-3 measures
   3.4:1 (light) / 3.9:1 (dark) on the field; --text-2 clears 4.5:1 in both. */
.sync-storage-fields input::placeholder,
.sync-folder-field input::placeholder {
  color: var(--text-2);
}

/* Desktop shell */

/* The sidebar and the workspace are gutter-coloured trays; the regions inside
   them are the tiles that carry the frame edge and the corner radius. */
.sync-sidebar {
  overflow: visible;
  gap: var(--retro-gutter);
  border: 0;
  border-radius: 0;
  background: var(--retro-frame-gutter);
  box-shadow: none;
}

.sync-workspace {
  overflow: visible;
  border: 0;
  border-radius: 0;
  background: var(--retro-frame-gutter);
  box-shadow: none;
}

.sync-sidebar-head,
.sidebar-project-pane,
.sidebar-storage-pane,
.sidebar-catalog-pane,
.sync-sidebar-product-mark,
.sync-titlebar,
.sync-workspace > .sync-main,
.sync-log-drawer.open {
  border: 1px solid var(--retro-frame-edge);
  border-radius: var(--retro-panel-radius);
}

.sync-sidebar-head {
  display: flex;
  overflow: hidden;
  flex: 0 0 auto;
  flex-direction: column;
  background: var(--bg-1);
}

/* The strip exists only to clear the macOS traffic lights. Those end at 41px
   (trafficLightPosition y: 29 plus the 12px buttons), and the strip starts 4px
   in — the frame gutter plus the head tile's own border — so 42px leaves the
   wordmark a 5px margin and nothing above it is wasted. */
.sync-sidebar-drag {
  height: 42px;
  flex-basis: 42px;
}

.sync-sidebar-brand {
  height: 56px;
  flex-basis: 56px;
  gap: 10px;
  padding: 0 18px;
}

/* 40, not 42: the mark is a 20-unit grid, so an even multiple puts every cell on
   exactly 2 device pixels. At 42 the cells alternate 2px and 3px and the
   silhouette picks up the ragged edge the pixel art exists to avoid. The narrow
   breakpoints used to drop this to 38px, which has the same problem for the
   sake of two pixels, so they no longer override it. */
.sync-brand-logo {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  object-fit: contain;
}

/* Every mark is now the same 20-unit vector, and an SVG rasterises itself at
   its layout size — shape-rendering: crispEdges inside the file is what keeps
   the cells square. image-rendering only governs bitmap scaling, so the
   pixelated/auto split these marks used to need no longer applies to any of
   them. What still matters is the size: whole multiples of 20 only, which is
   set on each mark's own rule below. */
.sync-startup-mark img {
  width: 40px;
  height: 40px;
}

:root[data-theme="dark"] .sync-brand-logo,
:root[data-theme="dark"] .sync-sidebar-product-mark img,
:root[data-theme="dark"] .sync-startup-mark img {
  filter: brightness(0) invert(1);
}

/* The sidebar carries the app's voice, and the pixel face reads thin at its
   lighter weights — wordmark, nav, and section titles all sit at the top of
   the axis so the rail holds together as one block. */
.sync-sidebar-brand strong {
  color: var(--text-0);
  font-size: var(--type-3xl);
}

/* Shortening the head clips the nav, so it scrolls — no destination the handle
   pushes out of view becomes unreachable. */
.sync-primary-nav {
  position: relative;
  min-height: 0;
  overflow-y: auto;
  gap: 2px;
  padding: 6px 8px 8px;
  border-bottom: 0;
}

/* The gutter between the head tile and the section tiles replaces the painted
   rule that used to run into the frame edge at a square corner. */
.sync-primary-nav::after {
  display: none;
}

/* Fixed, not shrinkable: in a column flex the rows would otherwise squash as
   the head is shortened, so the nav would never scroll and the handle's floor —
   measured off one row — would drift as it moved. */
.sync-primary-nav button {
  height: 38px;
  flex: 0 0 auto;
  gap: 10px;
  padding: 0 11px;
  border: 1px solid transparent;
  border-radius: 5px;
  color: var(--text-0);
  font-size: var(--type-lg);
}

.sync-primary-nav button > svg {
  width: 18px;
  height: 18px;
}

.sync-primary-nav button:hover:not(:disabled) {
  border-color: var(--border);
  background: var(--bg-hover);
}

.sync-primary-nav button.active {
  border-color: var(--border-mid);
  background: var(--surface-row-active);
  box-shadow: none;
}

/* The badge holds a count, not a label, so it reads in the identifier face —
   and tabular figures keep it from resizing as the number climbs. */
.sidebar-nav-badge,
.sync-primary-nav button > .sync-activity-badge {
  min-width: 28px;
  padding: 2px 5px;
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  background: var(--surface-card);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
  line-height: var(--leading-flat);
}

.sync-sidebar-sections {
  overflow: visible;
  padding-top: 0;
  background: transparent;
}

/* All three panes are drag-sized rows of one split, each parted from the next
   by a handle straddling the gutter — so the tiles differ only in what they
   hold. The Catalog pane used to stand off a plain gutter margin instead,
   which put an identical 3px seam under a handle that answered to nothing. */
.sidebar-project-pane,
.sidebar-storage-pane,
.sidebar-catalog-pane {
  background: var(--bg-1);
}

.sidebar-settings-sections .sidebar-section-heading {
  min-height: 45px;
  padding: 8px 12px 4px 20px;
}

.sidebar-settings-sections .sidebar-section-title {
  color: var(--accent);
  font-size: var(--type-md);
  /* Whole pixels, so the uppercase label keeps its air without drifting the
     glyphs off the grid the way 0.04em (half a pixel) did. */
  letter-spacing: 1px;
  text-transform: uppercase;
}

.sidebar-section-action,
.sidebar-add-action {
  width: 28px;
  height: 28px;
  border-color: var(--button-border);
  border-radius: 4px;
  background: var(--button-bg);
  box-shadow: none;
}

.sidebar-profile-list,
.sidebar-settings-sections .sidebar-links-list {
  padding-right: 9px;
  padding-left: 9px;
}

.sidebar-profile-item {
  min-height: 39px;
  padding: 2px 4px 2px 10px;
  border: 1px solid transparent;
  border-radius: 4px;
}

.sidebar-profile-item:hover {
  border-color: var(--border);
  background: var(--bg-hover);
}

.sidebar-profile-item.active {
  border-color: var(--border-mid);
  background: var(--surface-row-active);
  box-shadow: none;
}

.sidebar-profile-main {
  gap: 10px;
}

.sidebar-profile-main span {
  font-family: var(--font-sans);
  color: currentColor;
  font-size: var(--type-md);
  font-weight: var(--weight-medium);
}

.sidebar-profile-main svg {
  color: var(--text-1);
}

.sidebar-profile-main > svg {
  width: 19px;
  height: 19px;
}

.sidebar-profile-actions button {
  border: 0;
  border-radius: 2px;
}

.sidebar-profile-actions .sidebar-profile-remove {
  opacity: 0;
  transition: opacity 80ms steps(1, end);
}

.sidebar-profile-item:hover .sidebar-profile-remove,
.sidebar-profile-item:focus-within .sidebar-profile-remove {
  opacity: 1;
}

.sidebar-profile-actions button:hover:not(:disabled) {
  background: var(--bg-hover);
}

/* Both resize handles straddle a real gutter now, so they only tint it on
   hover; the rounded tile corners keep the junction shape. */
.sidebar-section-divider {
  height: 9px;
  margin: -3px 0;
  align-self: center;
  background: transparent;
}

.sidebar-section-divider::before {
  display: none;
}

/* The head is a flex child of the rail rather than a row of the split, so this
   one has to cancel the two gutters flexbox puts either side of it: a 9px box
   with -6px margins collapses to a -3px margin box, which the surrounding 3px
   gaps restore to a single 3px seam with the handle centred on it. It must sit
   after the shared rule above to win the margin. */
.sidebar-head-divider {
  margin: -6px 0;
  flex: 0 0 auto;
  align-self: stretch;
}

.sidebar-section-divider::after {
  z-index: 3;
  top: 3px;
  right: var(--retro-panel-radius);
  left: var(--retro-panel-radius);
  width: auto;
  height: var(--retro-gutter);
  border-radius: 1px;
  background: transparent;
  box-shadow: none;
}

.sidebar-section-divider:hover::after,
.sidebar-section-divider:active::after,
.sidebar-section-divider:focus-visible::after,
.sidebar-settings-sections.resizing .sidebar-section-divider::after {
  background: var(--border-strong);
  box-shadow: none;
}

.sync-sidebar-resizer {
  width: 7px;
  margin-right: -2px;
  margin-left: -2px;
  flex: 0 0 7px;
  background: transparent;
}

.sync-sidebar-resizer::before {
  display: none;
}

.sync-sidebar-resizer::after {
  inset: var(--retro-panel-radius) auto var(--retro-panel-radius) 2px;
  width: var(--retro-gutter);
  border-radius: 1px;
  background: transparent;
}

.sync-titlebar {
  height: 52px;
  min-height: 52px;
  flex-basis: 52px;
  margin-bottom: var(--retro-gutter);
  padding-right: 10px;
  background: var(--bg-2);
}

/* The titlebar is one surface. The context used to sit on its own lighter
   panel, which ended mid-bar at a hard edge with no border — it read as a
   rendering seam rather than a divider. */
.sync-titlebar-context {
  min-width: 0;
  height: auto;
  gap: 17px;
  align-self: stretch;
  margin-left: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-0);
}

.sync-workspace > .sync-main {
  background: var(--bg-0);
}

.sync-titlebar-context > svg {
  width: 22px;
  height: 22px;
  color: var(--text-1);
}

.sync-titlebar-context strong {
  font-family: var(--font-sans);
  font-size: var(--type-lg);
  font-weight: var(--weight-semibold);
  letter-spacing: 0;
}

.sync-theme-button {
  width: 34px;
  height: 32px;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 3px;
  color: var(--accent);
}

.sync-theme-button > svg {
  flex: 0 0 auto;
}

.sync-titlebar-actions {
  gap: 2px;
}

/* Two peer icon buttons — the rule between them implied a grouping that is not
   there. */
.sync-titlebar-actions .storage-link-more {
  width: 34px;
  height: 32px;
  border: 0;
  border-radius: 3px;
  color: var(--accent);
}

.sync-sidebar-toggle {
  color: var(--text-2);
}

.sync-sidebar-product-mark {
  min-height: 44px;
  display: flex;
  overflow: hidden;
  align-items: center;
  flex: 0 0 auto;
  gap: 7px;
  padding: 6px 20px;
  background: var(--bg-1);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-variant-numeric: tabular-nums;
}

.sync-sidebar-product-mark img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

/* Project identity and storage control strip */

.sync-project-links-page {
  padding: 18px clamp(36px, 3.5vw, 58px) 52px clamp(30px, 2.8vw, 42px);
}

.sync-project-links-page .profile-links-section,
.sync-project-combined-page .profile-links-section {
  max-width: none;
}

.sync-project-workspace-page .profile-links-heading {
  margin-bottom: 16px;
  padding-bottom: 14px;
}

.sync-project-workspace-page.sync-project-combined-page .sync-combined-project-heading {
  min-height: 70px;
  margin-bottom: 10px;
  padding-bottom: 0;
}

.sync-project-combined-page .project-storage-group {
  margin-bottom: 6px;
  border: 1px solid var(--border-mid);
  border-radius: 6px;
  background: var(--surface-card);
  box-shadow: none;
}

.sync-project-workspace-page.sync-project-combined-page .profile-link-connections {
  padding-bottom: 4px;
}

.sync-project-combined-page .project-profile-storage-list .storage-link-block.selected {
  border: 0;
  border-radius: 5px;
  background: transparent;
  box-shadow: none;
}

.sync-project-combined-page .project-profile-storage-list .storage-link-block:last-child {
  border-bottom: 0;
}

/* ---- workspace path bar -------------------------------------------------
   The trail mixes all three faces on one line, so each crumb declares which
   one it is: a storage name, a repo name and a session title came out of the
   user's data and stay sans; a section name is a closed word and speaks pixel;
   the paths inside the menus are machine identifiers and stay mono. */
.sync-path-crumb {
  font-family: var(--font-sans);
  font-size: var(--type-md);
  font-weight: var(--weight-medium);
  letter-spacing: -0.01em;
}

.sync-path-crumb.section {
  /* One weight exists for the pixel face; hierarchy is size and colour. */
  font-size: var(--type-md);
  letter-spacing: 0;
}

.sync-path-separator {
  font-family: var(--font-mono);
  font-size: var(--type-md);
}

.sync-path-sync {
  font-size: var(--type-md);
  line-height: var(--leading-flat);
}

.sync-path-menu-label {
  font-size: var(--type-3xs);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}

.sync-path-menu-item {
  font-family: var(--font-sans);
  font-size: var(--type-sm);
}

.sync-path-menu-copy > small {
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
}

/* Paths keep the mono face above; a phrase — a bucket qualifier, an agent
   profile, a disabled reason — is prose, so it takes the clean face. */
.sync-path-menu-copy > small.phrase {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
}

/* The header block naming the menu's object, and the banner explaining a
   locked menu, speak alongside the items: the same clean face. */
.sync-path-menu-current {
  font-family: var(--font-sans);
  font-size: var(--type-sm);
}

.sync-path-menu-banner {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-snug);
}

.sync-path-rename label {
  font-size: var(--type-3xs);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.sync-path-rename input {
  font-family: var(--font-sans);
  font-size: var(--type-lg);
}

.sync-path-rename-error {
  font-size: var(--type-xs);
}

.sync-project-combined-page .storage-link-more {
  border: 1px solid var(--button-border);
  border-radius: 4px;
  background: var(--button-bg);
  box-shadow: none;
}

/* A byte readout is a measurement, not a label — it holds its width while the
   pixel word beside it keeps speaking in the app's voice. */
.sync-path-sync .sync-btn-readout,
.btn .sync-btn-readout {
  font-family: var(--font-mono);
  font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
}

.btn .sync-btn-name {
  font-family: var(--font-sans);
  font-weight: var(--weight-medium);
}

.storage-link-actions-menu,
.storage-link-menu,
.sync-history-branch-menu {
  border-color: var(--border-strong);
  border-radius: 5px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-popover);
}

.storage-link-actions-menu-item,
.sync-history-branch-option {
  border-radius: 3px;
}

/* Git and conversation history */

.sync-history-embedded {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.sync-project-combined-page .sync-history-embedded {
  margin-top: 0;
}

.sync-project-combined-page .sync-project-tab-panel .sync-history-embedded {
  padding-top: 0;
}

/* The mark, the name and the chevron read as one control — one pill hanging
   off the crumb it qualifies, sized to the crumbs beside it rather than to the
   toolbar it used to live in. */
.sync-history-branch-trigger {
  height: 26px;
  gap: 5px;
  border-radius: var(--r-pill);
  color: var(--text-0);
}

/* A branch name is an identifier: it gets typed, copied, and compared. */
.sync-history-branch-name {
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-semibold);
}

.sync-history-branch-state {
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  background: var(--surface-card);
  color: var(--accent);
}

/* Inside the trigger's own box the state is a label, not a second nested box. */
.sync-history-branch-trigger .sync-history-branch-state {
  border: 0;
  background: var(--chip-bg);
  color: var(--text-2);
}

.sync-history-icon-action {
  width: 30px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: 3px;
  color: var(--accent);
}

.sync-history-icon-action:hover:not(:disabled) {
  border-color: var(--border);
}

/* The path bar's refresh, on the same face as the list's icon actions — square
   corners, the accent mark, a border only on hover. */
.sync-path-icon-action {
  border-radius: 3px;
  color: var(--accent);
}

/* Counts and the attention tally are measurements: mono, tabular, holding
   their width as the numbers change, the same as every other figure here. */
.sync-path-count,
.sync-path-attention > b {
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
  font-weight: var(--weight-semibold);
}

/* `--r-pill` is 4px here: the skin squares everything off, and a stadium badge
   among 4px controls would be the only rounded thing on the row. */
.sync-path-attention,
.sync-path-count,
.session-detail-chip {
  border-radius: var(--r-pill);
}

/* The presence dot squares off with the rest of the skin. */
.sync-path-leaf-mark.active::after {
  border-radius: 1px;
}

.sync-path-attention {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
}

.sync-history-section-heading {
  margin: 18px 0 6px;
}

/* A pixel face needs a whole-pixel size and whole-pixel tracking; 12.5px and
   0.02em (a quarter pixel) both land glyph origins between pixels and smudge
   the blocks no matter what the smoothing setting is. */
.sync-history-section-heading h2 {
  font-size: var(--type-md);
}

/* The pixel face is for chrome. A name that came out of the user's data reads
   in the normal face even when a pixel-font label wraps it. Ordered after the
   heading so the carve-out wins on source order as well as specificity. */
.sync-history-section-heading h2 .sync-history-storage-name {
  font-family: var(--font-sans);
  font-weight: var(--weight-semibold);
}

/* Every list of session rows needs these, not just the timeline: the flat list
   a review renders for a non-git project, and the fold on a finished sync, both
   showed the icon glued to the title and a ragged icon column without them.
   Scoping to the list itself makes a session row self-sufficient wherever it
   renders; the sections below keep the same values for their own rows. */
.sync-history-thread-list,
.sync-history-timeline,
.sync-history-storage-only {
  /* Four slots: the provider-marked open button, terminal, the debug panel,
     and the transcript chevron. The last two moved up from line 2, where
     they sat stranded between readouts that can only be hovered. */
  --sync-history-row-actions-column: 148px;
  --sync-history-commit-actions-column: 26px;
  --sync-history-commit-date-column: 26ch;
  --sync-history-row-column-gap: 12px;
  --sync-history-row-icon-size: 18px;
  --sync-history-row-title-gap: 8px;
  /* Derived, not chosen: line 2 indents to exactly where the status badge ends,
     so the badge box and the indent can never drift apart. */
  --sync-history-row-text-offset: calc(
    var(--sync-history-row-icon-size) + var(--sync-history-row-title-gap)
  );
  --sync-history-row-anchor-y: 15px;
  --sync-history-rail-x: 8px;
  --sync-history-card-offset: 26px;
  position: relative;
}

.sync-history-content {
  container: sync-history-layout / inline-size;
}

.sync-history-timeline.has-uncommitted {
  padding-top: 12px;
}

.sync-history-uncommitted {
  position: relative;
  overflow: visible;
  margin: 0 0 10px var(--sync-history-card-offset);
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  background: var(--surface-row);
}

/* The rail stops 12px short of every fold and resumes 12px past it, so the 24px
   control sits in a gap the line never enters. That gap used to be an opaque
   plate on the button itself, and a plate cannot hold it: `opacity` on a
   disabled fold faded the plate away, hover swapped it for a translucent wash,
   and the line drew straight through both. The spine broke at the folds that
   could expand, ran through the ones that could not, and hovering any of them
   added a line that was not there a moment earlier. Geometry has no states.

   `bottom` is exactly -anchor because the pseudo is laid out against the
   padding box: this card's border, the 10px card gap and the next card's border
   already span the 12px the gap needs, so the anchor is all that is left. */
.sync-history-uncommitted::after {
  content: "";
  position: absolute;
  z-index: 1;
  top: calc(var(--sync-history-row-anchor-y) + 12px);
  bottom: calc(-1 * var(--sync-history-row-anchor-y));
  left: calc(var(--sync-history-rail-x) - var(--sync-history-card-offset));
  width: 1px;
  background: repeating-linear-gradient(
    to bottom,
    color-mix(in srgb, var(--border-mid) 78%, transparent) 0 4px,
    transparent 4px 8px
  );
  pointer-events: none;
}

/* The fold left the heading for the rail, so the bar is just the label now:
   one flex line, no actions column. */
.sync-history-uncommitted .sync-history-section-heading {
  min-height: 38px;
  display: flex;
  align-items: center;
  margin: 0;
  padding: 4px 12px;
  border-bottom: 1px solid var(--border-mid);
}

.sync-history-uncommitted.collapsed .sync-history-section-heading {
  border-bottom: 0;
}

.sync-history-uncommitted .sync-history-section-heading h2 {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sync-history-row-title-gap);
}

.sync-history-uncommitted .sync-history-section-heading h2 > svg {
  width: var(--sync-history-row-icon-size);
  height: var(--sync-history-row-icon-size);
  flex: 0 0 var(--sync-history-row-icon-size);
  color: var(--text-2);
}

.sync-history-uncommitted .sync-history-thread-list.flat {
  gap: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.sync-history-uncommitted .sync-history-thread-card {
  border: 0;
  border-radius: 0;
}

.sync-history-uncommitted .sync-history-thread-card + .sync-history-thread-card {
  border-top: 1px solid var(--border-mid);
}

/* `isolation` keeps the rail's own node and line stacking self-contained, but
   it also caps everything inside it — including the debug popover's z-index: 60
   — at the rail's own level in the timeline. With no z-index the rail sat at 0,
   so the uncommitted section's status badges (z-index 3) painted straight
   through an open popover. Rank the rail above them and the node marker (4). */
.sync-history-commit-rail {
  isolation: isolate;
  z-index: 5;
  gap: 0;
}

/* Deliberately no z-index. It opened a stacking context that trapped the debug
   popover below the following commit, and the obvious fix — raising the commit
   while the popover is open — repaints the subtree on every click, which
   visibly twitches the crisp-edged icons beside the trigger. Without a context
   here the popover's own z-index clears the following commits on its own, so
   nothing has to change when it opens. The rail node and connector keep their
   own z-indexes and still draw correctly. */
.sync-history-commit {
  position: relative;
  min-width: 0;
  margin: 0 0 10px var(--sync-history-card-offset);
  padding: 0;
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  background: var(--surface-row);
}

/* No :has() lift for an open debug popover. Toggling a z-index as the panel
   opens reorders — and so repaints — the whole subtree, which visibly twitches
   the crisp-edged icons sitting next to the trigger. The popover's own z-index
   already paints it above the following commit without any of that, verified
   by hit-testing three points through an overlapping commit. */

/* Fold to fold, on the same offsets as the dashed segment above. The commit
   below an Uncommitted group needs no special first-child reach: that group's
   own segment already runs down to this fold. */
.sync-history-commit::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: calc(var(--sync-history-row-anchor-y) + 12px);
  bottom: calc(-1 * var(--sync-history-row-anchor-y));
  left: calc(var(--sync-history-rail-x) - var(--sync-history-card-offset));
  width: 1px;
  background: var(--border-mid);
  pointer-events: none;
}

/* Every segment is a connector to the next commit, so the last one has nothing
   to draw and the rail ends at its fold. */
.sync-history-commit:last-child::before {
  display: none;
}

.sync-history-commit::after {
  display: none;
}

/* The fold control lives in the rail, where the node used to sit: one column
   for every fold on the page — group headings and commits alike — and outside
   the card, so neither a review's checkbox nor an outcome banner can move it.
   24px hit area (WCAG 2.5.8) centred on the rail x, and the rail yields exactly
   that box — the 12px above matches the 12px each segment stops short by. The
   background stays transparent: nothing is behind it to hide, and an opaque
   plate here would only mask a rail that had drifted back into the gap. */
.sync-history-spine-fold {
  position: absolute;
  z-index: 6;
  top: calc(var(--sync-history-row-anchor-y) - 12px);
  left: calc(var(--sync-history-rail-x) - var(--sync-history-card-offset) - 12px);
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  box-shadow: none;
  color: var(--text-2);
}

.sync-history-spine-fold:hover:not(:disabled),
.sync-history-spine-fold:focus-visible {
  border-color: var(--border);
  background: var(--bg-hover);
  color: var(--text-0);
}

.sync-history-spine-fold:disabled {
  opacity: 0.35;
}

.sync-history-commit-heading,
.sync-history-thread-card {
  min-width: 0;
  min-height: 48px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--sync-history-row-actions-column);
  grid-template-areas:
    "title actions"
    "meta meta";
  align-items: center;
  gap: 3px var(--sync-history-row-column-gap);
  padding: 6px 12px 7px;
  background: transparent;
}

/* The commit fold lives in the rail, so the heading carries no actions
   column: subject on line 1, identifier-then-stamp on line 2 (narrow) or the
   same line (wide), with the stamp closing the row at the card edge. */
.sync-history-commit-heading {
  position: relative;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "title"
    "meta";
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

.sync-history-commit-heading:has(+ .sync-history-thread-list) {
  border-bottom: 1px solid var(--border-mid);
}

.sync-history-commit-title,
.sync-history-thread-title {
  min-width: 0;
  display: flex;
  grid-area: title;
  align-items: center;
  gap: var(--sync-history-row-title-gap);
}

/* The fallback is load-bearing, not decoration. Only the timeline and the
   storage-only section define the row token; the flat lists a review renders
   for a non-git project do not. Without it the width/flex declarations are
   invalid there, the slot shrink-wraps whatever glyph it holds, and swapping
   one status icon for another — which is what selecting a row does — resizes
   the slot and shifts every following item in the row. Pin the box so the
   swap stays paint-only. */
.sync-history-commit-icon,
.sync-history-thread-title > .sync-thread-sync-indicator,
.sync-history-thread-title > .sync-thread-sync-error {
  position: relative;
  z-index: 3;
  width: var(--sync-history-row-icon-size, 18px);
  height: var(--sync-history-row-icon-size, 18px);
  display: inline-grid;
  place-items: center;
  flex: 0 0 var(--sync-history-row-icon-size, 18px);
  border-radius: 2px;
  line-height: 0;
}

/* That z-index opens a stacking context, so the badge's tooltip — whatever its
   own z-index — cannot rise above the badge of the row beneath it. Lift the
   whole badge while it is hovered or focused so its tooltip clears the rows. */
.sync-history-thread-title > .sync-thread-sync-indicator:hover,
.sync-history-thread-title > .sync-thread-sync-indicator:focus-visible,
.sync-history-thread-title > .sync-thread-sync-error:hover,
.sync-history-thread-title > .sync-thread-sync-error:focus-visible {
  z-index: 46;
}

/* Most timeline glyphs use a 24px grid at an exact 2:1 downscale. Status
   badges stay at their native 24px size so the selected pixel coin remains
   crisp and immediately distinguishable. */
.sync-history-commit-icon {
  color: var(--text-2);
}

.sync-history-commit-icon > svg,
.sync-history-commit-link > svg,
.sync-history-thread-title > .sync-thread-sync-error > svg,
.sync-history-thread-meta > span > svg,
.sync-history-debug-trigger > svg {
  width: 12px;
  height: 12px;
}

/* The badge fills the shared row-icon slot. Note that slot is 18px, which is
   0.75 of the 24-unit art: the 1-unit steps land on a whole device pixel in
   some places and nothing in others, so the coin edge reads as dashed rather
   than solid. Only whole ratios (12px, 24px, 48px) render the ring cleanly. */
.sync-history-thread-title > .sync-thread-sync-indicator > svg {
  width: var(--sync-history-row-icon-size, 18px);
  height: var(--sync-history-row-icon-size, 18px);
}

.sync-history-commit-title > strong,
.sync-history-thread-title > strong {
  min-width: 0;
  overflow: hidden;
  flex: 1;
  color: var(--text-0);
  font-family: var(--font-sans);
  font-size: var(--type-sm);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-snug);
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* The subject is the row's headline: one size step above the session titles
   nested underneath it, and free to use every pixel the metadata does not.
   The step used to be weight as well, but 650 and 600 were never drawn apart. */
.sync-history-commit-title > strong {
  font-size: var(--type-md);
}

.sync-history-commit-meta,
.sync-history-session-details {
  min-width: 0;
  grid-area: meta;
  padding-left: var(--sync-history-row-text-offset);
}

/* Identifier first, stamp last, right-packed: the stamp holds the row's
   right edge so it forms one column with the session stamps below. When the
   meta drops under the subject (narrow), it indents into the shared text
   column instead of leading the line from the card edge. */
.sync-history-commit-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-left: var(--sync-history-row-text-offset);
  overflow: hidden;
}

.sync-history-commit-meta > time {
  min-width: 0;
  overflow: hidden;
  flex: 0 1 auto;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-snug);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sync-history-commit-meta > code,
.sync-history-commit-meta > .sync-history-commit-link {
  width: auto;
  flex: 0 0 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Only the link wears the chip: the border is the affordance — it says
   "opens the commit on GitHub" — so a commit with no remote gets the same
   bare mono the thread ids use, not a box with nothing behind it. */
.sync-history-commit-link > code {
  min-width: 7ch;
  display: inline-block;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface-subtle);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-snug);
  letter-spacing: 0;
  text-align: center;
}

.sync-history-commit-meta > code {
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-snug);
  letter-spacing: 0;
}

.sync-history-commit-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 3px;
  color: var(--text-2);
  text-decoration: none;
}

.sync-history-commit-link > svg {
  flex: 0 0 auto;
}

/* One hover surface: the glyph brightens with the chip, so the pair reads
   as a single target. */
.sync-history-commit-link:hover,
.sync-history-commit-link:focus-visible {
  color: var(--text-0);
}

.sync-history-commit-link:hover code,
.sync-history-commit-link:focus-visible code {
  border-color: var(--border-strong);
  background: var(--surface-row-active);
  color: var(--text-0);
}

.sync-history-thread-actions {
  width: var(--sync-history-row-actions-column);
  display: flex;
  grid-area: actions;
  align-items: center;
  justify-content: flex-end;
  justify-self: end;
}

/* The shared fold control: the completed sync's banner and the storage card's
   repository rows both wear it. */
.sync-history-commit-toggle {
  width: var(--sync-history-commit-actions-column);
  min-width: var(--sync-history-commit-actions-column);
  height: var(--sync-history-commit-actions-column);
  display: inline-grid;
  place-items: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--text-3);
}

.sync-history-commit-toggle:hover:not(:disabled),
.sync-history-commit-toggle:focus-visible {
  border-color: var(--border);
  background: var(--bg-hover);
  color: var(--text-1);
}

.sync-history-commit > .sync-history-thread-list {
  position: relative;
  gap: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.sync-history-commit > .sync-history-thread-list::after {
  display: none;
}

.sync-history-thread-list.flat {
  gap: 5px;
}

.sync-history-thread-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-row);
  box-shadow: none;
}

.sync-history-thread-topline {
  display: contents;
}

.sync-history-session-details {
  display: grid;
  gap: 6px;
}

.sync-history-session-summary,
.sync-history-thread-meta {
  min-width: 0;
}

.sync-history-session-summary {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
}

/* No overflow clipping on this chain: the metric tooltips are pseudo-elements
   that sit above their metric, so any clipping ancestor renders them invisible
   — all that showed was a 1px sliver at the clip edge. The row is kept on one
   line by letting the timestamp truncate instead. */
.sync-history-thread-meta {
  flex-wrap: nowrap;
}

.sync-history-thread-time {
  min-width: 0;
  flex: 0 1 auto;
}

.sync-history-thread-time time {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sync-history-thread-card:hover {
  border-color: var(--border-mid);
  background: var(--surface-row-hover);
  transform: none;
}

.sync-history-commit > .sync-history-thread-list > .sync-history-thread-card {
  border: 0;
  border-radius: 0;
}

.sync-history-commit > .sync-history-thread-list > .sync-history-thread-card + .sync-history-thread-card {
  border-top: 1px solid var(--border-mid);
}

/* These cards cannot clip (the rail node and its connector live outside them),
   so the last row would paint its square background over the card's rounded
   bottom border. Give it the matching inner radius instead. */
.sync-history-commit > .sync-history-thread-list > .sync-history-thread-card:last-child,
.sync-history-uncommitted .sync-history-thread-card:last-child {
  border-radius: 0 0 3px 3px;
}

.sync-history-commit > .sync-history-thread-list .sync-thread-sync-indicator,
.sync-history-commit > .sync-history-thread-list .sync-thread-sync-error {
  background: transparent;
  box-shadow: none;
}

.sync-history-commit > .sync-history-thread-list .sync-history-thread-card:hover .sync-thread-sync-indicator,
.sync-history-commit > .sync-history-thread-list .sync-history-thread-card:hover .sync-thread-sync-error {
  background: transparent;
  box-shadow: none;
}

.sync-history-stored-thread {
  grid-template-areas:
    "title title"
    "meta meta";
}

/* Storage-only threads are one group, framed and hairline-separated like the
   Uncommitted group and the commit cards, rather than five floating rows. */
.sync-history-storage-only {
  position: relative;
  /* Visible, like the Uncommitted group: the rows carry status tooltips that
     must escape the frame. The rows are transparent, so the group's own
     rounded background is what shows at the corners. */
  overflow: visible;
  /* Top margin so the frame clears the tab strip above it rather than butting
     into it; the left inset matches the timeline cards, so this group's fold
     lands in the same rail column as every other fold on the page. */
  margin: 12px 0 12px var(--sync-history-card-offset);
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  background: var(--surface-row);
}

/* The fold left the heading for the rail, so the bar is just the label. */
.sync-history-storage-only .sync-history-section-heading {
  min-height: 38px;
  display: flex;
  align-items: center;
  margin: 0;
  padding: 4px 12px;
  border-bottom: 1px solid var(--border-mid);
}

/* Folded, the heading is the whole group — its bottom rule would draw a hairline
   with nothing under it. */
.sync-history-storage-only.collapsed .sync-history-section-heading {
  border-bottom: 0;
}

.sync-history-storage-only .sync-history-section-heading h2 {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sync-history-row-title-gap);
}

.sync-history-storage-only .sync-history-section-heading h2 > svg {
  width: var(--sync-history-row-icon-size);
  height: var(--sync-history-row-icon-size);
  flex: 0 0 var(--sync-history-row-icon-size);
  color: var(--text-2);
}

.sync-history-storage-only .sync-history-thread-list.flat {
  gap: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.sync-history-storage-only .sync-history-thread-card {
  border: 0;
  border-radius: 0;
  background: transparent;
}

.sync-history-storage-only .sync-history-thread-card + .sync-history-thread-card {
  border-top: 1px solid var(--border-mid);
}

/* A stored thread reads like the completed sync's rows: title on line 1, the
   whole thread id on line 2 with the stamp at the far edge. The id is bare
   monospace — a box here would mean "target", and the sha chip has already
   spent that signal on a link — and it never shrinks or truncates: a partial
   id is worse than none, so when the line runs out the stamp wraps under it
   instead. */
.sync-history-stored-thread-meta {
  min-width: 0;
  display: flex;
  grid-area: meta;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px 14px;
  padding-left: var(--sync-history-row-text-offset);
}

.sync-history-stored-thread-meta > time {
  margin-left: auto;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-snug);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  white-space: nowrap;
}

.sync-history-stored-thread-id {
  flex: 0 0 auto;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-snug);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  white-space: nowrap;
}

/* Inline inside the blockified flex item, so one click selects the whole id
   with no trailing newline. */
.sync-history-stored-thread-id > code {
  font: inherit;
  cursor: text;
  -webkit-user-select: all;
  user-select: all;
}

/* The completed sync's list prints the same id three rows away; one size for
   both, on the whole-pixel scale. */
.sync-outcome-threads .sync-outcome-threadid {
  font-size: var(--type-xs);
}

.sync-history-thread-meta {
  gap: 4px 10px;
  font-size: var(--type-xs);
}

/* The range wrapper made the two time spans grandchildren, so they also need
   the icon/label layout the direct children get. */
.sync-history-thread-meta > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* A translucent block is a smudge, not a pixel. The metrics are held back with
   colour instead, so every block stays solid at its own value. */
.sync-history-thread-metric svg {
  opacity: 1;
  color: var(--text-3);
}

.sync-history-thread-time > svg {
  opacity: 1;
}

.sync-history-thread-time time {
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
}

/* Counts and metrics form columns down the list, so they read as identifiers
   and hold their width as the numbers change. */
.sync-history-thread-meta b,
.sync-history-heading-count {
  font-family: var(--font-mono);
  font-size: var(--type-xs);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
}

/* The context strip is mostly paths; the repository name beside them is not. */
.sync-history-context-item > span {
  font-family: var(--font-mono);
  font-size: var(--type-xs);
}

.sync-history-context-item > .sync-history-context-name {
  font-family: var(--font-sans);
}

/* Sentences read in the clean face even when the app wrote them. */
.sync-history-state,
.sync-history-continuity-copy > span,
.sync-history-detail-state {
  font-family: var(--font-sans);
  line-height: var(--leading-prose);
}

/* Built as one string in TS and delivered through content: attr(), so it can
   only ever carry one face. It is a descriptive phrase, so it takes the sans. */
.sync-history-thread-metric::after {
  font-family: var(--font-sans);
  font-size: var(--type-2xs);
  font-variant-numeric: tabular-nums;
}

/* The stamp is the last thing on the line, pushed to the far edge so it forms
   an unbroken column down the list; the readouts and the two row buttons keep
   their content width on the left. */
.sync-history-session-summary > .sync-history-thread-time-end {
  margin-left: auto;
  padding-left: 14px;
}

.sync-history-thread-duration b {
  font-variant-numeric: tabular-nums;
}

.sync-history-thread-actions {
  gap: 7px;
}

/* The inert provider mark takes the same box as a real launch button so the
   cluster keeps one width whether or not the row can be opened — the right edge
   of every row is a column, not a ragged margin. */
.sync-history-thread-actions .sync-history-launch-action,
.sync-history-thread-actions .sync-history-provider-inert,
.session-detail-launch {
  width: 22px;
  min-width: 22px;
  min-height: 24px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  box-shadow: none;
  color: var(--accent);
}

/* The launch trio is the row's way out — hovering one reads as a pressed
   pixel button, not a faint tint: engaged surface, full-strength glyph, and a
   1px inset ring standing in for a border. The session header's launch pair
   is the same cluster one level up, so it presses the same way. */
.sync-history-thread-actions .sync-history-launch-action:hover:not(:disabled),
.session-detail-launch:hover:not(:disabled) {
  background: var(--surface-row-active);
  color: var(--text-0);
  box-shadow: inset 0 0 0 1px var(--border-mid);
}

.sync-history-debug-trigger {
  border: 0;
  border-radius: 2px;
  background: transparent;
  box-shadow: none;
  color: var(--text-3);
}

/* Every menu and panel in the base sheet opens with a keyframe animation that
   slides and scales it in. Animating a transform promotes the element to its
   own compositing layer for the duration, and creating that layer
   re-rasterises the text and icons around it — which is the twitch that shows
   up in neighbouring elements the moment one opens. This skin is stepped and
   pixel-crisp rather than eased, so the reveals are dropped outright instead
   of being softened. Same reason the tooltips are unanimated. */
.sync-history-branch-menu,
.storage-link-menu,
.storage-link-actions-menu,
.sync-inline-new-project.sync-profile-picker-dialog,
.sync-combined-settings-panel,
.profile-link-card,
.sync-project-tab-panel,
.sync-capability-details {
  animation: none;
}

/* Rotating a chevron through a transition promotes it to its own compositing
   layer for the duration of the animation, and creating that layer
   re-rasterises the text and icons around it — which is the twitch that shows
   up in neighbouring elements when a menu or disclosure opens. The rotation
   still happens; it just lands immediately instead of being animated. Same
   reason the status and metric tooltips are unanimated. */
.sync-history-branch-chevron,
.sync-capability-chevron,
.log-type-filter > summary svg,
.sync-resource-details > summary > svg,
.exclusion-summary::before {
  transition: color 120ms ease;
}

/* The retro press shifts a button a pixel while it is held. That reads as
   tactile on a full-size button with a label, but an icon-only button has no
   text to anchor the eye, so the glyph just jogs against whatever sits beside
   it. Every icon-only clicker keeps the colour feedback and drops the
   displacement; labelled buttons keep the press. */
.sync-history-thread-actions .sync-history-launch-action:active:not(:disabled),
.session-detail-launch:active:not(:disabled),
.sync-history-debug-trigger:active:not(:disabled),
.sync-history-commit-toggle:active:not(:disabled),
.sync-history-spine-fold:active:not(:disabled),
.sync-history-icon-action:active:not(:disabled),
.sync-history-debug-copy:active:not(:disabled),
.sidebar-profile-actions button:active:not(:disabled),
.sidebar-section-action:active:not(:disabled),
.sync-inline-action-close:active:not(:disabled),
.log-panel-actions .btn:active:not(:disabled),
.sync-modal-header .btn:active:not(:disabled),
.sync-inline-action-header .btn:active:not(:disabled) {
  transform: none;
}

.sync-history-thread-card:hover .sync-history-launch-action,
.sync-history-thread-card:hover .sync-history-debug-trigger {
  color: var(--text-1);
}

.sync-history-thread-actions .sync-history-launch-action + .sync-history-launch-action {
  margin-left: 0;
}

@container sync-history-layout (min-width: 700px) {
  /* The storage-only group sits outside the timeline but its fold rides the
     same anchor, so both scopes take the wide value together. */
  .sync-history-timeline,
  .sync-history-storage-only {
    --sync-history-row-anchor-y: 19px;
  }

  /* Subject and meta share the line; the stamp closes it at the card edge,
     forming one column with the session and cloud stamps below. The 13px on
     the meta's own padding keeps the subject 18px clear of the identifier. */
  .sync-history-commit-heading {
    min-height: 38px;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title meta";
    column-gap: 5px;
    row-gap: 0;
    padding: 4px 12px;
  }

  .sync-history-commit-meta {
    justify-content: flex-end;
    padding-left: 13px;
  }

  .sync-history-commit-meta > time {
    min-width: var(--sync-history-commit-date-column);
  }

  .sync-history-thread-card {
    min-height: 52px;
    grid-template-columns: minmax(0, 1fr) var(--sync-history-row-actions-column);
    grid-template-areas:
      "title actions"
      "meta meta";
    column-gap: var(--sync-history-row-column-gap);
    row-gap: 2px;
    padding: 5px 12px 6px;
  }

  .sync-history-session-details {
    padding-left: var(--sync-history-row-text-offset);
    gap: 0;
  }

  .sync-history-session-summary {
    gap: 5px;
  }

  .sync-history-stored-thread {
    min-height: 52px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "title"
      "meta";
    row-gap: 2px;
  }
}

.sync-history-debug-popover,
.sync-thread-sync-indicator::after,
.sync-thread-sync-error::after,
.sync-history-thread-metric::after {
  border-color: var(--border-strong);
  border-radius: 4px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-popover);
}

.sync-history-older-group,
.sync-history-older-inert {
  border-color: var(--border-mid);
  border-radius: 4px;
}

.sync-history-debug-popover,
.sync-thread-sync-indicator::after,
.sync-thread-sync-error::after,
.sync-history-thread-metric::after {
  border-color: var(--border-strong);
  border-radius: 4px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-popover);
}

.sync-history-older-group,
.sync-history-older-inert {
  border-color: var(--border-mid);
  border-radius: 4px;
}

.sync-pull-outcome li {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* Setup, storage, review, and resource surfaces */

.sync-storage-card,
.sync-resource-group,
.sync-storage-details-panel,
.sync-storage-repositories,
.sync-storage-index-list,
.sync-project-files-panel {
  border-color: var(--border-mid);
  border-radius: 5px;
  background: var(--surface-card);
  box-shadow: 1px 1px 0 color-mix(in srgb, var(--border-strong) 13%, transparent);
}

.sync-storage-card > header,
.sync-resource-group-header,
.sync-storage-repositories-heading,
.sync-r2-guide {
  border-bottom-color: var(--border);
  background: var(--surface-subtle);
}

.sync-resource-row,
.sync-pull-item,
.sync-project-file-row,
.sync-storage-repository-row,
.sync-storage-index-row {
  border-color: var(--border);
  background: var(--surface-row);
}

.sync-resource-row:hover,
.sync-pull-item:hover,
.sync-project-file-row:hover,
.sync-storage-repository-row:hover,
.sync-storage-index-row:hover:not(:disabled) {
  background: var(--surface-row-hover);
}

/* Selection reads from the checkbox and the row tint; no accent bar. */
.sync-resource-row.selected,
.sync-pull-item.selected,
.sync-project-file-row.selected,
.sync-sync-selectable-row.selected {
  border-color: var(--border-strong);
  background: var(--surface-row-active);
}

.sync-callout,
.sync-binding-safety,
.conversation-path-repair-notice {
  border-radius: 4px;
  box-shadow: none;
}

/* App.css leaves this at 11.5px, a fractional legacy size that is on no step
   of the scale. */
.sync-callout {
  font-size: var(--type-sm);
}

.sync-callout.error {
  border-color: color-mix(in srgb, var(--red) 45%, var(--border));
}

.sync-callout.warning {
  border-color: color-mix(in srgb, var(--yellow) 45%, var(--border));
}

.sync-agent-choice,
.sync-segmented,
/* These tabs are an underline strip, not a segmented control. They used to be
   given both at once: a raised pill here on aria-selected, and the 2px
   underline App.css draws on .active. The pill also inherited the underline
   design's 2px side padding, so it closed to within two pixels of the label and
   read as a box clipping the text. The segmented treatment belongs to
   .sync-segmented and .sync-agent-choice, which are actual segmented controls;
   this strip keeps the underline and just takes the theme's border colour. */
.sync-project-tabs {
  border-color: var(--border-mid);
}

/* A tab is a click target, not a text run — 2px of padding gave it no edge to
   hover and left the active state hugging the glyphs. */
.sync-project-tabs > button {
  padding: 0 10px;
}

.sync-agent-choice button,
.sync-segmented button,
.sync-divergence-choice button {
  border-radius: 3px;
}

.sync-agent-choice button.active,
.sync-segmented button.active,
.sync-divergence-choice button.active {
  background: var(--surface-card);
  box-shadow: 1px 1px 0 color-mix(in srgb, var(--border-strong) 18%, transparent);
  color: var(--accent);
}

/* Project setup workspace
   ---------------------------------------------------------------------------
   A stack of hairline-ruled bands on one capped column; App.css owns that
   structure. What this block owns is the page's voice: section names and
   field labels in the pixel face, values in the reading faces, the platform
   selects rebuilt as app controls, and the circular radios squared to match
   the rest of the skin.
*/

.sync-setup-section > .sync-card-heading strong {
  color: var(--text-0);
  font-size: var(--type-md);
}

/* The line under a heading is a sentence the app wrote, not chrome. */
.sync-setup-section > .sync-card-heading > div > span {
  color: var(--text-2);
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-snug);
}

/* Field names take the log-policy labels' pairing: 10px, whole-pixel air. */
.sync-setup-workspace .sync-field-grid label > span {
  color: var(--text-2);
  font-size: var(--type-2xs);
  letter-spacing: 1px;
}

/* The last native macOS widgets in the app: a platform select paints its own
   rounded stepper, which no border or background rule reaches. Same fix as
   the log policy fields — a flat box and the app's own chevron, masked so it
   takes currentColor and follows the palette without a second asset. */
.sync-select-shell > select {
  appearance: none;
  padding: 0 30px 0 10px;
  font-size: var(--type-sm);
  cursor: pointer;
}

.sync-select-shell::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 10px;
  width: 12px;
  height: 12px;
  margin-top: -6px;
  background: currentColor;
  color: var(--text-3);
  pointer-events: none;
  -webkit-mask: var(--retro-chevron-down) center / 12px 12px no-repeat;
  mask: var(--retro-chevron-down) center / 12px 12px no-repeat;
}

/* One 32px control height; values in the reading faces at whole sizes. */
.sync-setup-workspace .sync-field-grid input {
  height: 32px;
  padding: 0 10px;
  font-size: var(--type-sm);
}

/* A path is a machine identifier even while it is read-only. */
.sync-setup-workspace .sync-field-grid input[readonly] {
  font-family: var(--font-mono);
}

.sync-setup-workspace .sync-agent-profile-row select,
.sync-setup-workspace .sync-agent-profile-row input {
  font-size: var(--type-sm);
}

.sync-setup-workspace .sync-agent-choice {
  padding: 2px;
  gap: 2px;
  border-radius: 5px;
}

.sync-setup-workspace .sync-agent-choice button strong {
  font-size: var(--type-sm);
}

/* The repository picker in the theme's own selection language: border and
   row tint, no accent bar — and square radios. 15px circles with a 7px round
   dot were the only circular geometry left in a skin built from square
   blocks, at a size where a clean circle cannot be drawn anyway. */
.sync-setup-workspace .sync-bundle-match-options {
  border-color: var(--border-mid);
  border-radius: 4px;
  background: var(--surface-row);
}

.sync-setup-workspace .sync-bundle-match-option {
  min-height: 44px;
  padding: 7px 10px;
  gap: 9px;
}

.sync-setup-workspace .sync-bundle-match-option.active {
  background: var(--surface-row-active);
  box-shadow: none;
}

.sync-setup-workspace .sync-bundle-radio {
  width: 14px;
  height: 14px;
  flex: 0 0 14px;
  border-color: var(--border-strong);
  border-radius: 2px;
}

.sync-setup-workspace .active > .sync-bundle-radio {
  border-color: var(--text-0);
}

.sync-setup-workspace .active > .sync-bundle-radio > span {
  width: 6px;
  height: 6px;
  border-radius: 0;
  background: var(--text-0);
}

.sync-setup-workspace .sync-bundle-match-copy strong {
  font-size: var(--type-sm);
}

/* The id under the name is data at the floor size, not decoration: it must
   hold 4.5:1 on the selected row's tint as well as the rest one. */
.sync-setup-workspace .sync-bundle-match-copy span {
  color: var(--text-2);
  font-size: var(--type-2xs);
}

/* A stamp is a machine value: mono, tabular, holding its column while the
   list refreshes. */
.sync-setup-workspace .sync-bundle-match-meta {
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
  font-variant-numeric: tabular-nums;
}

/* The acknowledge row borders in the callout family's warning mix; its
   sentence is prose in the reading face. */
.sync-setup-acknowledge {
  border-color: color-mix(in srgb, var(--yellow) 45%, var(--border));
}

.sync-setup-acknowledge > span {
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-snug);
}

/* Error sentences, hints, and the save state are prose, at whole sizes. */
.sync-setup-field-error {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-snug);
}

.sync-setup-hint,
.sync-setup-inline-status,
.sync-setup-save-state {
  font-family: var(--font-sans);
  font-size: var(--type-2xs);
}

/* Disabled at 0.38 opacity left the primary action a ghost that read as a
   rendering fault rather than as "not yet". An inert fill with a legible
   label says the same thing and stays visible. */
.sync-setup-footer .btn-primary:disabled {
  opacity: 1;
  border-color: var(--border-mid);
  background: var(--surface-subtle);
  color: var(--text-3);
}

.sync-sync-review-header,
.sync-inline-action-header {
  border-bottom-color: var(--border-mid);
  background: var(--surface-subtle);
}

.sync-pull-apply-bar,
.sync-modal-footer {
  border-color: var(--border-mid);
  background: var(--surface-footer);
}

/* The review table is content, not a footer bar. Tinting the whole block made
   the banner inside it disappear into its own background and merged the table
   with the real footer below into one slab. The panel surface shows through;
   the only tinted things left are the banner and the footer, which is what
   makes each of them read as a distinct band. */

.sync-sync-review-stepper button,
.sync-sync-review-tabs button {
  border-radius: 3px;
}

.sync-folder-field,
.sync-storage-checks label {
  border-color: var(--border-mid);
  border-radius: 4px;
  background: var(--surface-row);
}

.sync-result-summary,
.sync-fact-grid,
.sync-scope-strip,
.sync-project-summary {
  border-color: var(--border-mid);
  border-radius: 4px;
}

/* Logs, menus, dialogs, and transient states */

.sync-log-drawer,
.log-drawer {
  margin-top: 0;
  border: 0;
  background: var(--bg-1);
  box-shadow: none;
  transition:
    height 180ms ease,
    margin-top 180ms ease;
}

/* Open: a tile in its own right, separated from the workspace by the gutter.
   Closed: zero height, zero border, zero gutter — nothing left to see. */
.sync-log-drawer.open {
  overflow: visible;
  margin-top: var(--retro-gutter);
  padding-top: 0;
}

.sync-log-drawer .log-resizer {
  top: calc(-1px - var(--retro-gutter) - 1px);
  height: 9px;
}

.sync-log-drawer .log-resizer::before {
  display: none;
}

.sync-log-drawer .log-resizer::after {
  top: 0;
  right: var(--retro-panel-radius);
  left: var(--retro-panel-radius);
  height: var(--retro-gutter);
  border-radius: 1px;
  background: transparent;
}

.sync-log-drawer .log-resizer:hover::after,
.sync-log-drawer .log-resizer:active::after,
.sync-workspace.resizing-log .sync-log-drawer .log-resizer::after {
  background: var(--border-strong);
}

.sync-log-drawer.open::before,
.sync-log-drawer.open::after {
  display: none;
}

/* The drawer paints its own rounded background; the panel stays transparent so
   nothing squares off the corners, and only the scroll body needs clipping. */
.sync-log-drawer .log-panel {
  overflow: visible;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.sync-log-drawer .log-panel-body {
  border-radius: 0 0 var(--retro-panel-radius-inner) var(--retro-panel-radius-inner);
}

.sync-log-drawer .log-panel-header {
  padding-right: 16px;
  padding-left: 16px;
}

.log-filter-control select {
  box-shadow: none;
}

.log-header,
.log-toolbar {
  border-bottom-color: var(--border-mid);
  background: var(--surface-footer);
}

/* A log line is a container of three categories, not one: a stamp, a type
   label, and a message. Each child picks its own face. */
.log-line,
.log-entry {
  border-bottom-color: var(--border);
}

.log-line:hover,
.log-entry:hover {
  background: var(--surface-row-hover);
}

.log-ts {
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
  font-variant-numeric: tabular-nums;
}

.log-type {
  font-size: var(--type-3xs);
  letter-spacing: 1px;
}

.log-msg {
  font-family: var(--font-sans);
  font-size: var(--type-sm);
  line-height: var(--leading-snug);
}

/* A sentence that ends in a backend error is still a sentence. */
.log-empty,
.log-empty.log-load-error {
  font-family: var(--font-sans);
  font-size: var(--type-sm);
  line-height: var(--leading-prose);
}

.log-panel-title {
  font-size: var(--type-xs);
  letter-spacing: 1px;
}

.log-type-filter-key,
.log-filter-control > span,
.log-type-filter-value {
  font-size: var(--type-2xs);
}

/* Anything that can hold what you typed reads in the clean face, placeholder
   included — a control must not change face as you type into it. */
.log-search-control input {
  font-family: var(--font-sans);
  font-size: var(--type-2xs);
}

.sync-modal-backdrop {
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.2) 0,
      rgba(0, 0, 0, 0.2) 1px,
      rgba(0, 0, 0, 0.13) 1px,
      rgba(0, 0, 0, 0.13) 3px
    );
}

.sync-modal {
  border-color: var(--border-strong);
  border-radius: 7px;
  background: var(--surface-popover);
  box-shadow: var(--shadow-overlay);
}

.sync-modal-header {
  border-bottom-color: var(--border-mid);
  background: var(--surface-subtle);
}

/* 0.02em is a quarter pixel at this size — the same off-grid tracking the
   section headings had to drop. 800 was outside the face's 400-700 axis. */
.sync-modal-header h1 {
  font-size: var(--type-2xl);
}

.sync-modal-header p {
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-prose);
}

/* A path inside a sentence is still a path. Tight side padding so the chip does
   not push the sentence's full stop away from it. */
.sync-modal-header p code {
  padding: 1px 3px;
  margin-right: -1px;
  border-radius: 3px;
  background: var(--chip-bg);
  color: var(--text-1);
  font-family: var(--font-mono);
  font-size: var(--type-2xs);
}

/* Log manager
   ---------------------------------------------------------------------------
   The two policy controls were the last native macOS widgets in the app: a
   platform select paints its own rounded stepper, which no amount of border
   and background styling reaches. They are rebuilt here as ordinary boxes with
   the app's own pixel chevron, so the dialog stops mixing two design languages.
*/

.sync-log-storage-summary {
  padding: 2px 0 4px;
  border-bottom-color: var(--border-mid);
  gap: 16px;
}

/* Measured values are identifiers: they get the figure face, and tabular
   figures so the three columns hold still while a cleanup runs. */
.sync-log-storage-summary dd {
  font-family: var(--font-mono);
  font-size: var(--type-lg);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
}

/* 0.04em is a third of a pixel at 9px. */
.sync-log-storage-summary dt {
  font-size: var(--type-3xs);
  font-weight: var(--weight-regular);
  letter-spacing: 1px;
}

.sync-log-policy-fields {
  gap: 16px;
}

.sync-log-policy-fields label {
  position: relative;
  gap: 7px;
}

/* The field name speaks in the app's voice, like every other chrome label; the
   face itself comes from the single pixel rule near the top of this file. */
.sync-log-policy-fields label > span {
  font-size: var(--type-2xs);
  color: var(--text-2);
}

.sync-log-policy-fields select {
  appearance: none;
  min-height: 32px;
  padding: 0 30px 0 10px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: var(--type-sm);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

/* The app's own chevron-down geometry, masked so it takes currentColor and
   therefore follows the theme instead of needing a second dark-mode asset. */
.sync-log-policy-fields label::after {
  content: "";
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 12px;
  height: 12px;
  background: currentColor;
  color: var(--text-3);
  pointer-events: none;
  -webkit-mask: var(--retro-chevron-down) center / 12px 12px no-repeat;
  mask: var(--retro-chevron-down) center / 12px 12px no-repeat;
}

.sync-log-policy-fields label:has(select:disabled)::after {
  opacity: 0.4;
}

.sync-log-cleanup-actions {
  gap: 8px;
}

.sync-log-manager-notice {
  font-family: var(--font-sans);
  line-height: var(--leading-prose);
}

.sync-notice,
.sync-backend-banner {
  border-color: var(--border-mid);
  background: var(--surface-card);
  box-shadow: 2px 2px 0 color-mix(in srgb, var(--border-strong) 14%, transparent);
}

/* The toast was the last 8px corner in a 4px app, and its 10.5px text sat off
   the whole-pixel scale. The rail replaces the tinted border App.css used to
   carry the tone: one solid edge, read before the words are. */
.sync-notice {
  overflow: hidden;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: var(--type-xs);
  line-height: var(--leading-snug);
}

/* Positioned, not a stretched flex item: `align-self: stretch` spans only the
   content box, so the toast's 5px of vertical padding left the rail floating
   short of both edges. The toast is already absolute, so this anchors to it;
   `overflow: hidden` trims the square end to the 4px corner. */
.sync-notice::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--green);
}

.sync-notice.is-attention::before {
  background: var(--yellow);
}

.sync-notice.is-attention > svg {
  color: var(--yellow);
}

/* Nothing in this skin eases between states, and the reveals, chevrons,
   tooltips and button presses above were each dropped for the same reason:
   a transitioning element is promoted to its own compositing layer for the
   duration, and everything around it re-rasterises against that layer's
   origin. Text and icons drawn unsmoothed and crisp-edged land on whole
   pixels, so a layer origin half a pixel off the page grid flips them — the
   screen appears to flicker even though nothing moves, which is precisely how
   it measures: zero geometry change across every element on the page. Ticking
   one checkbox was animating its border, its fill, its tick transform and the
   row tint, four promotions at once.
   This is the rule those one-off drops were converging on, so it replaces the
   game of finding them individually: states land at once, everywhere.
   Animations are untouched — spinners and the startup pulse still run, and
   they are continuous rather than triggered by a state change. If some surface
   ever wants easing back, give it a `transition` after this rule. */
.sync-app *,
.sync-app *::before,
.sync-app *::after {
  transition: none;

   that, and it is the one the pointer is on when the flicker shows: its border
   and fill eased over 130ms while the tick mark scaled through a transform —
   the single worst promoter of the four. Repeating the base sheet's own
   selectors matches its specificity, and this sheet loads second. */
.sync-sync-row-choice input,
.sync-sync-review-workspace .sync-resource-select input,

<pre id="out"></pre>
<script>
const probes = [
  ["p-select","select in log-policy",["outline-style","outline-width","outline-color","background-color","border-color","min-height","font-size"]],
  ["p-input","form-input",["outline-style","background-color","border-color","font-size"]],
  ["p-logsearch","log-search input",["outline-style","outline-width","border-color","font-size"]],
  ["p-menuitem","menu item",["outline-style","background-color","min-height","font-size"]],
  ["p-branch","branch option",["outline-style","background-color","min-height"]],
  ["p-treetoggle","tree toggle",["width","height","min-width","min-height"]],
  ["p-dismiss","notice dismiss",["width","height"]],
  ["p-filesstate","files-sync-state",["white-space","text-overflow","overflow-x","max-width"]],
  ["p-btn","btn",["min-height","height","font-size","font-weight","border-radius"]],
];
function dump(theme){
  document.documentElement.dataset.theme = theme;
  let s = "\n##### THEME=" + theme + " #####\n";
  const rs = getComputedStyle(document.documentElement);
  for (const t of ["--focus-ring","--input-bg","--border","--border-strong","--surface-card","--bg-hover"])
    s += "  token " + t.padEnd(16) + " = '" + rs.getPropertyValue(t).trim() + "'\n";
  for (const [id,label,props] of probes){
    const el = document.getElementById(id);
    const cs = getComputedStyle(el);
    s += "  " + label.padEnd(22) + " " + props.map(p=>p+"="+cs.getPropertyValue(p)).join("  ") + "\n";
  }
  return s;
}
document.getElementById("out").textContent = dump("dark") + dump("light");
</script>
