<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session-detail “when” chip — live specimen</title>
    <style>
      /* Page chrome only. Everything inside .sync-app is the shipped skin. */
      /* App.css pins html/body/#root to 100% with overflow hidden for the
         Tauri shell; a specimen is a document and needs to scroll. Vite injects
         the imported stylesheet after this block, so these have to out-specify
         it rather than merely follow it. */
      html:root { height: auto; overflow: visible; }
      :root > body { height: auto; min-height: 100%; overflow: visible; }
      body > #root { height: auto; overflow: visible; }
      body { margin: 0; background: var(--bg-0, #14110d); color: var(--text-1, #ccc); }
      .specimen-page { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 34px;
        font-family: var(--font, system-ui); }
      .specimen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
        border-bottom: 1px solid var(--border, #333); padding-bottom: 18px; }
      .specimen-head h1 { margin: 0 0 6px; font-size: 20px; color: var(--text-0); }
      .specimen-head p { margin: 0; font-size: 13px; color: var(--text-2); max-width: 62ch; line-height: 1.5; }
      .specimen-controls { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
      section > h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
        color: var(--text-2); font-weight: 400; }
      .specimen-lead { margin: 0 0 16px; font-size: 13px; color: var(--text-2); max-width: 74ch; line-height: 1.5; }
      /* A wide table scrolls inside its own box; the page never does. */
      .specimen-scroll { overflow-x: auto; padding-bottom: 4px; }
      .specimen-table { border-collapse: collapse; font-size: 12.5px; }
      .specimen-chip + .specimen-chip { margin-left: 8px; padding-left: 8px;
        border-left: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
      .specimen-table th { text-align: left; padding: 6px 16px 8px 0; font-weight: 500; color: var(--text-2);
        border-bottom: 1px solid var(--border); white-space: nowrap; }
      .specimen-table td { padding: 7px 16px 7px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent); vertical-align: top; }
      .specimen-note { color: var(--text-3); white-space: nowrap; }
      .specimen-cell span { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-1); white-space: nowrap; }
      .specimen-cell.was span { color: var(--text-3); }
      .specimen-cell em { display: block; margin-top: 2px; font-size: 11px; font-style: normal; color: var(--text-3); white-space: nowrap; }
      .specimen-frames { display: flex; flex-direction: column; gap: 22px; max-width: 100%; }
      .specimen-frame-label { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; font-size: 12px; }
      .specimen-frame-label b { color: var(--text-0); }
      .specimen-frame-label span { color: var(--text-3); }
      .specimen-surface { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 2px; background: var(--surface-1, transparent); }
      .specimen-surface .session-detail-header { margin-bottom: 0; }
      .specimen-picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
      .specimen-picker button { padding: 4px 9px; border: 1px solid var(--border); border-radius: 4px;
        background: transparent; color: var(--text-2); font-size: 11.5px; cursor: pointer; }
      .specimen-picker button.on { border-color: var(--accent); color: var(--text-0); }
      .specimen-cell b { color: var(--text-0); }
      .specimen-day:first-child .session-detail-day-divider { margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/timestamp-options.tsx"></script>
  </body>
</html>
