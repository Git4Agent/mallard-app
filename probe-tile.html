<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="/src/App.css">
<style>body{padding:40px;background:var(--bg);}</style>
</head>
<body>
<div class="sync-project-files-page">
  <!-- REVIEW page shape: flat list inside the tile -->
  <div class="sync-project-file-tile" id="reviewTile">
    <div class="sync-project-file-tile-head"><strong>Project root</strong><small>3 files</small></div>
    <div class="sync-history-thread-list flat" id="reviewList">
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>alpha.ts</strong></div></div>
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>beta.ts</strong></div></div>
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>gamma.ts</strong></div></div>
    </div>
  </div>
  <div style="height:24px"></div>
  <!-- ACTIVITY page shape: plain list inside the tile -->
  <div class="sync-project-file-tile" id="actTile">
    <div class="sync-project-file-tile-head"><strong>Project root</strong><small>3 files</small></div>
    <div class="sync-history-thread-list" id="actList">
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>alpha.ts</strong></div></div>
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>beta.ts</strong></div></div>
      <div class="sync-history-thread-card"><div class="sync-history-thread-title"><strong>gamma.ts</strong></div></div>
    </div>
  </div>
</div>
</body></html>
