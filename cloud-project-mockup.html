<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project from a Mallard Cloud link — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1560px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 980px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-seg:disabled { opacity: 0.4; cursor: default; }
      .spec-h2 { margin: 6px 0 0; font: 700 16px/1.3 system-ui; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel ul, .spec-panel ol { margin: 4px 0 0 18px; display: grid; gap: 3px; }
      .spec-panel code, .spec-table code { font-family: var(--font-mono); font-size: 11.5px; }
      .spec-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(680px, 1fr)); gap: 20px; align-items: start; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; max-width: 760px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); }
      .spec-frame .sync-main { height: auto !important; overflow: visible !important; }
      .spec-then { margin-top: 12px; }
      .spec-then > p { margin: 0 0 6px; color: var(--text-2); font-size: 12px; }
      .spec-na { margin: 24px; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 10px; color: var(--text-2); }

      /* Flow strip: three ways to the same end, step counts in the margin. */
      .spec-flows { display: grid; gap: 10px; }
      .spec-flow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: start; }
      .spec-flow-name { font-weight: 700; }
      .spec-flow-name small { display: block; color: var(--text-3); font-weight: 500; }
      .spec-flow ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: s; }
      .spec-flow li { counter-increment: s; display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px 4px 6px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-0); }
      .spec-flow li::before { content: counter(s); min-width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--text-0); color: var(--bg-0); font: 700 11px/1 system-ui; }
      .spec-flow li.manual { border-style: dashed; color: var(--text-2); }
      .spec-flow li.new { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

      .spec-table { width: 100%; border-collapse: collapse; }
      .spec-table th, .spec-table td { padding: 7px 9px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .spec-table th { color: var(--text-2); font-weight: 600; font-size: 12px; border-top: 0; }
      .spec-table td:first-child { white-space: nowrap; font-weight: 600; }
      .spec-table a { color: inherit; }
      .spec-pick { border-color: var(--accent); }

      /* ——— proposed app CSS ————————————————————————————————————— */
      /* Location: parent and name side by side, the full path under both —
         GitKraken's "Where to clone to" + "Full path", JetBrains' Directory. */
      .cpm-location { max-width: var(--sync-setup-column); display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; align-items: end; }
      .cpm-location .sync-folder-field { margin: 0; }
      .cpm-location + .sync-setup-path-hint { max-width: var(--sync-setup-column); }
      .cpm-field-note { color: var(--text-3); font-size: var(--type-2xs); }
      .cpm-aside-link { justify-self: start; font-size: var(--type-xs); }
      .sync-setup-path-hint > .btn-link { margin-left: 8px; }
      /* The agents a new project binds, read off the draft's defaults. */
      .cpm-agents { max-width: var(--sync-setup-column); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
      .cpm-agents .sync-storage-repo-chip { display: inline-flex; align-items: center; gap: 5px; }
      .cpm-agents .r2-select-shell { width: 220px; }
      /* A band's content column, so found rows and lists keep the field's measure. */
      .cpm-measure { max-width: var(--sync-setup-column); display: grid; gap: 8px; }
      /* The connect dialog's found-row wrap (facts under the name), for the
         band's measure and the lane too. */
      .cpm-measure .storage-found-row.with-verb,
      .cpm-card .storage-found-row.with-verb { grid-template-columns: 26px minmax(0, 1fr) auto; row-gap: 6px; }
      .cpm-measure .storage-found-row.with-verb > .sync-storage-repository-icon,
      .cpm-card .storage-found-row.with-verb > .sync-storage-repository-icon { grid-row: 1; grid-column: 1; }
      .cpm-measure .storage-found-row.with-verb > .storage-found-text,
      .cpm-card .storage-found-row.with-verb > .storage-found-text { grid-row: 1; grid-column: 2; }
      .cpm-measure .storage-found-row.with-verb > .storage-found-facts,
      .cpm-card .storage-found-row.with-verb > .storage-found-facts { grid-row: 2; grid-column: 2 / -1; justify-content: flex-start; }
      .cpm-measure .storage-found-row.with-verb > .storage-found-facts:empty,
      .cpm-card .storage-found-row.with-verb > .storage-found-facts:empty { display: none; }
      .cpm-measure .storage-found-row.with-verb > .storage-found-verb,
      .cpm-card .storage-found-row.with-verb > .storage-found-verb { grid-row: 1; grid-column: 3; }
      .cpm-list-head { color: var(--text-1); font-size: var(--type-xs); font-weight: var(--weight-semibold); }
      .cpm-list-head small { margin-left: 6px; color: var(--text-3); font-weight: var(--weight-regular); }
      .cpm-signin { padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
      .cpm-signin strong { color: var(--text-0); }
      .cpm-signin span { flex: 1 1 260px; color: var(--text-2); font-size: var(--type-xs); }
      /* The Projects card under the settled storage (direction A). */
      .cpm-card { margin-top: 14px; }
      .cpm-card-title { flex: 1; min-width: 0; color: var(--text-0); font-family: var(--font-display); font-size: var(--type-lg); font-weight: var(--weight-bold); }
      .cpm-card .r2-lane { flex-wrap: wrap; }
      .cpm-card .r2-step-body > .sync-folder-field { flex: 1 0 100%; margin: 2px 0 0; }
      .cpm-card .r2-step-body > .sync-setup-path-hint { flex: 1 0 100%; margin: 0; }
      .cpm-card .r2-step-body > .cpm-measure { flex: 1 0 100%; max-width: none; }
      .cpm-parent-input { width: 180px; }
      /* The command a failed step hands over, in the diagnostics sheet's grammar. */
      .cpm-command { flex: 1 0 100%; }
      .cpm-command .feishu-setup-diagnostics-sheet { margin-top: 2px; }
      .cpm-command-label { display: block; margin-top: 2px; color: var(--text-2); font-size: var(--type-2xs); }
      /* Direction C: the sheet, drawn open in the frame over a stand-in backdrop. */
      .cpm-stage { min-height: 560px; padding: 28px 16px; display: grid; place-items: start center; background: color-mix(in srgb, var(--text-0) 8%, var(--bg-0)); }
      dialog.cpm-dialog { position: relative; inset: auto; margin: 0; }
      .cpm-dialog .sync-modal-body { display: grid; gap: 12px; }
      .cpm-dialog .sync-segmented { justify-self: start; }
      .cpm-dialog .cpm-location, .cpm-dialog .cpm-measure, .cpm-dialog .cpm-location + .sync-setup-path-hint { max-width: none; }
      .cpm-dialog .sync-modal-footer > .cpm-agents { max-width: none; margin-left: 0; }
      .cpm-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--text-2); font-size: var(--type-xs); }
      .cpm-summary code { color: var(--text-0); font-family: var(--font-mono); font-size: var(--type-xs); }
      .cpm-dialog .r2-steps { margin: 0; }
      /* The prefilled setup page, drawn small beside the hand-off. */
      .cpm-setup-mini { max-width: 760px; }
      .cpm-setup-mini .sync-setup-section { padding-top: 10px; padding-bottom: 10px; }
      .cpm-setup-row { max-width: var(--sync-setup-column); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--text-1); font-size: var(--type-sm); }
      .cpm-setup-row code { font-family: var(--font-mono); font-size: var(--type-xs); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cloud-project-mockup.tsx"></script>
  </body>
</html>
