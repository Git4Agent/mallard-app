<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Push review — directions</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1700px; margin: 0 auto; padding: 16px 20px 80px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1040px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title em { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); font: 600 11px/1.4 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-0); font-family: var(--font-sans); }
      .spec-frame .sync-main { height: auto !important; min-height: 0; overflow: visible !important; }
      .spec-frame.narrow .sync-project-links-page { padding-right: 18px; padding-left: 18px; }
      .spec-grid { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: start; }
      /* The review's scroll caps at a share of the viewport, which is 0 in a
         hidden pane; the specimen never needs the cap. */
      .spec .sync-sync-review-scroll { max-height: none; overflow: visible; }

      /* ——— proposed app CSS (mock-only) ———————————————————————————
         Scoped under .spec: App.css is injected after this sheet, so an
         unscoped rule would lose every tie. */

      /* A, B, C · a footer that also states facts. The facts lead the row
         and the gauge and button keep the trailing edge they have today. */
      .spec .mk-foot-facts {
        min-width: 0;
        margin-right: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* One fact, as a chip: the session page's own fact chip, restated here
         because that rule lives under the session page. */
      .spec .mk-fact {
        height: 22px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px;
        border: 1px solid var(--border);
        color: var(--text-1);
        font-size: var(--type-xs);
        line-height: 1;
        white-space: nowrap;
      }
      .spec .mk-fact > svg { color: var(--text-3); }
      .spec .mk-foot-commit {
        flex: 0 0 auto;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .spec .mk-foot-commit > .btn { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
      .spec .mk-fact > b { color: var(--text-0); font-weight: var(--weight-semibold); }
      .spec .mk-fact.off { color: var(--text-3); }

      /* A · shipped (2026-10-02): the frame mounts `SessionPushReview` on the
         shipped CSS and needs no rule here. */

      /* B · what travels, as a ledger whose rows add up to the gauge. */
      .spec .mk-pack {
        margin: 12px 4px 14px;
        border: var(--box-border);
        border-radius: 14px;
        background: var(--surface-card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .spec .mk-pack-head {
        min-height: 44px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 9px;
        border-bottom: 2px solid var(--text-0);
        background: var(--surface-subtle);
      }
      .spec .mk-pack-head > strong {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        color: var(--text-0);
        font-size: var(--type-md);
        font-weight: var(--weight-semibold);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .spec .mk-pack-head > time {
        flex: 0 0 auto;
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: var(--type-xs);
      }
      .spec .mk-pack-rows { margin: 0; }
      .spec .mk-pack-rows > div {
        min-height: 34px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spec .mk-pack-rows > div + div { border-top: 1px solid var(--border); }
      .spec .mk-pack-rows dt {
        min-width: 0;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-1);
        font-size: var(--type-sm);
      }
      .spec .mk-pack-rows dt > svg { flex: 0 0 auto; color: var(--text-3); }
      .spec .mk-pack-rows dd {
        margin: 0;
        color: var(--text-0);
        font-family: var(--font-mono);
        font-size: var(--type-xs);
        font-variant-numeric: tabular-nums;
      }
      .spec .mk-pack-rows > .off dt,
      .spec .mk-pack-rows > .off dd { color: var(--text-3); }

      /* C · the header is the session; there is no body. The status mark and
         the provider mark sit on the title's line, as they do on its row. */
      .spec .mk-c .sync-sync-review-title { align-items: center; gap: 8px; }
      .spec .mk-c .sync-sync-review-title > h2 {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .spec .mk-c .mk-c-provider { flex: 0 0 auto; display: inline-flex; color: var(--text-2); }
      .spec .mk-c > .sync-inline-action-header { border-bottom-color: transparent; }

      /* D · the review docks on the session page, above its fact strip. It
         is the review's own header carrying the footer's cluster: the page's
         crumb already names the session, and the transcript under it is the
         body. It takes the card frame the storage card gives the review on
         the project page. */
      .spec .mk-d-dock { margin: 0 0 14px; container: mk-d-dock / inline-size; }
      /* At the minimum window the facts take a row and the commit cluster
         the next, instead of the title clipping to nothing beside it. */
      @container mk-d-dock (max-width: 560px) {
        .spec .mk-d .sync-sync-review-title { flex: 1 0 100%; }
      }
      .spec .mk-d {
        border: var(--box-border);
        border-radius: 14px;
        background: var(--surface-card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .spec .mk-d > .sync-inline-action-header { flex-wrap: wrap; row-gap: 6px; border-bottom: 0; }
      .spec .mk-d .sync-sync-review-title { align-items: center; }
      .spec .mk-d .sync-push-resource-actions { margin-left: 0; }
      .spec .mk-d-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .spec .mk-d-end > .btn-primary { min-width: 132px; min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .spec .mk-d .sync-review-budget-sentence,
      .spec .mk-d .mk-d-note { flex: 1 0 100%; order: 2; margin: 0; text-align: right; }
      .spec .mk-d-note { color: var(--text-2); font-size: var(--type-2xs); }

      /* The session page under D, at rest behind the dock. */
      .spec .mk-session-events { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/single-push-mockup.tsx"></script>
  </body>
</html>
