name: Release macOS and Windows apps

# A pushed v* tag builds, signs, notarizes, verifies, and attaches every
# artifact to one draft GitHub Release. Manual dispatch is a dry run: the same
# build and verification, but artifacts go to the workflow run instead of a
# release, so signing problems never consume a version tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_macos:
    name: macOS Apple Silicon
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name == 'push'
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Run frontend integration tests
        run: npm run test:frontend-integration

      - name: Test release configuration
        run: npm run test:release-config

      - name: Test packaged CLI behavior
        run: npm run test:cli

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "The App Store Connect API key secret is not set." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, notarize, and upload release draft
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MALLARD_VERIFY_MACOS_BUNDLE: "1"
          MALLARD_REQUIRE_TRUSTED_MACOS: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mallard ${{ github.ref_name }}"
          releaseBody: "Apple Silicon and Intel macOS DMGs (Developer ID signed and notarized) and an x64 Windows installer (unsigned). Verify every artifact before publishing this draft."
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: >-
            --target aarch64-apple-darwin
            --bundles dmg

      - name: Build and notarize (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MALLARD_VERIFY_MACOS_BUNDLE: "1"
          MALLARD_REQUIRE_TRUSTED_MACOS: "1"
        run: >-
          npm run tauri build --
          --target aarch64-apple-darwin
          --bundles dmg

      - name: Upload dry-run DMG to the workflow run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish_macos_intel:
    name: macOS Intel
    needs: publish_macos
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: x86_64-apple-darwin

      # The verifier runs the packaged x86_64 CLI on this Apple Silicon host.
      - name: Ensure Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name == 'push'
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Test packaged CLI behavior
        run: npm run test:cli

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "The App Store Connect API key secret is not set." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize Intel DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MALLARD_VERIFY_MACOS_BUNDLE: "1"
          MALLARD_REQUIRE_TRUSTED_MACOS: "1"
        run: >-
          npm run tauri build --
          --target x86_64-apple-darwin
          --bundles dmg

      - name: Upload verified Intel DMG to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Refusing to upload the Intel DMG to a published release." >&2
            exit 1
          fi
          dmgs=(target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one Intel DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${dmgs[0]}" --repo "$GITHUB_REPOSITORY"

      - name: Upload dry-run Intel DMG to the workflow run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish_windows:
    name: Windows x64
    needs: publish_macos
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name == 'push'
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Test Windows CLI behavior
        run: npm run test:cli

      - name: Build Windows NSIS installer
        run: >-
          npm run tauri build --
          --target x86_64-pc-windows-msvc
          --bundles nsis

      - name: Verify installed Windows CLI
        id: verify_windows
        shell: pwsh
        run: >-
          ./scripts/verify-windows-bundle.ps1
          -BundleDirectory "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          -TemporaryRoot "$env:RUNNER_TEMP"
          -GitHubOutputPath "$env:GITHUB_OUTPUT"

      - name: Upload verified Windows installer to draft
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.verify_windows.outputs.installer_path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Refusing to upload the Windows installer to a published release."
          }
          gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading the verified Windows installer failed."
          }

      - name: Upload dry-run installer to the workflow run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: ${{ steps.verify_windows.outputs.installer_path }}
          if-no-files-found: error
