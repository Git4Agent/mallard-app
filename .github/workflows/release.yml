name: Release macOS and Windows apps

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_macos:
    name: macOS Apple Silicon
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Run frontend integration tests
        run: npm run test:frontend-integration

      - name: Test release configuration
        run: npm run test:release-config

      - name: Test packaged CLI behavior
        run: npm run test:cli

      - name: Build and upload release draft
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MALLARD_VERIFY_MACOS_BUNDLE: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mallard ${{ github.ref_name }}"
          releaseBody: "Tester builds for Apple Silicon macOS and x64 Windows. The macOS app is ad-hoc signed and unnotarized; the Windows installer is unsigned. Verify both artifacts before publishing this draft."
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: >-
            --target aarch64-apple-darwin
            --bundles dmg

  publish_windows:
    name: Windows x64
    needs: publish_macos
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Test Windows CLI behavior
        run: npm run test:cli

      - name: Build Windows NSIS installer
        run: >-
          npm run tauri build --
          --target x86_64-pc-windows-msvc
          --bundles nsis

      - name: Verify installed Windows CLI
        id: verify_windows
        shell: pwsh
        run: >-
          ./scripts/verify-windows-bundle.ps1
          -BundleDirectory "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          -TemporaryRoot "$env:RUNNER_TEMP"
          -GitHubOutputPath "$env:GITHUB_OUTPUT"

      - name: Upload verified Windows installer to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.verify_windows.outputs.installer_path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Refusing to upload the Windows installer to a published release."
          }
          gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading the verified Windows installer failed."
          }
