<!doctype html>
<!-- Specimen: the Projects landing when no project is selected — direction B
     (project picker), rendered from config-only data: name, location, and
     the cheap adornments the binding already carries. No scans, no counts.
     Links the real /src/App.css; only the .landing-* / .proj-card classes are new. -->
<html data-theme="light" data-empty="no" data-detail="cheap">
<head>
<meta charset="utf-8">
<title>Projects landing specimen</title>
<link rel="stylesheet" href="/src/App.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--retro-frame-gutter); }
  .spec-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--bg-3); border-bottom: 1px solid var(--border); font-family: var(--font-display); font-size: 13px; }
  .spec-bar .lbl { color: var(--text-2); margin-right: 4px; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
  .spec-bar .gap { width: 14px; }
  .shell { flex: 1; min-height: 0; display: flex; padding: var(--retro-gutter) var(--retro-gutter-x); gap: var(--retro-gutter-x); }
  .sidebar { width: 236px; flex: 0 0 236px; display: flex; flex-direction: column; gap: var(--retro-gutter); }
  .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--retro-gutter); }
  .sync-titlebar { display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; font-family: var(--font-display); font-weight: 500; font-size: var(--type-md); }
  .sync-titlebar .tail { margin-left: auto; display: flex; gap: 6px; }
  .sync-main { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 28px; }
  .side-tile { padding: 12px 12px 10px; }
  .side-tile .head { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); padding: 2px 4px 8px; }
  .side-tile .head .add { margin-left: auto; }
  .side-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 2px solid transparent; border-radius: 10px; font-size: var(--type-md); color: var(--text-1); }
  .side-row svg { width: 15px; height: 15px; flex: 0 0 auto; }
  [data-empty="yes"] .side-row { display: none; }
  .side-empty { display: none; padding: 10px; border: 1px dashed var(--border-mid); border-radius: var(--retro-panel-radius); color: var(--text-2); font-size: var(--type-sm); }
  [data-empty="yes"] .side-empty { display: flex; gap: 8px; align-items: center; }
  .only-empty { display: none; } .only-filled { display: block; }
  [data-empty="yes"] .only-empty { display: block; } [data-empty="yes"] .only-filled { display: none; }

  /* ── the picker ─────────────────────────────────────────────── */
  .picker-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .picker-head h1 { font-family: var(--font-display); font-weight: var(--weight-heavy); font-size: var(--type-xl); color: var(--text-0); margin: 0; }
  .picker-head .cnt { color: var(--text-3); font-family: var(--font-mono); font-size: var(--type-xs); }
  .picker-head .btn { margin-left: auto; }
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .proj-card { display: flex; flex-direction: column; gap: 6px; padding: 13px 16px 12px; border: var(--box-border); border-radius: var(--retro-panel-radius); background: var(--surface-row); box-shadow: var(--shadow-card); cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .proj-card:hover { background: var(--surface-row-hover); }
  .proj-card:active { box-shadow: none; transform: translate(1px, 1px); }
  .proj-card .top { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .proj-card .top > svg { width: 17px; height: 17px; color: var(--text-2); flex: 0 0 auto; }
  .proj-card .name { font-family: var(--font-display); font-weight: var(--weight-bold); font-size: var(--type-lg); color: var(--text-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-card .marks { margin-left: auto; display: flex; gap: 8px; color: var(--text-2); }
  .proj-card .marks svg { width: 14px; height: 14px; }
  .proj-card .path { font-family: var(--font-mono); font-size: var(--type-2xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the one cheap line: which storage the binding links to — from config */
  .proj-card .store { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-family: var(--font-display); font-size: 11px; letter-spacing: .04em; color: var(--text-2); }
  .proj-card .store svg { width: 13px; height: 13px; }
  .proj-card .store.none { color: var(--text-3); }
  [data-detail="minimal"] .marks, [data-detail="minimal"] .store { display: none; }

  /* ── no projects ────────────────────────────────────────────── */
  .landing-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 64px 20px 10px; }
  .landing-mark { width: 72px; height: 72px; display: grid; place-items: center; border: var(--box-border); border-radius: 22px; background: var(--surface-card); box-shadow: var(--shadow-card); }
  .landing-mark img { width: 44px; height: 44px; image-rendering: pixelated; }
  [data-theme="dark"] .landing-mark img { filter: brightness(0) invert(1); }
  .landing-hero h1 { font-family: var(--font-display); font-weight: var(--weight-heavy); font-size: var(--type-2xl); color: var(--text-0); margin: 6px 0 0; }
  .landing-actions { display: flex; gap: 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="spec-bar">
  <span class="lbl">State</span>
  <button class="btn" data-set="empty" data-val="no">Has projects</button>
  <button class="btn" data-set="empty" data-val="yes">No projects</button>
  <span class="gap"></span>
  <span class="lbl">Card detail</span>
  <button class="btn" data-set="detail" data-val="cheap">Config-only extras</button>
  <button class="btn" data-set="detail" data-val="minimal">Name + location</button>
  <span class="gap"></span>
  <button class="btn btn-ghost" id="theme">Theme</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3V6Z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-proj" viewBox="0 0 24 24"><path d="M3 5h8l2 2h8v12H3V5Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12h6M7 15h4" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-claude" viewBox="0 0 24 24"><path d="M12 12L10.1 1.5L13.9 1.5Z M12 12L22.5 10.1L22.5 13.9Z M12 12L13.9 22.5L10.1 22.5Z M12 12L1.5 13.9L1.5 10.1Z M12 12L4.6 3.2L7.4 1.6Z M12 12L19.4 3.2L16.6 1.6Z M12 12L19.4 20.8L16.6 22.4Z M12 12L4.6 20.8L7.4 22.4Z" fill="currentColor"/></symbol>
  <symbol id="i-codex" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/></symbol>
</defs></svg>

<div class="shell sync-app" style="height:auto;">
  <aside class="sidebar">
    <div class="sync-sidebar-head" style="padding:14px 12px 10px;background:var(--bg-1);">
      <div style="display:flex;align-items:center;gap:10px;padding:2px 6px 14px;"><img src="/mallard-logo-duck.svg" width="30" height="30" style="image-rendering:pixelated" alt=""><strong class="sync-sidebar-brand" style="font-family:var(--font-display);font-weight:800;font-size:22px;">Mallard</strong></div>
      <nav class="sync-primary-nav" style="display:flex;flex-direction:column;gap:2px;">
        <button type="button" class="active"><svg><use href="#i-folder"/></svg>Projects</button>
        <button type="button"><svg><use href="#i-proj"/></svg>Catalog</button>
        <button type="button"><svg><use href="#i-archive"/></svg>Storages</button>
      </nav>
    </div>
    <div class="sync-sidebar-head side-tile" style="flex:1;background:var(--bg-1);">
      <div class="head">Projects <span class="sidebar-section-count only-filled" style="margin-left:0;">6</span><button class="sidebar-section-action sidebar-add-action add" type="button"><svg width="14" height="14"><use href="#i-plus"/></svg></button></div>
      <div class="side-row"><svg><use href="#i-proj"/></svg>mallard-app (Claude)</div>
      <div class="side-row"><svg><use href="#i-proj"/></svg>mallardInternal</div>
      <div class="side-row"><svg><use href="#i-proj"/></svg>HorrorGame</div>
      <div class="side-row"><svg><use href="#i-folder"/></svg>testProjectNonGit</div>
      <div class="side-empty"><svg width="15" height="15"><use href="#i-plus"/></svg>Add your first project</div>
    </div>
    <div class="sync-sidebar-head side-tile" style="background:var(--bg-1);">
      <div class="head">Storages <button class="sidebar-section-action sidebar-add-action add" type="button"><svg width="14" height="14"><use href="#i-plus"/></svg></button></div>
      <div class="side-row"><svg><use href="#i-archive"/></svg>Local storage 1</div>
    </div>
  </aside>

  <div class="workspace">
    <div class="sync-titlebar"><svg width="17" height="17"><use href="#i-folder"/></svg>Projects
      <span class="tail"><button class="sync-path-icon-action" type="button"><svg width="15" height="15"><use href="#i-sun"/></svg></button><button class="sync-path-more" type="button"><svg width="15" height="15"><use href="#i-dots"/></svg></button></span>
    </div>
    <main class="sync-main">

      <section class="only-filled">
        <div class="picker-head"><h1>Projects</h1><span class="cnt">6 on this machine</span><button class="btn btn-primary" type="button"><svg width="13" height="13"><use href="#i-plus"/></svg>Add project…</button></div>
        <div class="picker-grid">
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-proj"/></svg><span class="name">mallard-app (Claude)</span><span class="marks"><svg><use href="#i-claude"/></svg><svg><use href="#i-codex"/></svg></span></div><div class="path">~/Desktop/project/mallard-app</div><div class="store"><svg><use href="#i-archive"/></svg>Local storage 1</div></button>
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-proj"/></svg><span class="name">mallardInternal</span><span class="marks"><svg><use href="#i-codex"/></svg></span></div><div class="path">~/Desktop/project/mallardInternal</div><div class="store"><svg><use href="#i-archive"/></svg>Local storage 1</div></button>
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-proj"/></svg><span class="name">HorrorGame</span><span class="marks"><svg><use href="#i-claude"/></svg></span></div><div class="path">~/Desktop/project/HorrorGame</div><div class="store"><svg><use href="#i-archive"/></svg>Local storage 1</div></button>
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-proj"/></svg><span class="name">HorrorGame (2)</span><span class="marks"><svg><use href="#i-claude"/></svg></span></div><div class="path">~/Desktop/project/demo/HorrorGame</div><div class="store"><svg><use href="#i-archive"/></svg>R2 storage 2</div></button>
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-folder"/></svg><span class="name">testProjectNonGit</span><span class="marks"><svg><use href="#i-codex"/></svg></span></div><div class="path">~/Desktop/project/testProjectNonGit</div><div class="store none"><svg><use href="#i-archive"/></svg>No storage linked</div></button>
          <button class="proj-card" type="button"><div class="top"><svg><use href="#i-folder"/></svg><span class="name">demo</span><span class="marks"><svg><use href="#i-codex"/></svg></span></div><div class="path">~/Desktop/project/demo/testProjectNonGit_demo</div><div class="store none"><svg><use href="#i-archive"/></svg>No storage linked</div></button>
        </div>
      </section>

      <section class="only-empty">
        <div class="landing-hero">
          <div class="landing-mark"><img src="/mallard-logo-duck.svg" alt=""></div>
          <h1>No projects yet</h1>
          <div class="landing-actions"><button class="btn btn-primary" type="button"><svg width="13" height="13"><use href="#i-plus"/></svg>Add project…</button></div>
        </div>
      </section>

    </main>
  </div>
</div>
<script>
  const root = document.documentElement;
  document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => {
    root.setAttribute('data-' + b.dataset.set, b.dataset.val);
  }));
  document.getElementById('theme').addEventListener('click', () => {
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
