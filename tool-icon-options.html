<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool-call icon — live specimen</title>
    <style>
      /* Page chrome only. Everything inside .specimen-surface is the shipped skin. */
      /* App.css pins html/body/#root to 100% with overflow hidden for the Tauri
         shell; a specimen is a document and needs to scroll. Vite injects the
         imported stylesheet after this block, so these out-specify it rather
         than merely follow it. */
      html:root { height: auto; overflow: visible; }
      :root > body { height: auto; min-height: 100%; overflow: visible; }
      body > #root { height: auto; overflow: visible; }
      body { margin: 0; background: var(--bg-0, #14110d); color: var(--text-1, #ccc); }
      .specimen-page { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 34px;
        font-family: var(--font, system-ui); }
      .specimen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
        border-bottom: 1px solid var(--border, #333); padding-bottom: 18px; }
      .specimen-head h1 { margin: 0 0 6px; font-size: 20px; color: var(--text-0); }
      .specimen-head p { margin: 0; font-size: 13px; color: var(--text-2); max-width: 64ch; line-height: 1.5; }
      .specimen-controls { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
      section > h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
        color: var(--text-2); font-weight: 400; }
      .specimen-lead { margin: 0 0 16px; font-size: 13px; color: var(--text-2); max-width: 74ch; line-height: 1.5; }

      .specimen-rows { display: flex; flex-direction: column; gap: 16px; max-width: 560px; }
      .specimen-row-label { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; font-size: 12px; }
      .specimen-row-label b { color: var(--text-0); }
      .specimen-row-label span { color: var(--text-3); }
      .specimen-surface { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
        background: var(--surface-row, transparent); }

      .specimen-shapes { display: flex; flex-wrap: wrap; gap: 28px; }
      .specimen-shape { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; }
      .specimen-shape b { color: var(--text-0); }
      .specimen-shape-marks { display: flex; align-items: flex-end; gap: 14px; color: var(--text-2); }
      .specimen-big { padding: 8px; border: 1px solid var(--border); border-radius: 4px;
        color: var(--text-1);
        /* One line per grid cell, so an off-grid stem is visible rather than argued about. */
        background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px),
                          linear-gradient(to bottom, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px);
        background-size: 4px 4px; background-position: 8px 8px; }

      .specimen-paths { display: flex; flex-direction: column; gap: 12px; font-size: 11.5px; }
      .specimen-paths b { display: block; margin-bottom: 3px; color: var(--text-0); font-size: 12px; }
      .specimen-paths code { display: block; max-width: 100%; overflow-x: auto; padding: 7px 9px;
        border: 1px solid var(--border); border-radius: 4px; color: var(--text-2);
        font-family: var(--font-mono); white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tool-icon-options.tsx"></script>
  </body>
</html>
