<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discard draft — desktop choices</title>
    <style>
      /* App.css locks html, body and #root for the app shell; #root scrolls. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .spec { max-width: 1240px; margin: 0 auto; padding: 16px 20px 120px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .spec-title { font: 700 20px/1.2 system-ui; }
      .spec-sub { margin-top: -10px; color: var(--text-2); max-width: 1000px; }
      .spec-controls { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .spec-group > span { margin-right: 4px; color: var(--text-2); font-weight: 600; }
      .spec-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .spec-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .spec-h2 { margin: 14px 0 0; font: 700 16px/1.3 system-ui; }
      .spec-lede { margin: -12px 0 0; color: var(--text-2); max-width: 900px; }
      .spec-panel { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); }
      .spec-panel table { border-collapse: collapse; font-size: 12.5px; }
      .spec-panel th, .spec-panel td { padding: 4px 14px 4px 0; text-align: left; vertical-align: top; }
      .spec-panel th { color: var(--text-2); font-weight: 600; }
      .spec-row { display: grid; gap: 22px; align-items: start; }
      .spec-col-title { margin: 0 0 4px; font: 700 14px/1.3 system-ui; }
      .spec-col-title small { margin-right: 6px; color: var(--text-3); font-weight: 600; }
      .spec-col-title em { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--text-0); color: var(--bg-0); font: 600 11px/1.5 system-ui; font-style: normal; }
      .spec-col-note { margin: 0 0 8px; color: var(--text-2); font-size: 12px; max-width: 900px; }
      .spec-frame { position: relative; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--bg-0); }
      .spec-frame.tall { min-height: 348px; }
      .spec-frame.short { min-height: 0; }
      .spec-frame > .sync-pathbar { border-radius: 11px 11px 0 0; }
      .spec-frame .sync-main { height: auto !important; min-height: 0 !important; overflow: visible !important; padding: 12px 18px 16px; }
      .spec-hint { margin: 0; color: var(--text-3); font-size: 12px; }
      .spec-anchor { position: relative; display: inline-flex; }

      /* The system's dialog, drawn: the app cannot style it. */
      .spec-scrim { position: relative; display: grid; place-items: center; min-height: 300px; padding: 26px; border-radius: 0 0 11px 11px; background: color-mix(in srgb, var(--text-0) 28%, transparent); }
      .spec-alert { width: 292px; padding: 20px 18px 16px; border-radius: 14px; background: #ececec; color: #1d1d1f; box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35); font: 13px/1.38 -apple-system, system-ui, sans-serif; text-align: center; }
      .spec-alert-mark { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 12px; background: #f6c343; color: #1d1d1f; font: 800 28px/1 system-ui; }
      .spec-alert h3 { margin: 0 0 6px; font: 700 13px/1.3 -apple-system, system-ui, sans-serif; }
      .spec-alert p { margin: 0 0 8px; font-size: 11.5px; white-space: pre-line; }
      .spec-alert-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
      .spec-alert-buttons span { padding: 5px 0; border-radius: 6px; background: #fff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.22), 0 1px 1px rgba(0, 0, 0, 0.12); font-weight: 500; }
      .spec-alert-buttons span.default { background: #0a7aff; color: #fff; }

      /* ——— proposed app CSS ———————————————————————————————————— */
      /* C: a text pill in the menu's footer can be a danger verb, as an icon
         pill already can. */
      .sync-path-menu-tail.danger { color: var(--danger-text); }
      /* B: the Cloud chip as a menu button. Same box, same width; a chevron
         inside the existing padding. */
      button.sync-path-cloud-status { font: inherit; cursor: pointer; }
      button.sync-path-cloud-status > .sync-path-chevron { margin-left: -1px; }
      /* In-app confirmation: the app's modal, narrow. */
      .spec-frame .sync-discard-dialog { position: relative; display: flex; flex-direction: column; width: min(460px, 100%); max-height: none; margin: 0; }
      .sync-discard-dialog .sync-modal-body { display: grid; gap: 8px; padding: 12px 18px 16px; }
      .sync-discard-dialog .sync-modal-body p { margin: 0; }
      .sync-discard-dialog .btn.danger { color: var(--danger-text); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cloud-discard-mockup.tsx"></script>
  </body>
</html>
