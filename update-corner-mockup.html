<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update corner — directions</title>
    <style>
      /* App.css locks html, body and #root at overflow: hidden for the app
         shell; here #root is the one scroller. */
      html, body { height: 100%; overflow: hidden !important; }
      body { display: block !important; padding: 0 !important; background: var(--bg-0) !important; color: var(--text-0); }
      #root { height: 100%; overflow-y: auto !important; }

      /* ——— specimen chrome (not app CSS) ——————————————————————— */
      .uc-spec { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px; display: grid; gap: 18px; font: 13px/1.45 system-ui, sans-serif; }
      .uc-spec h1.uc-title { font: 700 20px/1.2 system-ui; }
      .uc-spec h2.uc-h2 { font: 700 15px/1.3 system-ui; margin: 8px 0 2px; }
      .uc-spec p.uc-lede { color: var(--text-2); max-width: 90ch; }
      .uc-controls { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); position: sticky; top: 0; z-index: 40; }
      .uc-row { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
      .uc-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
      .uc-group > span { color: var(--text-2); font-weight: 600; margin-right: 4px; }
      .uc-seg { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-1); font: 600 12px/1.2 system-ui; cursor: pointer; }
      .uc-seg[aria-pressed="true"] { background: var(--text-0); color: var(--bg-0); border-color: var(--text-0); }
      .uc-seg.play { border-style: dashed; }
      .uc-check { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; color: var(--text-1); }
      .uc-caption { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-card); color: var(--text-1); max-width: 100ch; }
      .uc-caption b { color: var(--text-0); }
      .uc-frame { height: 560px; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; position: relative; }
      .uc-frame > .sync-app { height: 100%; }
      .uc-placeholder { margin: 70px auto; max-width: 440px; text-align: center; color: var(--text-2); }
      .uc-placeholder strong { display: block; margin-bottom: 6px; color: var(--text-0); font-size: var(--type-md); }
      .uc-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
      .uc-cell { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-card); display: grid; gap: 8px; align-content: start; }
      .uc-cell > h3 { font: 600 12px/1.3 system-ui; color: var(--text-2); }
      .uc-cell > p { color: var(--text-3); font-size: 12px; }
      .uc-foot-sample { border-radius: var(--retro-panel-radius); overflow: hidden; }
      .uc-widths { display: grid; gap: 6px; }
      .uc-widths small { color: var(--text-3); font: 11px/1.2 ui-monospace, monospace; }
      .uc-notes { display: grid; gap: 4px; padding-left: 18px; }
      .uc-notes code, .uc-spec p code, .uc-caption code { font: 12px/1.3 ui-monospace, monospace; padding: 0 3px; border-radius: 4px; background: var(--chip-bg); }
      .uc-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .uc-two > div > h3 { font: 600 12px/1.3 system-ui; color: var(--text-2); margin-bottom: 6px; }
      @media (max-width: 1000px) { .uc-two { grid-template-columns: 1fr; } }
      /* The Before download modal is drawn inside the frame so the page's
         controls stay live; the real one is a top-layer <dialog>. */
      .uc-frame dialog.app-update-dialog { position: absolute; inset: 0; z-index: 20; margin: auto; height: fit-content; width: min(460px, 100% - 72px); }
      .app-update-dialog .sync-modal-body { padding: 18px 20px 20px; display: grid; gap: 10px; }
      .app-update-progress { width: 100%; height: 6px; accent-color: var(--accent); }
      .app-update-progress-label { margin: 0; color: var(--text-2); font-size: var(--type-xs); }
      .uc-backdrop { position: absolute; inset: 0; z-index: 19; background: rgb(0 0 0 / 0.18); }

      /* ——— specimen-only: the pill itself now ships in App.css ——— */
      /* B only: the download runs along the pill's floor. */
      .sync-update-pill { position: relative; overflow: hidden; }
      .sync-update-pill > * { position: relative; }
      .sync-update-pill .sync-update-fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--button-primary-text); }
      .sync-update-pill .sync-update-num { font-family: var(--font-mono); font-size: var(--type-xs); font-variant-numeric: tabular-nums; }
      .sync-update-pill .sync-update-spin { animation: spin 1s linear infinite; }
      .sync-update-when { color: var(--text-3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/update-corner-mockup.tsx"></script>
  </body>
</html>
